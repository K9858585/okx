<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZEC 全周期实时深度研判终端</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:600px;margin:0 auto}
h2{font-size:18px;margin:0 0 15px;color:#ff9f0a;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:opacity 0.2s;background:#ff9f0a;color:#000;box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.btn:active{opacity:0.7}
.btn:disabled{background:#30363d;color:#8b949e;box-shadow:none;cursor:not-allowed}
.sp{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}

/* 核心面板 */
.price-panel{text-align:center;margin-bottom:15px;padding-bottom:15px;border-bottom:1px dashed #30363d;}
.price-big{font-size:32px;font-weight:900;color:#fff;font-family:monospace;}
.price-chg{font-size:14px;font-weight:bold;margin-top:4px;}

/* 周期卡片 */
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.tf-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;}
.tf-title{font-size:13px;color:#8b949e;margin-bottom:6px;display:flex;justify-content:space-between;}
.tf-dir{font-size:15px;font-weight:bold;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#ff9f0a}

/* 指标 */
.ind-row{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;padding-bottom:4px;border-bottom:1px dashed rgba(48,54,61,0.5);}
.ind-row:last-child{border-bottom:none;}
.ind-label{color:#8b949e;}
.ind-val{font-weight:bold;color:#fff;}

/* 指令框 */
.action-box{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:15px;margin-top:15px;}
.action-title{font-size:15px;font-weight:bold;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.trade-item{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;font-family:monospace;}
.trade-item span:first-child{color:#8b949e;font-family:-apple-system,sans-serif;}
</style>
</head>
<body>

<h2>⚡ ZEC 全周期实时研判</h2>

<button class="btn" id="btnRun" onclick="startScan()">🔍 拉取实时数据并分析</button>

<div id="resultArea" style="display:none;">
  <!-- 价格 -->
  <div class="win price-panel">
    <div class="price-big" id="zecPrice">--</div>
    <div class="price-chg" id="zecChg">--</div>
  </div>

  <!-- 四周期状态 -->
  <div class="win">
    <div style="font-size:14px;font-weight:bold;color:#58a6ff;margin-bottom:10px;">📊 各周期趋势状态</div>
    <div class="tf-grid">
      <div class="tf-card">
        <div class="tf-title"><span>5分钟 (超短线)</span></div>
        <div class="tf-dir" id="tf-5m">--</div>
      </div>
      <div class="tf-card">
        <div class="tf-title"><span>1小时 (短线)</span></div>
        <div class="tf-dir" id="tf-1h">--</div>
      </div>
      <div class="tf-card">
        <div class="tf-title"><span>日线 (中线)</span></div>
        <div class="tf-dir" id="tf-1d">--</div>
      </div>
      <div class="tf-card">
        <div class="tf-title"><span>周线 (长线)</span></div>
        <div class="tf-dir" id="tf-1w">--</div>
      </div>
    </div>
  </div>

  <!-- 核心指标 -->
  <div class="win">
    <div style="font-size:14px;font-weight:bold;color:#58a6ff;margin-bottom:10px;">🔬 核心技术指标</div>
    <div class="ind-row"><span class="ind-label">日线 EMA20 (生命线)</span><span class="ind-val" id="ind-ema">--</span></div>
    <div class="ind-row"><span class="ind-label">日线 RSI(14)</span><span class="ind-val" id="ind-rsi">--</span></div>
    <div class="ind-row"><span class="ind-label">日线 MACD 状态</span><span class="ind-val" id="ind-macd">--</span></div>
  </div>

  <!-- 行动指令 -->
  <div class="win">
    <div class="action-box" id="actionBox">
      <div class="action-title" id="actTitle">--</div>
      <div id="actContent"></div>
    </div>
  </div>
</div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(5);
const baseCoin = 'ZEC-USDT-SWAP'; // 欧易 ZEC 永续

async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),6000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closed=d.filter(x=>x[8]==='1').reverse();
  for(const x of closed){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}

function calcRSI(closes, period=14){
  if(closes.length <= period) return [];
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  const rsi = [];
  rsi[period] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    let gain = diff >= 0 ? diff : 0;
    let loss = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
    rsi[i] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  }
  return new Array(period).fill(NaN).concat(rsi.slice(period));
}

function calcMACD(closes){
  const ema12 = calcEMA(closes, 12);
  const ema26 = calcEMA(closes, 26);
  const diff = ema12.map((v,i)=> v - ema26[i]);
  const dea = calcEMA(diff, 9);
  return { diff: diff[diff.length-1], dea: dea[dea.length-1], hist: (diff[diff.length-1] - dea[dea.length-1])*2 };
}

async function startScan() {
  const btn = $('btnRun');
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>拉取 ZEC 多周期数据...';

  try {
    // 1. 获取实时价格
    const tickRes = await fetchOKX(`/api/v5/market/ticker?instId=${baseCoin}`);
    if(tickRes.err) throw new Error("价格获取失败");
    const tick = tickRes.data[0];
    const last = parseFloat(tick.last);
    const open24 = parseFloat(tick.open24h);
    const chg = ((last - open24) / open24) * 100;
    
    $('zecPrice').innerText = `$${px(last)}`;
    $('zecChg').innerHTML = `24h 涨跌: <span class="${chg>=0?'L':'S'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span>`;

    // 2. 获取多个周期K线
    const [res5m, res1h, res1d, res1w] = await Promise.all([
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=5m&limit=100`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1H&limit=100`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1D&limit=100`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1W&limit=50`)
    ]);

    const k5m = parseK(res5m.data);
    const k1h = parseK(res1h.data);
    const k1d = parseK(res1d.data);
    const k1w = parseK(res1w.data);

    // 3. 各周期状态判断
    function getState(k) {
      const ema20 = calcEMA(k.c, 20);
      const ema50 = calcEMA(k.c, 50);
      const cur = k.c[k.c.length-1];
      const e20 = ema20[ema20.length-1];
      const e50 = ema50[ema50.length-1];
      
      if (e20 > e50 && cur > e20) return { text: '强势多头', cls: 'L' };
      if (e20 < e50 && cur < e20) return { text: '极弱空头', cls: 'S' };
      return { text: '震荡整理', cls: 'N' };
    }

    const s5m = getState(k5m);
    const s1h = getState(k1h);
    const s1d = getState(k1d);
    const s1w = getState(k1w);

    $('tf-5m').innerHTML = `<span class="${s5m.cls}">${s5m.text}</span>`;
    $('tf-1h').innerHTML = `<span class="${s1h.cls}">${s1h.text}</span>`;
    $('tf-1d').innerHTML = `<span class="${s1d.cls}">${s1d.text}</span>`;
    $('tf-1w').innerHTML = `<span class="${s1w.cls}">${s1w.text}</span>`;

    // 4. 指标计算 (日线)
    const ema20_1d = calcEMA(k1d.c, 20)[k1d.c.length-1];
    const rsi_1d = calcRSI(k1d.c, 14)[k1d.c.length-1];
    const macd_1d = calcMACD(k1d.c);

    $('ind-ema').innerText = `$${px(ema20_1d)} (当前价在${last > ema20_1d ? '上' : '下'})`;
    $('ind-ema').className = 'ind-val ' + (last > ema20_1d ? 'L' : 'S');

    $('ind-rsi').innerText = `${rsi_1d.toFixed(1)} (${rsi_1d > 70 ? '超买' : rsi_1d < 30 ? '超卖' : '中性'})`;
    $('ind-rsi').className = 'ind-val ' + (rsi_1d > 70 ? 'S' : rsi_1d < 30 ? 'L' : '');

    $('ind-macd').innerText = `${macd_1d.hist > 0 ? '金叉多头' : '死叉空头'} (${macd_1d.hist.toFixed(2)})`;
    $('ind-macd').className = 'ind-val ' + (macd_1d.hist > 0 ? 'L' : 'S');

    // 5. 生成交易指令
    let actHtml = '';
    let actTitle = '';

    // 逻辑判定：日线如果是空头，短线找高空机会
    if (last < ema20_1d && macd_1d.hist < 0) {
      // 偏空
      actTitle = `🔴 整体策略：反弹做空 (顺应日线趋势)`;
      const sl = Math.max(...k1h.h.slice(-5)) * 1.005;
      const risk = sl - last;
      const tp = last - risk * 2;
      
      actHtml = `
        <div class="trade-item"><span>当前状态</span><span class="S">日线空头明确，逢高做空</span></div>
        <div class="trade-item"><span>进场建议</span><span>${px(last)} (市价或逢高)</span></div>
        <div class="trade-item"><span>防守止损</span><span class="S">${px(sl)}</span></div>
        <div class="trade-item"><span>目标止盈</span><span class="L">${px(tp)}</span></div>
      `;
    } 
    // 如果短线超卖严重，给出博反弹提示
    else if (rsi_1d < 35 && s5m.cls === 'L') {
      actTitle = `🟢 整体策略：超跌反弹 (超短线试多)`;
      const sl = Math.min(...k5m.l.slice(-5)) * 0.995;
      const risk = last - sl;
      const tp = last + risk * 2;
      
      actHtml = `
        <div class="trade-item"><span>当前状态</span><span class="L">日线超卖+5m企稳，可博反弹</span></div>
        <div class="trade-item"><span>进场建议</span><span>${px(last)}</span></div>
        <div class="trade-item"><span>防守止损</span><span class="S">${px(sl)}</span></div>
        <div class="trade-item"><span>目标止盈</span><span class="L">${px(tp)}</span></div>
        <div style="font-size:12px;color:#8b949e;margin-top:10px;">⚠️ 逆势单，快进快出，不可恋战！</div>
      `;
    } 
    // 其他情况
    else {
      actTitle = `🟡 整体策略：观望等待`;
      actHtml = `<div style="font-size:14px;color:#8b949e;line-height:1.6;">当前多周期信号冲突，日线未明确，短线无强共振。此时进场容易被来回双杀，建议空仓等待。</div>`;
    }

    $('actTitle').innerHTML = actTitle;
    $('actContent').innerHTML = actHtml;

    $('resultArea').style.display = 'block';

  } catch(e) {
    alert("网络错误或代理失效，请刷新重试。");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔍 刷新数据';
  }
}
</script>
</body>
</html>
