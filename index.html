<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ETH 15m 短线波段辅助</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:500px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.price-box{font-size:36px;font-weight:800;color:#fff;margin:5px 0;font-family:monospace;}
.p-change{font-size:14px;font-weight:600;margin-bottom:15px;}
.status-bar{display:flex;justify-content:space-between;font-size:12px;color:#8b949e;margin-bottom:15px;padding-bottom:10px;border-bottom:1px dashed #30363d;}
.signal-box{padding:20px 15px;border-radius:12px;margin-bottom:15px;transition:all 0.3s;background:#161b22;border:1px solid #30363d;text-align:left;}
.signal-box.LONG{background:rgba(63,185,80,0.1);border-color:#3fb950;box-shadow:0 0 15px rgba(63,185,80,0.15);}
.signal-box.SHORT{background:rgba(248,81,73,0.1);border-color:#f85149;box-shadow:0 0 15px rgba(248,81,73,0.15);}
.sig-title{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center;}
.sig-title.LONG{color:#3fb950}.sig-title.SHORT{color:#f85149}.sig-title.WAIT{color:#8b949e}
.sig-desc{font-size:13px;color:#c9d1d9;line-height:1.5;text-align:center;margin-bottom:15px;}
.trade-plan{display:none;grid-template-columns:1fr;gap:12px;background:#0d1117;padding:15px;border-radius:10px;border:1px solid #30363d;}
.trade-plan.show{display:grid;}
.plan-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding-bottom:8px;border-bottom:1px dashed #21262d;}
.plan-row:last-child{border-bottom:none;padding-bottom:0;}
.plan-row span{color:#8b949e;}
.plan-row b{font-family:monospace;font-size:16px;}
.indicator-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:15px;}
.ind-card{background:#161b22;padding:10px;border-radius:8px;font-size:12px;text-align:center;border:1px solid #30363d;}
.ind-card .val{font-size:14px;font-weight:700;margin-top:4px;color:#fff;}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<h2>💎 ETH 15m 短线波段辅助</h2>

<div class="win">
  <div class="status-bar">
    <span id="updateTime">等待首次数据...</span>
    <span id="nextTimer">倒计时: --s</span>
  </div>
  
  <div class="price-box" id="ethPrice">---</div>
  <div class="p-change" id="priceChange">---</div>

  <div class="signal-box" id="signalBox">
    <div class="sig-title WAIT" id="sigTitle"><span class="sp"></span>计算中...</div>
    <div class="sig-desc" id="sigDesc">正在获取ETH 15分钟K线数据分析趋势</div>
    
    <div class="trade-plan" id="tradePlan">
      <div class="plan-row"><span>短线方向</span><b id="planDir">--</b></div>
      <div class="plan-row"><span>建议入场价位</span><b id="planEntry" style="color:#58a6ff;">--</b></div>
      <div class="plan-row"><span>防守止损点位</span><b id="planSL" style="color:#f85149;">--</b></div>
      <div class="plan-row"><span>目标止盈点位</span><b id="planTP" style="color:#3fb950;">--</b></div>
      <div class="plan-row" style="margin-top:5px; font-size:12px; color:#8b949e; border:none;">
        <span>盈亏比:</span><b style="color:#fff;">1:2 (高盈亏比)</b>
      </div>
    </div>
  </div>

  <div class="indicator-grid">
    <div class="ind-card">EMA(20)<div class="val" id="valEma20">--</div></div>
    <div class="ind-card">EMA(50)<div class="val" id="valEma50">--</div></div>
    <div class="ind-card">RSI(14)<div class="val" id="valRsi">--</div></div>
  </div>
</div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(5);

let audioCtx=null;
let countdown = 180; // 3分钟刷新一次
let timerInterval = null;
let lastSignalType = 'WAIT';

function playAlert(type){
  if(!audioCtx) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  osc.type = 'sine';
  if (type === 'LONG') osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  else osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  
  osc.frequency.exponentialRampToValueAtTime(type==='LONG'?1200:400, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),5000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closed=d.filter(x=>x[8]==='1');
  const data=[...closed].reverse();
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return {o,h,l,c};
}

function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}

function calcRSI(closes, period=14){
  if(closes.length <= period) return [];
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  const rsi = [];
  
  rsi[period] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    let gain = diff >= 0 ? diff : 0;
    let loss = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
    rsi[i] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  }
  return new Array(period).fill(NaN).concat(rsi.slice(period));
}

async function analyzeETH() {
    const res = await fetchOKX('/api/v5/market/candles?instId=ETH-USDT-SWAP&bar=15m&limit=100');
    if (res.err || !res.data || res.data.length < 60) {
        $('updateTime').innerText = '数据获取失败，重试中';
        return;
    }

    const k = parseK(res.data);
    const n = k.c.length;
    const curC = k.c[n-1];
    const curO = k.o[n-1];
    const prevC = k.c[n-2];

    const ema20 = calcEMA(k.c, 20);
    const ema50 = calcEMA(k.c, 50);
    const rsi = calcRSI(k.c, 14);

    const curEma20 = ema20[n-1];
    const curEma50 = ema50[n-1];
    const curRsi = rsi[n-1];

    // 更新UI价格
    $('ethPrice').innerText = px(curC);
    const change = (curC - prevC) / prevC * 100;
    $('priceChange').innerText = (change >= 0 ? '+' : '') + change.toFixed(2) + '% (较前一根)';
    $('priceChange').style.color = change >= 0 ? '#3fb950' : '#f85149';

    $('valRsi').innerText = curRsi.toFixed(1);
    $('valRsi').style.color = curRsi > 70 ? '#f85149' : (curRsi < 30 ? '#3fb950' : '#fff');
    $('valEma20').innerText = px(curEma20);
    $('valEma50').innerText = px(curEma50);
    
    const now = new Date();
    $('updateTime').innerText = `更新: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    // ===== 短线波段信号判断 =====
    let signalType = 'WAIT';
    let reason = '';
    let sl = 0, tp = 0;

    // 获取最近5根K线的极值，用于设置止损
    const lookback = 5;
    const recentLow = Math.min(...k.l.slice(-lookback));
    const recentHigh = Math.max(...k.h.slice(-lookback));

    // 均线差距过滤（太近说明在震荡盘整，不参与）
    const emaGap = Math.abs(curEma20 - curEma50) / curEma50;

    if (emaGap > 0.004) { // 均线拉开0.4%以上，有短期趋势
        if (curEma20 > curEma50 && curC > curEma20) {
            // 多头短线
            signalType = 'LONG';
            reason = '15m级别EMA20上穿EMA50，多头趋势明确，价格依托均线，建议顺势做多。';
            // 止损：最近5根低点或EMA20下方一点
            sl = Math.min(recentLow * 0.999, curEma20 * 0.995);
            if (sl >= curC) sl = curC * 0.99;
            // 止盈：盈亏比 1:2
            tp = curC + (curC - sl) * 2;
        } 
        else if (curEma20 < curEma50 && curC < curEma20) {
            // 空头短线
            signalType = 'SHORT';
            reason = '15m级别EMA20下穿EMA50，空头趋势明确，价格受制于均线，建议顺势做空。';
            // 止损：最近5根高点或EMA20上方一点
            sl = Math.max(recentHigh * 1.001, curEma20 * 1.005);
            if (sl <= curC) sl = curC * 1.01;
            // 止盈：盈亏比 1:2
            tp = curC - (sl - curC) * 2;
        }
    }

    if (signalType === 'WAIT') {
        if (emaGap <= 0.004) {
            reason = '当前 EMA20 与 EMA50 距离极近，属于震荡盘整期，无明确短线方向，建议观望。';
        } else if (curEma20 > curEma50) {
            reason = '大方向偏多，但当前价格跌破EMA20，短线正在回调。等待重新站上EMA20再做多。';
        } else {
            reason = '大方向偏空，但当前价格突破EMA20，短线正在反弹。等待重新跌破EMA20再做空。';
        }
    }

    // 渲染UI
    renderSignal(signalType, reason, curC, sl, tp);
}

function renderSignal(type, reason, curC, sl, tp) {
    const box = $('signalBox');
    const title = $('sigTitle');
    const desc = $('sigDesc');
    const plan = $('tradePlan');

    box.className = 'signal-box';
    title.className = 'sig-title';

    if (type === 'LONG') {
        box.classList.add('LONG');
        title.classList.add('LONG');
        title.innerText = '🚀 短线做多 (Long)';
        plan.classList.add('show');
        
        $('planDir').innerText = '做多 (Buy)'; $('planDir').style.color = '#3fb950';
        $('planEntry').innerText = px(curC);
        $('planSL').innerText = px(sl);
        $('planTP').innerText = px(tp);
        
        if (lastSignalType !== 'LONG' && lastSignalType !== 'WAIT') playAlert('LONG');
    } 
    else if (type === 'SHORT') {
        box.classList.add('SHORT');
        title.classList.add('SHORT');
        title.innerText = '🌊 短线做空 (Short)';
        plan.classList.add('show');
        
        $('planDir').innerText = '做空 (Sell)'; $('planDir').style.color = '#f85149';
        $('planEntry').innerText = px(curC);
        $('planSL').innerText = px(sl);
        $('planTP').innerText = px(tp);
        
        if (lastSignalType !== 'SHORT' && lastSignalType !== 'WAIT') playAlert('SHORT');
    } 
    else {
        title.classList.add('WAIT');
        title.innerText = '⏳ 观望 (Wait)';
        plan.classList.remove('show');
    }
    
    desc.innerText = reason;
    lastSignalType = type;
}

function startTicker() {
    analyzeETH();

    timerInterval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
            countdown = 180; // 3分钟刷新一次K线数据
            analyzeETH();
        }
        $('nextTimer').innerText = `刷新倒计时: ${countdown}s`;
    }, 1000);
}

window.onload = () => {
    document.body.addEventListener('click', () => {
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });
    
    startTicker();
};
</script>
</body>
</html>
