<script>
const BACKUP_COINS = [
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","DOTUSDT","SUIUSDT",
  "NEARUSDT","APTUSDT","OPUSDT","ARBUSDT","FILUSDT","LTCUSDT","BCHUSDT","UNIUSDT","INJUSDT","TIAUSDT"
];

const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
let audioCtx=null;
let timerOn=false;
let timerHandle=null, countdownHandle=null;
let isScanningDaily=false, isScanningEntry=false;
let originalTitle = document.title;

let instrumentListMap = {}; 

const state = {
  dailyResults: [],
  entryMap: {},
  scanDate: '',
  scanTime: 0
};

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ============ 5秒长响警报 + 系统通知 + 标题闪烁 ============
function playAlert() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'square'; 
    const t = audioCtx.currentTime;
    for (let i = 0; i < 10; i++) {
        osc.frequency.setValueAtTime(i % 2 === 0 ? 1000 : 800, t + i * 0.5);
    }
    gain.gain.setValueAtTime(1, t);
    gain.gain.setValueAtTime(1, t + 4.5);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 5.0);
    osc.start(t);
    osc.stop(t + 5.0);
  }

  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("🚨 扣扳机警报", {
      body: "15分钟级别出现入场信号，请立即查看！",
      tag: "entry-alert",
      renotify: true
    });
  }

  let isOriginal = true;
  let flashCount = 0;
  const flashInterval = setInterval(() => {
    document.title = isOriginal ? "🚨 扣扳机警报！" : originalTitle;
    isOriginal = !isOriginal;
    flashCount++;
    if (flashCount > 20) {
      clearInterval(flashInterval);
      document.title = originalTitle;
    }
  }, 500);
}

async function requestNotificationPermission() {
    if ("Notification" in window) {
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            try { await Notification.requestPermission(); } catch(e) {}
        }
    }
}

async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),7000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}
function parseK(d){
  const o=[],h=[],l=[],c=[],v=[];
  const closed=d.filter(x=>x[8]==='1');
  const data=[...closed].reverse();
  for(const x of data){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
    v.push(parseFloat(x[5]));
  }
  return{o,h,l,c,v};
}
function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}
async function batchFetch(tasks, concurrency=8){
  const results=new Array(tasks.length).fill(null);
  let idx=0;
  async function worker(){
    while(idx<tasks.length){
      const i=idx++;
      try{ results[i]=await tasks[i](); }catch(e){ results[i]=null; }
    }
  }
  await Promise.all(Array(Math.min(concurrency,tasks.length)).fill().map(worker));
  return results;
}

async function loadInstrumentsInfo() {
    if (Object.keys(instrumentListMap).length > 0) return;
    const res = await fetchOKX('/api/v5/public/instruments?instType=SWAP');
    if (res.err || !res.data) return;
    res.data.forEach(item => {
        instrumentListMap[item.instId] = { listTime: parseInt(item.listTime) || 0 };
    });
}

// ============ 获取 24h 成交额 > 500万 USDT 的币种 ============
async function getActiveCoinsByVolume() {
    const res = await fetchOKX('/api/v5/market/tickers?instType=SWAP');
    if (res.err || !res.data || res.data.length === 0) {
        return BACKUP_COINS.map(c=>c.replace('USDT','-USDT-SWAP'));
    }
    
    // 过滤 USDT 永续合约，并计算 24h 成交额 (USDT)
    const activeList = res.data.filter(t => {
        if (!t.instId.endsWith('USDT-SWAP')) return false;
        
        // 计算 24h 成交额：成交量(币数) * 最新价
        const volCcy24h = parseFloat(t.volCcy24h || 0);
        const lastPrice = parseFloat(t.last || 0);
        const turnoverUSDT = volCcy24h * lastPrice;
        
        // 只保留成交额 > 500万 USDT 的币种
        return turnoverUSDT >= 5000000;
    });

    // 按成交额降序排列（虽然不限制数量，但按活跃度排序有助于排查）
    activeList.sort((a, b) => {
        const volA = parseFloat(a.volCcy24h || 0) * parseFloat(a.last || 0);
        const volB = parseFloat(b.volCcy24h || 0) * parseFloat(b.last || 0);
        return volB - volA;
    });

    // 返回 instId 数组，不设上限
    return activeList.map(t => t.instId);
}

function analyzeDaily(kd, instId){
  const info = instrumentListMap[instId];
  if (info && info.listTime) {
      const daysOnline = (Date.now() - info.listTime) / (1000 * 3600 * 24);
      if (daysOnline < 45) return null; 
  }

  const {o,h,l,c}=kd;
  const n=c.length;
  if(n<25) return null;
  
  for (let i = Math.max(0, n - 5); i < n; i++) {
      if (c[i] > 0 && (h[i] - l[i]) / c[i] > 0.25) return null;
  }

  const ema5=calcEMA(c,5);
  const ema20=calcEMA(c,20);
  if(isNaN(ema20[n-1])||isNaN(ema5[n-1])) return null;

  const lastE5=ema5[n-1], lastE20=ema20[n-1], lastC=c[n-1];
  let direction=null;
  if(lastE5>lastE20 && lastC>lastE5 && lastC>lastE20) direction='LONG';
  else if(lastE5<lastE20 && lastC<lastE5 && lastC<lastE20) direction='SHORT';
  if(!direction) return null;

  let streak=0;
  for(let i=n-1;i>=0;i--){
    if(isNaN(ema5[i])||isNaN(ema20[i])) break;
    if(direction==='LONG'){
      if(l[i] > ema20[i] && c[i] > ema5[i]) streak++;
      else break;
    } else {
      if(h[i] < ema20[i] && c[i] < ema5[i]) streak++;
      else break;
    }
  }
  if(streak<3) return null;

  const cnt=Math.min(streak,10);
  const st=n-cnt;
  let sumBodyRatio=0;
  for(let i=st;i<n;i++){
    const range=h[i]-l[i];
    if(range<=0){ sumBodyRatio+=1; continue; }
    sumBodyRatio += Math.abs(c[i]-o[i])/range;
  }
  const avgBodyRatio=sumBodyRatio/cnt;

  const actCnt=Math.min(n,10);
  const ast=n-actCnt;
  let sumAmp=0;
  for(let i=ast;i<n;i++) sumAmp += (h[i]-l[i])/c[i]*100;
  const avgAmp=sumAmp/actCnt;
  if (avgAmp > 12) return null;

  const curRange = h[n-1] - l[n-1];
  let shadowPenalty = 0;
  if(curRange > 0) {
      const upperShadowRatio = (h[n-1] - Math.max(o[n-1], c[n-1])) / curRange;
      const lowerShadowRatio = (Math.min(o[n-1], c[n-1]) - l[n-1]) / curRange;
      if(direction === 'LONG' && upperShadowRatio > 0.3) shadowPenalty = (upperShadowRatio - 0.3) * 20; 
      if(direction === 'SHORT' && lowerShadowRatio > 0.3) shadowPenalty = (lowerShadowRatio - 0.3) * 20;
  }

  const streakScore=Math.min(streak*5,50);
  const shadowScore=avgBodyRatio*25;
  let actScore;
  if(avgAmp<=1) actScore=avgAmp*5;
  else if(avgAmp<=2) actScore=5+(avgAmp-1)*10;
  else if(avgAmp<=6) actScore=15+(avgAmp-2)/4*10;
  else if(avgAmp<=10) actScore=25-(avgAmp-6)/4*10;
  else actScore=Math.max(0,15-(avgAmp-10)*2);

  const score = Math.max(0, Math.round(streakScore + shadowScore + actScore - shadowPenalty));

  return {
    direction, streak, avgBodyRatio, avgAmp, score,
    ema5:lastE5, ema20:lastE20, curClose:lastC
  };
}

function find1hPullbackZone(k1h, direction) {
    const {h,l,c} = k1h;
    const n = h.length;
    if(n < 30) return {supports:[], resistances:[]};
    const curC = c[n-1];
    const ema20 = calcEMA(c, 20)[n-1];

    const swingHighs = [], swingLows = [];
    const w = 3;
    for(let i=w; i<n-w; i++){
        let isH=true, isL=true;
        for(let j=1; j<=w; j++){
            if(h[i]<=h[i-j] || h[i]<=h[i+j]) isH=false;
            if(l[i]>=l[i-j] || l[i]>=l[i+j]) isL=false;
        }
        if(isH) swingHighs.push(h[i]);
        if(isL) swingLows.push(l[i]);
    }

    if (direction === 'LONG') {
        let supports = swingLows.filter(x => x < curC).sort((a,b)=>b-a).slice(0, 2);
        if (ema20 < curC) supports.push(ema20);
        supports.sort((a,b)=>b-a); 
        return { supports, resistances: [] };
    } else {
        let resistances = swingHighs.filter(x => x > curC).sort((a,b)=>a-b).slice(0, 2);
        if (ema20 > curC) resistances.push(ema20);
        resistances.sort((a,b)=>a-b);
        return { supports: [], resistances };
    }
}

function check15mTrigger(k15m, direction, zone){
    const {o,h,l,c}=k15m;
    const n=c.length;
    if(n<10) return {signal:'WAIT',reason:'数据不足'};
    
    const ema5 = calcEMA(c, 5);
    const curC = c[n-1], prevC = c[n-2];
    const curO = o[n-1];
    const curE5 = ema5[n-1], prevE5 = ema5[n-2];

    if(direction === 'LONG'){
        const nearS = zone.supports.find(s => curC >= s*0.99 && curC <= s*1.01);
        const isTrigger = curC > curO && curC > prevC && curC > curE5 && curE5 > prevE5;

        if (nearS && isTrigger) {
            return {signal:'ENTRY', reason:`回踩1h支撑 ${px(nearS)} 附近，15m出现止跌阳线扣动扳机`, support:nearS};
        }
        if (nearS) {
            return {signal:'NEAR', reason:`已到达1h支撑 ${px(nearS)} 附近，等待15m收阳扣动扳机`, support:nearS};
        }
        return {signal:'WAIT', reason:'等待价格反向回调至1h支撑区'};
    } else {
        const nearR = zone.resistances.find(r => curC <= r*1.01 && curC >= r*0.99);
        const isTrigger = curC < curO && curC < prevC && curC < curE5 && curE5 < prevE5;

        if (nearR && isTrigger) {
            return {signal:'ENTRY', reason:`反弹至1h压力 ${px(nearR)} 附近，15m出现滞涨阴线扣动扳机`, resistance:nearR};
        }
        if (nearR) {
            return {signal:'NEAR', reason:`已到达1h压力 ${px(nearR)} 附近，等待15m收阴扣动扳机`, resistance:nearR};
        }
        return {signal:'WAIT', reason:'等待价格反向反弹至1h压力区'};
    }
}

async function scanDaily(force=false){
  if(isScanningDaily) return;
  isScanningDaily=true;
  $('btnScan').disabled=true;
  $('btnRescan').disabled=true;
  $('progress').innerHTML='<span class="sp"></span>获取活跃币与基础信息...';
  $('scanStatus').innerText='扫描中';

  await loadInstrumentsInfo();
  const activeCoins = await getActiveCoinsByVolume();

  $('progress').innerHTML='<span class="sp"></span>日线扫描中...';
  let done=0;
  const tasks=activeCoins.map(inst=>(async()=>{
    const res=await fetchOKX(`/api/v5/market/candles?instId=${inst}&bar=1D&limit=60`);
    done++;
    $('progress').innerText=`日线 ${done}/${activeCoins.length} (${Math.round(done/activeCoins.length*100)}%)`;
    if(res.err||!res.data||res.data.length<25) return null;
    
    const kd=parseK(res.data);
    const a=analyzeDaily(kd, inst);
    if(!a) return null;
    return {base:inst.split('-')[0], instId:inst, ...a};
  }));
  const dailyRaw=await batchFetch(tasks,10);
  const dailyPass=dailyRaw.filter(Boolean).sort((a,b)=>b.score-a.score);

  const filtered=dailyPass.filter(x=>x.score>=40);
  $('progress').innerHTML=`<span class="sp"></span>1h反向回调分析 (${filtered.length}个)...`;

  let done1=0;
  const tasks1=filtered.map(item=>(async()=>{
    const res=await fetchOKX(`/api/v5/market/candles?instId=${item.instId}&bar=1H&limit=100`);
    done1++;
    $('progress').innerText=`1h分析 ${done1}/${filtered.length}`;
    if(res.err||!res.data||res.data.length<30) return {...item, zone:{supports:[],resistances:[]}};
    const k1h=parseK(res.data);
    const zone=find1hPullbackZone(k1h, item.direction);
    return {...item, zone};
  }));
  const withZone=await batchFetch(tasks1,8);

  state.dailyResults=withZone;
  state.scanDate=todayStr();
  state.scanTime=Date.now();
  
  localStorage.setItem('okx_daily_scan_v9',JSON.stringify({
    date:state.scanDate, time:state.scanTime, results:state.dailyResults
  }));

  await scanEntry();

  $('progress').innerText='完成';
  $('scanStatus').innerText=`已扫描 (${state.dailyResults.length}个通过)`;
  $('btnScan').style.display='none';
  $('btnRescan').style.display='block';
  $('btnRescan').disabled=false;
  $('btnScan').disabled=false;
  isScanningDaily=false;
}

async function scanEntry(){
  if(isScanningEntry||state.dailyResults.length===0) return;
  isScanningEntry=true;
  const list=state.dailyResults;
  let done=0;
  const tasks=list.map(item=>(async()=>{
    const res=await fetchOKX(`/api/v5/market/candles?instId=${item.instId}&bar=15m&limit=50`);
    done++;
    $('progress').innerText=`15m监控 ${done}/${list.length}`;
    if(res.err||!res.data||res.data.length<10) return;
    const k15=parseK(res.data);
    const entry=check15mTrigger(k15, item.direction, item.zone||{supports:[],resistances:[]});
    state.entryMap[item.base]=entry;
  }));
  await batchFetch(tasks,8);
  isScanningEntry=false;
  render();
  
  let hasTrigger = false;
  let triggeredCoins = [];
  for (const base in state.entryMap) {
      if (state.entryMap[base].signal === 'ENTRY') {
          hasTrigger = true;
          triggeredCoins.push(base);
      }
  }
  if (hasTrigger) {
      playAlert(); 
      $('progress').innerHTML = `<span style="color:#3fb950;font-weight:bold;">🚨 扳机触发: ${triggeredCoins.join(', ')}</span>`;
  } else {
      $('progress').innerText = '监控完成，暂无入场';
  }
}

function render(){
  if(state.dailyResults.length===0){
    $('ranking').innerHTML='<div class="empty">暂无符合条件的活跃币种。</div>';
    return;
  }
  let html='';
  state.dailyResults.forEach((r,idx)=>{
    const dirTxt=r.direction==='LONG'?'多':'空';
    const dirCls=r.direction==='LONG'?'L':'S';
    const rankCls=idx===0?'top1':idx===1?'top2':idx===2?'top3':'';
    const rkCls=idx===0?'gold':idx===1?'silver':idx===2?'bronze':'';
    const entry=state.entryMap[r.base]||{signal:'WAIT',reason:'分析中...'};
    const eTag = {ENTRY:'<span class="tag entry">🎯 扣动扳机</span>',
                  NEAR:'<span class="tag near">⏳ 到达回调区</span>',
                  TREND:'<span class="tag trend">📈 趋势中·待回调</span>',
                  WAIT:'<span class="tag wait">⏸ 等待</span>'}[entry.signal]||'';
    const openCls = entry.signal==='ENTRY'?'open':'';
    html+=`
    <div class="rank-card ${rankCls}">
      <div class="rank-header" onclick="toggleCard('${r.base}')">
        <div>
          <div class="rh-left">
            <span class="rk ${rkCls}">#${idx+1}</span>
            <span class="coin">${r.base}</span>
            <span class="dir ${dirCls}">${dirTxt}</span>
            <span class="score-badge">${r.score}分</span>
            ${eTag}
          </div>
          <div class="rh-mid">站稳${r.streak}根 · 活跃${r.avgAmp.toFixed(2)}% · 实体占比${(r.avgBodyRatio*100).toFixed(0)}%</div>
        </div>
        <span class="arrow" id="arrow-${r.base}">▼</span>
      </div>
      <div class="rank-body ${openCls}" id="body-${r.base}">
        <div class="sec">
          <div class="sec-title">📊 日线定趋势</div>
          <div class="sec-body">
            <div class="row"><span>方向</span><b class="${dirCls}">${r.direction==='LONG'?'多头排列（EMA5>EMA20）':'空头排列（EMA5<EMA20）'}</b></div>
            <div class="row"><span>连续站稳</span><b>${r.streak} 根 (影线未刺穿)</b></div>
            <div class="row"><span>影线质量</span><b>${(r.avgBodyRatio*100).toFixed(1)}% 实体占比</b></div>
            <div class="row"><span>10日平均振幅</span><b>${r.avgAmp.toFixed(2)}%</b></div>
            <div class="row"><span>最新收盘</span><b>${px(r.curClose)}</b></div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">📈 1h 反向回调寻找入场点</div>
          <div class="sec-body">
            ${r.direction==='LONG' ? `
              <div class="row"><span>1h回调支撑区</span><b class="L">${r.zone.supports.length?r.zone.supports.map(px).join(' / '):'——'}</b></div>
              <div class="row"><span>距最近支撑</span><b>${r.zone.supports.length?((r.curClose-r.zone.supports[0])/r.curClose*100).toFixed(2)+'%':'——'}</b></div>
            ` : `
              <div class="row"><span>1h反弹压力区</span><b class="S">${r.zone.resistances.length?r.zone.resistances.map(px).join(' / '):'——'}</b></div>
              <div class="row"><span>距最近压力</span><b>${r.zone.resistances.length?((r.zone.resistances[0]-r.curClose)/r.curClose*100).toFixed(2)+'%':'——'}</b></div>
            `}
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">⏱️ 15m 回调扣扳机</div>
          <div class="sec-body">
            <div class="row"><span>状态</span><b>${eTag}</b></div>
            <div class="row"><span>信号</span><b style="text-align:right;max-width:65%">${entry.reason||'——'}</b></div>
            ${buildEntryPlan(r,entry)}
          </div>
        </div>
      </div>
    </div>`;
  });
  $('ranking').innerHTML=html;
}

function buildEntryPlan(r,entry){
  if(entry.signal!=='ENTRY'&&entry.signal!=='NEAR') return '';
  let plan='';
  const cur=r.curClose;
  if(r.direction==='LONG'){
    const s=entry.support||r.zone.supports[0]||cur*0.995;
    plan=`
      <div class="row"><span>建议入场</span><b class="L">${px(cur)} (市价/挂单)</b></div>
      <div class="row"><span>防守止损</span><b class="Y">${px(s*0.99)} (跌破1h支撑)</b></div>
      <div class="row"><span>短线止盈</span><b class="B">${px(cur*1.008)} ~ ${px(cur*1.012)}</b></div>`;
  } else {
    const resP=entry.resistance||r.zone.resistances[0]||cur*1.005;
    plan=`
      <div class="row"><span>建议入场</span><b class="S">${px(cur)} (市价/挂单)</b></div>
      <div class="row"><span>防守止损</span><b class="Y">${px(resP*1.01)} (突破1h压力)</b></div>
      <div class="row"><span>短线止盈</span><b class="B">${px(cur*0.992)} ~ ${px(cur*0.988)}</b></div>`;
  }
  return plan;
}

window.toggleCard=function(base){
  const body=document.getElementById('body-'+base);
  const arrow=document.getElementById('arrow-'+base);
  if(!body) return;
  if(body.classList.contains('open')){
    body.classList.remove('open'); arrow.textContent='▼';
  } else {
    body.classList.add('open'); arrow.textContent='▲';
  }
};

function restoreCache(){
  try{
    const raw=localStorage.getItem('okx_daily_scan_v9');
    if(!raw) return false;
    const cached=JSON.parse(raw);
    if(cached.date!==todayStr()) return false;
    state.dailyResults=cached.results||[];
    state.scanDate=cached.date;
    state.scanTime=cached.time;
    return state.dailyResults.length>0;
  }catch(e){return false;}
}

function startTimer(){
  if(timerOn) return;
  if(state.dailyResults.length===0){
    alert('请先扫描日线趋势。');
    return;
  }
  requestNotificationPermission();
  timerOn=true;
  $('btnTimer').innerText='🛑 停止 15m 巡航';
  $('btnTimer').classList.replace('b3','b2');
  scheduleNext();
  scanEntry();
}
function stopTimer(){
  timerOn=false;
  if(timerHandle) clearTimeout(timerHandle);
  if(countdownHandle) clearInterval(countdownHandle);
  timerHandle=null; countdownHandle=null;
  $('btnTimer').innerText='⏱️ 开启 15m 扣扳机巡航';
  $('btnTimer').classList.replace('b2','b3');
  $('countdown').innerText='--:--';
}
function scheduleNext(){
  const now=Date.now();
  const step=15*60*1000;
  const next=Math.ceil(now/step)*step+3000;
  if(timerHandle) clearTimeout(timerHandle);
  timerHandle=setTimeout(async()=>{
    await scanEntry();
    if(timerOn) scheduleNext();
  }, next-now);
  if(countdownHandle) clearInterval(countdownHandle);
  countdownHandle=setInterval(()=>{
    const left=Math.max(0,next-Date.now());
    const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
    $('countdown').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(left<=0) clearInterval(countdownHandle);
  },1000);
}

$('btnScan').onclick=()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  requestNotificationPermission();
  scanDaily();
};
$('btnRescan').onclick=()=>{
  if(!confirm('强制重扫会覆盖今日缓存，确定？')) return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  scanDaily(true);
};
$('btnTimer').onclick=()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(timerOn) stopTimer(); else startTimer();
};

(function init(){
  if(restoreCache()){
    $('scanStatus').innerText=`今日已扫描 (${state.dailyResults.length}个通过)`;
    $('btnScan').style.display='none';
    $('btnRescan').style.display='block';
    $('progress').innerText='读取今日缓存';
    scanEntry().then(()=>render());
  } else {
    $('scanStatus').innerText='今日未扫描';
    $('btnScan').style.display='block';
    $('btnRescan').style.display='none';
  }
})();
</script>
</body>
</html>
