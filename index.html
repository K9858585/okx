<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欧易 5m 箱体震荡探测终端 (v301)</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#ff9f0a;color:#000; box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;text-align:center; display:flex; justify-content:space-between;}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin:8px 0; animation: pop 0.3s ease-out;}
@keyframes pop { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.t{font-size:17px;font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#8b949e}.Y{color:#ff9f0a}.B{color:#58a6ff}
.info{font-size:13px;line-height:1.75;margin-top:6px; display:grid; grid-template-columns:1fr 1fr; gap:4px;}
.info span{color:#8b949e;}
.info b{color:#fff;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.empty{color:#8b949e;font-size:13px;padding:20px;text-align:center;border:1px dashed #30363d;border-radius:10px}
.badge{font-size:12px; padding:2px 8px; border-radius:12px; background:#21262d; border:1px solid #30363d;}
</style>
</head>
<body>

<div class="win">
  <h2><img src="https://www.okx.com/favicon.ico" width="20" height="20"> 5m 箱体震荡探测器</h2>
  <button class="btn b1" id="f1">🔍 扫描当前震荡币种</button>
  <div class="st">
    <span id="st1">准备就绪</span>
    <span id="percent" style="color:#ff9f0a; font-weight:bold;">0%</span>
  </div>
</div>

<div id="result-area">
  <div class="win" id="list-area" style="display:none;">
    <div style="font-size:14px; color:#8b949e; margin-bottom:10px;">💡 策略：靠近箱底做多，靠近箱顶做空，跌破/突破箱体严格止损。</div>
    <div id="out-cards"></div>
  </div>
</div>

<script>
// 你的 100 币种专属池
const FIXED_COINS = [
  "BTCUSDT", "ETHUSDT", "SOXLUSDT", "SNDKUSDT", "ZECUSDT", "SOLUSDT", "NVDAUSDT", "XAUUSDT", "ANTUSDT", "MMTUSDT",
  "MUUSDT", "XRPUSDT", "SKHYNIXUSDT", "SOXSUSDT", "HYPEUSDT", "PIEVERSEUSDT", "BREVUSDT", "XAGUSDT", "KORUUSDT", "DOGEUSDT",
  "PEPEUSDT", "SPCXUSDT", "NEARUSDT", "PIPPINUSDT", "SNXXUSDT", "CLUSDT", "PUMPUSDT", "SKHYUSDT", "MSTRUSDT", "UNIUSDT",
  "QQQUSDT", "LITUSDT", "AKEUSDT", "WLDUSDT", "AMDUSDT", "AAOIUSDT", "ENAUSDT", "FILUSDT", "SUIUSDT", "INTCUSDT",
  "ZHONGJIUSDT", "NBISUSDT", "BNBUSDT", "CRCLUSDT", "TRUMPUSDT", "PENGUUSDT", "ADAUSDT", "AAVEUSDT", "TQQQUSDT", "LINKUSDT",
  "GOOGLUSDT", "UNITREEUSDT", "MRVLUSDT", "BZUSDT", "LTCUSDT", "HUMAUSDT", "INJUSDT", "STRKUSDT", "LITEUSDT", "BCHUSDT",
  "AVAXUSDT", "ASTERUSDT", "TSLAUSDT", "IRYSUSDT", "CRWVUSDT", "DRAMUSDT", "TAOUSDT", "ZROUSDT", "ARBUSDT", "SAMSUNGUSDT",
  "ZILUSDT", "UPUSDT", "ZHIPUUSDT", "VVVUSDT", "BTWUSDT", "AAPLUSDT", "XPLUSDT", "ONDOUSDT", "TRXUSDT", "OKBUSDT",
  "TSMUSDT", "NESUSDT", "AXTIUSDT", "NIGHTUSDT", "SPYUSDT", "UVXYUSDT", "MUUUSDT", "DGAIUSDT", "GRAMUSDT", "XLMUSDT",
  "ICPUSDT", "SQQQUSDT", "CXMTUSDT", "BEUSDT", "SOPHUSDT", "PROSUSDT", "EWYUSDT", "USELESSUSDT", "ZKPUSDT", "OPUSDT"
];

const PROXIES = ["", "https://api.codetabs.com/v1/proxy?quest=", "https://corsproxy.io/?"];
const $=i=>document.getElementById(i);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);

async function okx(path, retries=2){
  const targetUrl = 'https://www.okx.com' + path;
  for(let i=0; i<=retries; i++){
    const proxy = PROXIES[i % PROXIES.length];
    const fetchUrl = proxy ? proxy + encodeURIComponent(targetUrl) : targetUrl;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    try{
      const r = await fetch(fetchUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if(r.status === 429 || r.status >= 500) continue;
      if(!r.ok) continue;
      const j = await r.json();
      if(j.code !== '0') return {err:`API:${j.msg}`};
      return {data:j.data};
    }catch(e){
      clearTimeout(timer);
      if(i === retries) return {err:`网络失败`};
      await sleep(300);
    }
  }
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1');
  const data=[...closedData].reverse();
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2])); l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

async function runScan() {
  $('st1').innerHTML = '<span class="sp"></span>并发拉取 5m 数据中...';
  $('list-area').style.display = 'none';
  
  const targetInstIds = FIXED_COINS.map(c => c.replace('USDT', '-USDT-SWAP'));
  
  let results = [];
  let done = 0;

  // 使用 Promise.all 瞬间并发请求
  const promises = targetInstIds.map(async (instId) => {
    // 拉取 45 根 5m K 线（剔除未收盘的，足够取最近 40 根）
    const kr = await okx(`/api/v5/market/candles?instId=${instId}&bar=5m&limit=45`);
    done++;
    $('percent').innerText = `${Math.round((done/100)*100)}%`;
    
    if (kr.err || !kr.data || kr.data.length < 40) return;

    const kp = parseK(kr.data);
    const { c, h, l } = kp;
    
    // 取最近 40 根
    const recent40 = { c: c.slice(-40), h: h.slice(-40), l: l.slice(-40) };
    const curPrice = recent40.c[recent40.c.length - 1];
    
    const maxH = Math.max(...recent40.h);
    const minL = Math.min(...recent40.l);
    
    // 1. 振幅过滤 (上下不破位, 且振幅在合理范围)
    const amp = (maxH - minL) / minL * 100;
    if (amp < 0.5 || amp > 3.5) return; // 振幅太小是死水，太大是趋势

    // 2. 箱体中间位过滤：价格不能卡在正中间（因为没法做盈亏比）
    const boxPos = (curPrice - minL) / (maxH - minL); // 0是底部，1是顶部
    if (boxPos > 0.2 && boxPos < 0.8) return; // 价格在中间，盈亏比极差，不推荐

    // 3. 触顶/触底次数统计（确保是真的在震荡，而不是单边阴跌后的横盘）
    let touchTop = 0, touchBottom = 0;
    for(let i=0; i<40; i++) {
        if(recent40.h[i] >= maxH * 0.998) touchTop++;
        if(recent40.l[i] <= minL * 1.002) touchBottom++;
    }
    
    // 必须上下都至少碰到过 2 次，才叫标准箱体
    if(touchTop < 2 || touchBottom < 2) return;

    const base = instId.split('-')[0];
    
    // 生成推荐策略
    let signal = '';
    let stopLoss = 0;
    let tp = 0;

    if (boxPos <= 0.2) {
      // 贴近箱底 -> 做多
      signal = 'LONG';
      stopLoss = minL * 0.995; // 跌破箱底 0.5% 止损
      tp = maxH; // 目标拿到箱顶
    } else {
      // 贴近箱顶 -> 做空
      signal = 'SHORT';
      stopLoss = maxH * 1.005; // 突破箱顶 0.5% 止损
      tp = minL; // 目标拿到箱底
    }

    results.push({
      base, curPrice, maxH, minL, amp, signal, stopLoss, tp, boxPos
    });
  });

  await Promise.all(promises);
  
  // 按振幅从小到大排序，优先推荐震荡最明显的
  results.sort((a, b) => a.amp - b.amp);

  if (results.length > 0) {
    let html = '';
    results.forEach(x => {
      const isLong = x.signal === 'LONG';
      const color = isLong ? '#3fb950' : '#f85149';
      const dirTxt = isLong ? '箱底做多 🚀' : '箱顶做空 🌊';
      
      html += `
        <div class="card">
          <div class="t">
            <span>${x.base}</span>
            <span class="badge" style="color:${color}">${dirTxt}</span>
          </div>
          <div class="info">
            <span>现价:</span> <b>${px(x.curPrice)}</b>
            <span>振幅:</span> <b>${x.amp.toFixed(2)}%</b>
            <span>箱顶(压力):</span> <b class="S">${px(x.maxH)}</b>
            <span>箱底(支撑):</span> <b class="L">${px(x.minL)}</b>
            <span>建议止损:</span> <b class="Y">${px(x.stopLoss)}</b>
            <span>建议止盈:</span> <b class="B">${px(x.tp)}</b>
          </div>
        </div>
      `;
    });
    $('out-cards').innerHTML = html;
    $('st1').innerText = `✅ 发现 ${results.length} 个标准震荡箱体`;
    $('list-area').style.display = 'block';
  } else {
    $('st1').innerText = `✅ 扫描完毕，暂无完美震荡箱体`;
    $('out-cards').innerHTML = `<div class="empty">最近 40 根 5m 线中，没有找到上下边界清晰、且价格卡在边缘的币种。</div>`;
    $('list-area').style.display = 'block';
  }
}

$('f1').onclick = runScan;
</script>
</body>
</html>
