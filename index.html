    :root {

    .status-box { text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; font-weight: 500; background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.3); color: var(--accent-gold); }

    .toggle-btn:active { background: #4a5568; }

<script>
const OKX_URL = "https://www.okx.com/api/v5/market/candles";
const NEWS_API = "https://cryptocurrency.cv/api";

const FIXED_COINS = [
    "ANT", "BTC", "ETH", "OKB", "SOL", "DOGE", "XRP", "BCH", "DOOD", "ZEC", "SNDK", 
    "XAU", "NVDA", "IRYS", "MMT", "PIEVERSE", "SOXL", "AKE", "PIPPIN", "SPCX", "SKHYNIX", 
    "BTW", "MU", "HUMA", "UP", "HYPE", "CL", "PEPE", "XAG", "CAP", "PROS", 
    "SENT", "YB", "AMD", "QQQ", "BREV", "RAVE", "INTC", "NESA", "SOXS", 
    "PUMP", "TRUMP", "UNITREE", "NEAR", "SNXX", "PDD", "GOOGL", "KORU", "LIT", "INI", "USELESS"
];

let isRunning = false;
let isScanning = false; 
let timer1d, timer4h, timer15m, uiTimer;

// 两个独立的缓存池
let cachedCoins1D = [];
let cachedCoins4H = [];
let globalFearGreed = 50; 

function toggleTable(containerId, btnId) {
    const container = document.getElementById(containerId);
    const btn = document.getElementById(btnId);
    if (container.style.display === 'none') {
        container.style.display = 'block';
        btn.innerText = '收起';
    } else {
        container.style.display = 'none';
        btn.innerText = '展开';
    }
}

async function fetchMarketSentiment() {
    try {
        const fgRes = await fetch(`${NEWS_API}/market/fear-greed`);
        const fgJson = await fgRes.json();
        globalFearGreed = fgJson.value || 50;
        document.getElementById('fgiValue').innerText = globalFearGreed;
        document.getElementById('fgiValue').style.color = 
            globalFearGreed > 60 ? 'var(--accent-green)' : 
            globalFearGreed < 40 ? 'var(--accent-red)' : 'var(--accent-gold)';
        document.getElementById('fgiDesc').innerText = fgJson.classification || "Neutral";
    } catch (e) {
        document.getElementById('fgiValue').innerText = "--";
        document.getElementById('fgiDesc').innerText = "获取失败";
    }
}

async function fetchKlinesData(coin, interval) {
    const limit = 60;
    try {
        const okxSym = `${coin}-USDT-SWAP`;
        let okxInt = "15m";
        if (interval === "1d") okxInt = "1D";
        if (interval === "4h") okxInt = "4H";
        
        const res = await fetch(`${OKX_URL}?instId=${okxSym}&bar=${okxInt}&limit=${limit}`);
        const json = await res.json();
        if (json.code === "0" && json.data.length > 0) {
            const allData = json.data.reverse();
            const closedData = allData.filter(d => d[8] === '1');
            const currentData = allData[allData.length - 1];
            return {
                closed: closedData.map(d => ({ open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) })),
                current: { open: parseFloat(currentData[1]), high: parseFloat(currentData[2]), low: parseFloat(currentData[3]), close: parseFloat(currentData[4]) }
            };
        }
    } catch(e) {}
    return { closed: [], current: null };
}

function calcEMA(klines, period) {
    let ema = [], k = 2 / (period + 1), prevEma = klines[0].close;
    for (let i = 0; i < klines.length; i++) { prevEma = (klines[i].close - prevEma) * k + prevEma; ema.push(prevEma); }
    return ema;
}
function calcRSI(klines, period = 14) {
    if (klines.length <= period) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) { let diff = klines[i].close - klines[i-1].close; if (diff >= 0) gains += diff; else losses -= diff; }
    let avgGain = gains / period, avgLoss = losses / period;
    for (let i = period + 1; i < klines.length; i++) {
        let diff = klines[i].close - klines[i-1].close;
        avgGain = ((avgGain * (period - 1)) + (diff > 0 ? diff : 0)) / period;
        avgLoss = ((avgLoss * (period - 1)) + (diff < 0 ? -diff : 0)) / period;
    }
    return avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
}

// ================= 扫描 1D (独立) =================
async function scan1D() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    const tbody = document.getElementById('tbody1d');
    
    status.innerText = "⏳ 1D 整点收盘，正在独立定势...";
    tbody.innerHTML = ""; cachedCoins1D = [];

    for (let i = 0; i < FIXED_COINS.length; i++) {
        const coin = FIXED_COINS[i];
        const data = await fetchKlinesData(coin, "1d");
        if (data.closed.length < 30) continue;
        
        const k = data.closed;
        const ema5 = calcEMA(k, 5), ema20 = calcEMA(k, 20), rsi = calcRSI(k, 14);
        const lastIdx = k.length - 1;
        const c0 = k[lastIdx], c1 = k[lastIdx-1], c2 = k[lastIdx-2];
        const e5_0 = ema5[lastIdx], e20_0 = ema20[lastIdx];
        const e5_1 = ema5[lastIdx-1], e20_1 = ema20[lastIdx-1];
        const e5_2 = ema5[lastIdx-2], e20_2 = ema20[lastIdx-2];

        const noHugeCandles = !(Math.abs(c0.close - c0.open)/c0.open > 0.08) && !(Math.abs(c1.close - c1.open)/c1.open > 0.08) && !(Math.abs(c2.close - c2.open)/c2.open > 0.08);
        const longAlign = (e5_0 > e20_0) && (e5_1 > e20_1) && (e5_2 > e20_2);
        const shortAlign = (e5_0 < e20_0) && (e5_1 < e20_1) && (e5_2 < e20_2);
        const isBiasOk = Math.abs(c0.close - e20_0) / e20_0 < 0.15;

        let trend = null;
        if (noHugeCandles && isBiasOk) {
            if (longAlign && c0.close > e5_0 && rsi > 50 && rsi < 75) trend = "LONG";
            else if (shortAlign && c0.close < e5_0 && rsi < 50 && rsi > 25) trend = "SHORT";
        }

        if (trend) {
            cachedCoins1D.push({ coin, trend });
            tbody.innerHTML += `<tr><td>${coin}</td><td style="color:#aaa">${formatPrice(c0.close)}</td><td><span class="${trend==='LONG'?'tag-long':'tag-short'}">${trend==='LONG'?'多头':'空头'}</span></td></tr>`;
        }
        await new Promise(r => setTimeout(r, 120)); 
    }
    status.innerText = `✅ 1D 独立定势完成，锁定 ${cachedCoins1D.length} 个币。`;
    isScanning = false;
}

// ================= 扫描 4H (独立) =================
async function scan4H() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    const tbody = document.getElementById('tbody4h');
    
    status.innerText = "⏳ 4H 整点收盘，正在独立定势...";
    tbody.innerHTML = ""; cachedCoins4H = [];

    for (let i = 0; i < FIXED_COINS.length; i++) {
        const coin = FIXED_COINS[i];
        const data = await fetchKlinesData(coin, "4h");
        if (data.closed.length < 30) continue;
        
        const k = data.closed;
        const ema5 = calcEMA(k, 5), ema20 = calcEMA(k, 20), rsi = calcRSI(k, 14);
        const lastIdx = k.length - 1;
        const c0 = k[lastIdx], c1 = k[lastIdx-1], c2 = k[lastIdx-2];
        const e5_0 = ema5[lastIdx], e20_0 = ema20[lastIdx];
        const e5_1 = ema5[lastIdx-1], e20_1 = ema20[lastIdx-1];
        const e5_2 = ema5[lastIdx-2], e20_2 = ema20[lastIdx-2];

        const noHugeCandles = !(Math.abs(c0.close - c0.open)/c0.open > 0.04) && !(Math.abs(c1.close - c1.open)/c1.open > 0.04) && !(Math.abs(c2.close - c2.open)/c2.open > 0.04);
        const longAlign = (e5_0 > e20_0) && (e5_1 > e20_1) && (e5_2 > e20_2);
        const shortAlign = (e5_0 < e20_0) && (e5_1 < e20_1) && (e5_2 < e20_2);
        const isBiasOk = Math.abs(c0.close - e20_0) / e20_0 < 0.08;

        let trend = null;
        if (noHugeCandles && isBiasOk) {
            if (longAlign && c0.close > e5_0 && rsi > 50 && rsi < 75) trend = "LONG";
            else if (shortAlign && c0.close < e5_0 && rsi < 50 && rsi > 25) trend = "SHORT";
        }

        if (trend) {
            cachedCoins4H.push({ coin, trend });
            tbody.innerHTML += `<tr><td>${coin}</td><td style="color:#aaa">${formatPrice(c0.close)}</td><td><span class="${trend==='LONG'?'tag-long':'tag-short'}">${trend==='LONG'?'多头':'空头'}</span></td></tr>`;
        }
        await new Promise(r => setTimeout(r, 120)); 
    }
    status.innerText = `✅ 4H 独立定势完成，锁定 ${cachedCoins4H.length} 个币。`;
    isScanning = false;
}

// ================= 15M 进场辅助函数 =================
async function run15mScan(pool, tbodyId) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = "";
    let count = 0;

    for (let i = 0; i < pool.length; i++) {
        const item = pool[i];
        const data15m = await fetchKlinesData(item.coin, "15m");
        if (data15m.closed.length < 21 || !data15m.current) continue;
        
        const latestClosed = data15m.closed[data15m.closed.length - 1];
        const prev20 = data15m.closed.slice(-21, -1); 
        const maxHigh20 = Math.max(...prev20.map(k => k.high));
        const minLow20 = Math.min(...prev20.map(k => k.low));
        const realTimePrice = data15m.current.close;
        
        let signalType = null, keyPrice = 0;
        let sentimentTag = `<span class="tag-news-bull">允许</span>`;
        const tolerance = 0.0015;

        if (item.trend === "LONG" && latestClosed.close < latestClosed.open) {
            const bearishK = prev20.filter(k => k.close < k.open);
            let targetLow = bearishK.length > 0 ? Math.min(...bearishK.map(k => k.low)) : minLow20;

            if (latestClosed.low <= targetLow * (1 + tolerance)) {
                if (!((latestClosed.open - latestClosed.close)/latestClosed.open > 0.01 && latestClosed.close - latestClosed.low < latestClosed.open - latestClosed.close)) {
                    if (globalFearGreed < 25) {
                        sentimentTag = `<span class="tag-news-bear">恐慌拦截</span>`;
                    } else {
                        signalType = "LONG"; keyPrice = targetLow;
                        if (realTimePrice < targetLow * 0.985) signalType = null; 
                    }
                }
            }
        }
        
        else if (item.trend === "SHORT" && latestClosed.close > latestClosed.open) {
            const bullishK = prev20.filter(k => k.close > k.open);
            let targetHigh = bullishK.length > 0 ? Math.max(...bullishK.map(k => k.high)) : maxHigh20;

            if (latestClosed.high >= targetHigh * (1 - tolerance)) {
                if (!((latestClosed.close - latestClosed.open)/latestClosed.open > 0.01 && latestClosed.high - latestClosed.close < latestClosed.close - latestClosed.open)) {
                    if (globalFearGreed > 80) {
                        sentimentTag = `<span class="tag-news-bear">贪婪拦截</span>`;
                    } else {
                        signalType = "SHORT"; keyPrice = targetHigh;
                        if (realTimePrice > targetHigh * 1.015) signalType = null;
                    }
                }
            }
        }

        if (signalType) {
            const tagClass = signalType === "LONG" ? "tag-long" : "tag-short";
            const tagText = signalType === "LONG" ? "踩底多" : "探顶空";
            tbody.innerHTML += `<tr><td>${item.coin}</td><td><span class="${tagClass}">${tagText}</span></td><td style="color:#00e5ff">${formatPrice(keyPrice)}</td><td style="color:#fff">${formatPrice(latestClosed.close)}</td></tr>`;
            count++;
        } else if (sentimentTag.includes("拦截")) {
            tbody.innerHTML += `<tr style="opacity:0.5"><td>${item.coin}</td><td>受限</td><td>${sentimentTag}</td><td style="color:#888">${formatPrice(latestClosed.close)}</td></tr>`;
        }
        await new Promise(r => setTimeout(r, 150)); 
    }
    return count;
}

// ================= 扫描 15M (双轨并行) =================
async function scan15M() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    status.innerText = "⏳ 15m 巡检中，正在进行双轨寻底/探顶...";

    // 独立运行 1D 池
    const count1d = await run15mScan(cachedCoins1D, 'tbody15m_1d');
    // 独立运行 4H 池
    const count4h = await run15mScan(cachedCoins4H, 'tbody15m_4h');

    status.innerText = `✅ 巡检完毕。1D轨捕获 ${count1d} 个，4H轨捕获 ${count4h} 个。`;
    isScanning = false;
}

// ================= 定时器 =================
function startCycle1D() {
    const intervalMs = 24 * 60 * 60 * 1000;
    const now = Date.now();
    const offset = 16 * 60 * 60 * 1000; 
    const nextTime = Math.ceil((now - offset) / intervalMs) * intervalMs + offset + 2000;
    timer1d = setTimeout(async () => { await scan1D(); await scan15M(); if (isRunning) startCycle1D(); }, nextTime - now);
}

function startCycle4H() {
    const intervalMs = 4 * 60 * 60 * 1000;
    const now = Date.now();
    const nextTime = Math.ceil(now / intervalMs) * intervalMs + 2000;
    timer4h = setTimeout(async () => { await scan4H(); await scan15M(); if (isRunning) startCycle4H(); }, nextTime - now);
}

function startCycle15M() {
    const intervalMs = 15 * 60 * 1000;
    const now = Date.now();
    const nextTime = Math.ceil(now / intervalMs) * intervalMs + 2000;
    timer15m = setTimeout(async () => { fetchMarketSentiment(); await scan15M(); if (isRunning) startCycle15M(); }, nextTime - now);
}

function updateCountdowns() {
    if (!isRunning) return;
    const now = Date.now();
    
    const offset = 16 * 60 * 60 * 1000;
    const diff1d = Math.max(0, (Math.ceil((now - offset) / 86400000) * 86400000 + offset + 2000) - now);
    document.getElementById('countdown1d').innerText = `${Math.floor(diff1d/3600000).toString().padStart(2,'0')}:${Math.floor((diff1d%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((diff1d%60000)/1000).toString().padStart(2,'0')}`;
    
    const diff4h = Math.max(0, (Math.ceil(now / 14400000) * 14400000 + 2000) - now);
    document.getElementById('countdown4h').innerText = `${Math.floor(diff4h/3600000).toString().padStart(2,'0')}:${Math.floor((diff4h%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((diff4h%60000)/1000).toString().padStart(2,'0')}`;
    
    const diff15m = Math.max(0, (Math.ceil(now / 900000) * 900000 + 2000) - now);
    document.getElementById('countdown15m').innerText = `${Math.floor(diff15m/60000).toString().padStart(2,'0')}:${Math.floor((diff15m%60000)/1000).toString().padStart(2,'0')}`;
}

function toggleAuto() {
    const btn = document.getElementById('masterBtn');
    const panel = document.getElementById('timerPanel');
    const status = document.getElementById('statusMain');

    if (isRunning) {
        isRunning = false;
        clearTimeout(timer1d); clearTimeout(timer4h); clearTimeout(timer15m); clearInterval(uiTimer);
        btn.innerText = "启动自动巡航"; btn.classList.remove('stop');
        panel.classList.remove('active'); status.innerText = "自动巡航已停止。";
    } else {
        isRunning = true;
        btn.innerText = "停止自动巡航"; btn.classList.add('stop');
        panel.classList.add('active'); status.innerText = "系统已启动，正在对齐收盘时间...";
        fetchMarketSentiment(); 
        updateCountdowns(); uiTimer = setInterval(updateCountdowns, 1000);
        
        // 启动时把三个级别独立跑一遍
        scan1D().then(() => scan4H()).then(() => scan15M());
        startCycle1D(); startCycle4H(); startCycle15M();
    }
}

function formatPrice(price) {
    if (price >= 100) return price.toFixed(2);
    if (price >= 1) return price.toFixed(4);
    if (price >= 0.01) return price.toFixed(5);
    return price.toFixed(6);
}
