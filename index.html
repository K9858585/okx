<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ETH 1m 极简做T辅助</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:500px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.price-box{font-size:36px;font-weight:800;color:#fff;margin:10px 0;font-family:monospace;}
.p-change{font-size:14px;font-weight:600;margin-bottom:15px;}
.status-bar{display:flex;justify-content:space-between;font-size:12px;color:#8b949e;margin-bottom:15px;padding-bottom:10px;border-bottom:1px dashed #30363d;}
.signal-box{padding:20px 15px;border-radius:12px;margin-bottom:15px;transition:all 0.3s;background:#161b22;border:1px solid #30363d;}
.signal-box.LONG{background:rgba(63,185,80,0.1);border-color:#3fb950;box-shadow:0 0 15px rgba(63,185,80,0.15);}
.signal-box.SHORT{background:rgba(248,81,73,0.1);border-color:#f85149;box-shadow:0 0 15px rgba(248,81,73,0.15);}
.sig-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.sig-title.LONG{color:#3fb950}.sig-title.SHORT{color:#f85149}.sig-title.WAIT{color:#8b949e}
.sig-desc{font-size:13px;color:#c9d1d9;line-height:1.5;}
.trade-plan{display:none;grid-template-columns:1fr;gap:10px;background:#0d1117;padding:15px;border-radius:10px;margin-top:15px;border:1px solid #30363d;text-align:left;}
.trade-plan.show{display:grid;}
.plan-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;}
.plan-row span{color:#8b949e;}
.plan-row b{font-family:monospace;font-size:16px;}
.indicator-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:15px;}
.ind-card{background:#161b22;padding:10px;border-radius:8px;font-size:12px;text-align:center;border:1px solid #30363d;}
.ind-card .val{font-size:14px;font-weight:700;margin-top:4px;color:#fff;}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<h2>💎 ETH 1m 极简做T辅助</h2>

<div class="win">
  <div class="status-bar">
    <span id="updateTime">等待首次数据...</span>
    <span id="nextTimer">倒计时: --s</span>
  </div>
  
  <div class="price-box" id="ethPrice">---</div>
  <div class="p-change" id="priceChange">---</div>

  <div class="signal-box" id="signalBox">
    <div class="sig-title WAIT" id="sigTitle"><span class="sp"></span>计算中...</div>
    <div class="sig-desc" id="sigDesc">正在获取ETH 1分钟K线数据</div>
    
    <div class="trade-plan" id="tradePlan">
      <div class="plan-row"><span>建议方向</span><b id="planDir">--</b></div>
      <div class="plan-row"><span>入场价格</span><b id="planEntry" style="color:#58a6ff;">--</b></div>
      <div class="plan-row"><span>止损点位 (防守)</span><b id="planSL" style="color:#f85149;">--</b></div>
      <div class="plan-row"><span>止盈点位 (目标)</span><b id="planTP" style="color:#3fb950;">--</b></div>
    </div>
  </div>

  <div class="indicator-grid">
    <div class="ind-card">RSI(14)<div class="val" id="valRsi">--</div></div>
    <div class="ind-card">EMA(7)<div class="val" id="valEma7">--</div></div>
    <div class="ind-card">EMA(21)<div class="val" id="valEma21">--</div></div>
  </div>
</div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(5);

let audioCtx=null;
let countdown = 60;
let timerInterval = null;
let lastSignalType = 'WAIT';

// ============ 提示音 ============
function playAlert(type){
  if(!audioCtx) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'LONG') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
  } else if (type === 'SHORT') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
  }
  
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// ============ API请求 ============
async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),5000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closed=d.filter(x=>x[8]==='1');
  const data=[...closed].reverse(); // 按时间正序
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return {o,h,l,c};
}

// ============ 指标计算 ============
function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}

function calcRSI(closes, period=14){
  if(closes.length <= period) return [];
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  const rsi = [];
  
  rsi[period] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    let gain = diff >= 0 ? diff : 0;
    let loss = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
    rsi[i] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  }
  return new Array(period).fill(NaN).concat(rsi.slice(period));
}

function calcBoll(closes, period=20, mult=2) {
    if (closes.length < period) return {upper:[], mid:[], lower:[]};
    const upper = [], mid = [], lower = [];
    for (let i = 0; i < closes.length; i++) {
        if (i < period - 1) { upper.push(NaN); mid.push(NaN); lower.push(NaN); continue; }
        const slice = closes.slice(i - period + 1, i + 1);
        const mean = slice.reduce((a,b)=>a+b, 0) / period;
        const variance = slice.reduce((a,b)=>a + Math.pow(b - mean, 2), 0) / period;
        const std = Math.sqrt(variance);
        mid.push(mean);
        upper.push(mean + mult * std);
        lower.push(mean - mult * std);
    }
    return {upper, mid, lower};
}

// ============ 核心分析逻辑 ============
async function analyzeETH() {
    const res = await fetchOKX('/api/v5/market/candles?instId=ETH-USDT-SWAP&bar=1m&limit=100');
    if (res.err || !res.data || res.data.length < 30) {
        $('updateTime').innerText = '数据获取失败，重试中';
        return;
    }

    const k = parseK(res.data);
    const n = k.c.length;
    const curC = k.c[n-1];
    const curO = k.o[n-1];
    const curH = k.h[n-1];
    const curL = k.l[n-1];
    const prevC = k.c[n-2];

    // 计算指标
    const ema7 = calcEMA(k.c, 7);
    const ema21 = calcEMA(k.c, 21);
    const rsi = calcRSI(k.c, 14);
    const boll = calcBoll(k.c, 20, 2);

    const curEma7 = ema7[n-1], curEma21 = ema21[n-1];
    const prevEma7 = ema7[n-2], prevEma21 = ema21[n-2];
    const curRsi = rsi[n-1];
    const curUpper = boll.upper[n-1];
    const curLower = boll.lower[n-1];
    const curMid = boll.mid[n-1];

    // 更新UI价格
    $('ethPrice').innerText = px(curC);
    const change = (curC - prevC) / prevC * 100;
    $('priceChange').innerText = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
    $('priceChange').style.color = change >= 0 ? '#3fb950' : '#f85149';

    $('valRsi').innerText = curRsi.toFixed(1);
    $('valRsi').style.color = curRsi > 70 ? '#f85149' : (curRsi < 30 ? '#3fb950' : '#fff');
    $('valEma7').innerText = px(curEma7);
    $('valEma21').innerText = px(curEma21);
    
    const now = new Date();
    $('updateTime').innerText = `更新: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    // ===== 信号判断 =====
    let signalType = 'WAIT';
    let reason = '';
    let sl = 0, tp = 0;

    // 做多逻辑：RSI超卖(<=32) + 价格跌破/触及布林下轨 + 收阳线
    if (curRsi <= 32 && curL <= curLower * 1.001 && curC > curO) {
        signalType = 'LONG';
        reason = '1m RSI极度超卖，价格触及布林下轨且收出阳线反转。';
        // 止损：最近3根最低点下方一点
        sl = Math.min(k.l[n-3], k.l[n-2], curL) * 0.9995;
        if (sl >= curC) sl = curC * 0.997; // 保底止损0.3%
        // 止盈：固定盈亏比1.5 (或布林中轨)
        tp = curC + (curC - sl) * 1.5;
    }
    // 做空逻辑：RSI超买(>=68) + 价格突破/触及布林上轨 + 收阴线
    else if (curRsi >= 68 && curH >= curUpper * 0.999 && curC < curO) {
        signalType = 'SHORT';
        reason = '1m RSI极度超买，价格触及布林上轨且收出阴线滞涨。';
        // 止损：最近3根最高点上方一点
        sl = Math.max(k.h[n-3], k.h[n-2], curH) * 1.0005;
        if (sl <= curC) sl = curC * 1.003;
        // 止盈：固定盈亏比1.5
        tp = curC - (sl - curC) * 1.5;
    }
    // 均线极速金叉（追单）
    else if (!isNaN(prevEma7) && prevEma7 <= prevEma21 && curEma7 > curEma21 && curRsi < 60 && curRsi > 40) {
        signalType = 'LONG';
        reason = '1m EMA7 上穿 EMA21，动能金叉形成。';
        sl = curEma21 * 0.998;
        tp = curC + (curC - sl) * 1.5;
    }
    // 均线极速死叉（追单）
    else if (!isNaN(prevEma7) && prevEma7 >= prevEma21 && curEma7 < curEma21 && curRsi < 60 && curRsi > 40) {
        signalType = 'SHORT';
        reason = '1m EMA7 下穿 EMA21，动能死叉形成。';
        sl = curEma21 * 1.002;
        tp = curC - (sl - curC) * 1.5;
    }
    // 观望
    else {
        if (curC > curUpper) reason = '价格在布林上轨外，严重超买，切勿追多，等待回落。';
        else if (curC < curLower) reason = '价格在布林下轨外，严重超卖，切勿追空，等待企稳。';
        else if (curEma7 > curEma21) reason = '短线多头趋势，等待回踩布林下轨或均线支撑做多。';
        else reason = '短线空头趋势，等待反弹布林上轨或均线压力做空。';
    }

    // 渲染UI
    renderSignal(signalType, reason, curC, sl, tp);
}

function renderSignal(type, reason, curC, sl, tp) {
    const box = $('signalBox');
    const title = $('sigTitle');
    const desc = $('sigDesc');
    const plan = $('tradePlan');

    box.className = 'signal-box';
    title.className = 'sig-title';

    if (type === 'LONG') {
        box.classList.add('LONG');
        title.classList.add('LONG');
        title.innerText = '🚀 做多 (Buy)';
        plan.classList.add('show');
        
        $('planDir').innerText = '做多'; $('planDir').style.color = '#3fb950';
        $('planEntry').innerText = px(curC);
        $('planSL').innerText = px(sl);
        $('planTP').innerText = px(tp);
        
        if (lastSignalType !== 'LONG' && lastSignalType !== 'WAIT') playAlert('LONG');
    } 
    else if (type === 'SHORT') {
        box.classList.add('SHORT');
        title.classList.add('SHORT');
        title.innerText = '🌊 做空 (Sell)';
        plan.classList.add('show');
        
        $('planDir').innerText = '做空'; $('planDir').style.color = '#f85149';
        $('planEntry').innerText = px(curC);
        $('planSL').innerText = px(sl);
        $('planTP').innerText = px(tp);
        
        if (lastSignalType !== 'SHORT' && lastSignalType !== 'WAIT') playAlert('SHORT');
    } 
    else {
        title.classList.add('WAIT');
        title.innerText = '⏳ 观望 (Wait)';
        plan.classList.remove('show');
    }
    
    desc.innerText = reason;
    lastSignalType = type;
}

// ============ 定时器 ============
function startTicker() {
    // 立即执行一次
    analyzeETH();

    // 倒计时
    timerInterval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
            countdown = 60;
            analyzeETH();
        }
        $('nextTimer').innerText = `刷新倒计时: ${countdown}s`;
    }, 1000);
}

// 页面加载完成后启动
window.onload = () => {
    // 用户交互后激活AudioContext（绕过浏览器自动播放限制）
    document.body.addEventListener('click', () => {
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });
    
    startTicker();
};
</script>
</body>
</html>
