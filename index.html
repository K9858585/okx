<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欧意合约信号扫描</title>
<style>
    body { font-family: sans-serif; padding: 15px; background: #111; color: #eee; }
    h2 { text-align: center; color: #00e5ff; margin-bottom: 5px;} /* 欧意蓝 */
    .desc { text-align: center; color: #888; font-size: 12px; margin-bottom: 15px;}
    #status { text-align: center; color: #ffb300; margin-bottom: 15px; font-weight: bold; font-size: 14px; min-height: 20px;}
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: center; }
    th { background: #222; color: #aaa; }
    .long { color: #00e676; font-weight: bold; }
    .avoid { color: #ff5252; font-weight: bold; }
    .btn { display: block; width: 100%; padding: 12px; background: #00e5ff; color: #000; 
           text-align: center; font-weight: bold; border: none; border-radius: 5px; font-size: 16px; margin-bottom: 15px; }
    .btn:disabled { background: #555; color: #aaa; }
</style>
</head>
<body>

<h2>欧意合约信号扫描</h2>
<div class="desc">4H EMA多头 + 5m 10K回调策略 (欧意数据源)</div>
<button class="btn" id="scanBtn" onclick="scanMarket()">开始扫描 (约需1-2分钟)</button>
<div id="status">等待扫描...</div>

<table id="resultTable" style="display:none;">
    <thead>
        <tr>
            <th>币种</th><th>4H收盘</th><th>5m信号</th><th>参考价</th><th>现价</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
// 使用欧意专门给开发者提供的备用 CDN 域名，国内连通性极佳
const BASE_URL = "https://www.okx.com"; 
const TOP_N = 100;

// 获取成交额前100的USDT永续合约
async function getTopSwapSymbols() {
    const res = await fetch(`${BASE_URL}/api/v5/market/tickers?instType=SWAP`);
    const json = await res.json();
    let data = json.data.filter(d => d.instId.endsWith("-USDT-SWAP"));
    data.sort((a, b) => parseFloat(b.volCcy24h) - parseFloat(a.volCcy24h));
    return data.slice(0, TOP_N).map(d => d.instId);
}

// 获取K线数据（欧意返回的是倒序，需要 reverse）
async function fetchKlines(instId, bar, limit=60) {
    const res = await fetch(`${BASE_URL}/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`);
    const json = await res.json();
    return json.data.reverse().map(d => ({
        open: parseFloat(d[1]), high: parseFloat(d[2]),
        low: parseFloat(d[3]), close: parseFloat(d[4])
    }));
}

// 计算EMA
function calcEMA(klines, period) {
    let ema = [];
    let k = 2 / (period + 1);
    let prevEma = klines[0].close;
    for (let i = 0; i < klines.length; i++) {
        prevEma = (klines[i].close - prevEma) * k + prevEma;
        ema.push(prevEma);
    }
    return ema;
}

// 检查4H趋势
function check4HTrend(klines) {
    if (klines.length < 30) return { trendOk: false };
    const ema5 = calcEMA(klines, 5);
    const ema20 = calcEMA(klines, 20);
    const lastIdx = klines.length - 1;
    const close = klines[lastIdx].close;
    const e5 = ema5[lastIdx], e20 = ema20[lastIdx];
    const e5Prev = ema5[lastIdx - 1];
    
    // 收盘价站上两线，EMA5>EMA20，且EMA5向上
    const trendOk = (close > e5) && (close > e20) && (e5 > e20) && (e5 > e5Prev);
    return { trendOk, close };
}

// 检查5m入场
function check5mEntry(klines) {
    if (klines.length < 10) return null;
    const last10 = klines.slice(-10);
    const high10 = Math.max(...last10.map(k => k.high));
    const low10 = Math.min(...last10.map(k => k.low));
    const currentPrice = klines[klines.length - 1].close;
    const threshold = 0.0015; // 0.15% 容差

    const nearLow = Math.abs(currentPrice - low10) / low10 <= threshold;
    const nearHigh = Math.abs(currentPrice - high10) / high10 <= threshold;

    if (nearLow) return { signal: "LONG", refPrice: low10, current: currentPrice };
    if (nearHigh) return { signal: "AVOID", refPrice: high10, current: currentPrice };
    return null;
}

// 主扫描函数
async function scanMarket() {
    const btn = document.getElementById('scanBtn');
    const status = document.getElementById('status');
    const table = document.getElementById('resultTable');
    const tbody = document.getElementById('tableBody');
    
    btn.disabled = true;
    btn.innerText = "正在扫描，请保持屏幕常亮...";
    tbody.innerHTML = "";
    table.style.display = "table";
    let count = 0;

    try {
        status.innerText = "正在获取成交额前100的币种...";
        const symbols = await getTopSwapSymbols();
        
        for (let i = 0; i < symbols.length; i++) {
            const sym = symbols[i];
            // 欧意返回的名字是 BTC-USDT-SWAP，为了表格好看，去掉后缀
            const displaySym = sym.replace("-USDT-SWAP", "");
            status.innerText = `正在分析 (${i+1}/${symbols.length}): ${displaySym}`;
            
            try {
                const k4h = await fetchKlines(sym, "4H", 60);
                if (k4h.length === 0) continue;
                
                const check4h = check4HTrend(k4h);
                if (!check4h.trendOk) continue;

                const k5m = await fetchKlines(sym, "5m", 30);
                const entry = check5mEntry(k5m);
                
                if (entry) {
                    const tr = document.createElement('tr');
                    const cls = entry.signal === "LONG" ? "long" : "avoid";
                    tr.innerHTML = `
                        <td>${displaySym}</td>
                        <td>${check4h.close.toFixed(6)}</td>
                        <td class="${cls}">${entry.signal}</td>
                        <td>${entry.refPrice.toFixed(6)}</td>
                        <td>${entry.current.toFixed(6)}</td>
                    `;
                    tbody.appendChild(tr);
                    count++;
                }
                
                await new Promise(r => setTimeout(r, 150));
                
            } catch (e) {
                console.error(sym, "请求失败", e);
            }
        }
        status.innerText = `扫描完成！共发现 ${count} 个符合信号。`;
    } catch (err) {
        status.innerText = `请求失败，请检查网络或关闭VPN重试。`;
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.innerText = "重新扫描";
    }
}
</script>

</body>
</html>
