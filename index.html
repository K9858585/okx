.L{color:#3fb950}.S{color:#f85149}.Y{color:#ff9f0a}.B{color:#58a6ff}.N{color:#8b949e}

.tag.near{background:#2a2210;color:#ff9f0a;border:1px solid #ff9f0a}

.warn-bar{background:rgba(218,54,51,0.1);border:1px solid #da3633;color:#f85149;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px;text-align:center;}

<body>

<div class="win">
  <h2><img src="https://www.okx.com/favicon.ico" width="20" height="20"> 日线定向 · 1H回调 · 15m扣扳机</h2>
  <div class="warn-bar">📢 提示：请保持页面前台运行，允许“发送通知”以免漏掉入场警报。</div>
  
  <button class="btn b1" id="btnScan">🔍 扫描前50主流币（定大方向）</button>
  <button class="btn b3" id="btnTimer">⏱️ 开启 15m 扣扳机巡航</button>
  <button class="btn b4" id="btnRescan" style="display:none">🔄 强制重扫日线</button>
  <div class="st"><span class="lbl">日线扫描状态</span><span class="val" id="scanStatus">未扫描</span></div>
  <div class="st"><span class="lbl">下次 15m 扫描</span><span class="timer" id="countdown">--:--</span></div>
  <div class="st"><span class="lbl">状态 / 警报</span><span class="val" id="progress">-</span></div>
</div>

<div id="ranking"><div class="empty">尚未扫描，点击上方按钮获取当前成交额前50的币种，并定日线大方向。</div></div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
let audioCtx=null;
let timerOn=false;
let timerHandle=null, countdownHandle=null;
let isScanningDaily=false, isScanningEntry=false;
let originalTitle = document.title;

const state = {
  dailyResults: [],
  entryMap: {},
  scanDate: '',
  scanTime: 0
};

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ============ 5秒长响警报 ============
function playAlert() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'square'; 
    const t = audioCtx.currentTime;
    for (let i = 0; i < 10; i++) {
        osc.frequency.setValueAtTime(i % 2 === 0 ? 1000 : 800, t + i * 0.5);
    }
    gain.gain.setValueAtTime(1, t);
    gain.gain.setValueAtTime(1, t + 4.5);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 5.0);
    osc.start(t);
    osc.stop(t + 5.0);
  }

  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("🚨 15m扣扳机警报", {
      body: "1H回调即将交叉，15m出现入场信号，请立即查看！",
      tag: "entry-alert",
      renotify: true
    });
  }

  let isOriginal = true;
  let flashCount = 0;
  const flashInterval = setInterval(() => {
    document.title = isOriginal ? "🚨 扣扳机警报！" : originalTitle;
    isOriginal = !isOriginal;
    flashCount++;
    if (flashCount > 20) {
      clearInterval(flashInterval);
      document.title = originalTitle;
    }
  }, 500);
}

async function requestNotificationPermission() {
    if ("Notification" in window) {
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            try { await Notification.requestPermission(); } catch(e) {}
        }
    }
}

async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),7000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}
function parseK(d){
  const o=[],h=[],l=[],c=[],v=[];
  const closed=d.filter(x=>x[8]==='1');
  const data=[...closed].reverse();
  for(const x of data){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
    v.push(parseFloat(x[5]));
  }
  return{o,h,l,c,v};
}
function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}
async function batchFetch(tasks, concurrency=8){
  const results=new Array(tasks.length).fill(null);
  let idx=0;
  async function worker(){
    while(idx<tasks.length){
      const i=idx++;
      try{ results[i]=await tasks[i](); }catch(e){ results[i]=null; }
    }
  }
  await Promise.all(Array(Math.min(concurrency,tasks.length)).fill().map(worker));
  return results;
}

// ============ 获取前50活跃币 ============
async function getTop50Coins() {
    const res = await fetchOKX('/api/v5/market/tickers?instType=SWAP');
    if (res.err || !res.data || res.data.length === 0) return [];
    
    const usdtList = res.data.filter(t => t.instId.endsWith('USDT-SWAP'));
    usdtList.sort((a,b) => {
        const volA = parseFloat(a.volCcy24h || 0) * parseFloat(a.last || 0);
        const volB = parseFloat(b.volCcy24h || 0) * parseFloat(b.last || 0);
        return volB - volA;
    });
    return usdtList.slice(0, 50).map(t => t.instId); // 取前50
}

// ============ 日线定大方向 (EMA5 vs EMA20) ============
function analyzeDaily(kd){
  const {c}=kd;
  const n=c.length;
  if(n<25) return null;

  const ema5=calcEMA(c,5);
  const ema20=calcEMA(c,20);
  if(isNaN(ema20[n-1])||isNaN(ema5[n-1])) return null;

  const lastE5=ema5[n-1], lastE20=ema20[n-1], lastC=c[n-1];
  
  // 基础的大方向定势
  if(lastE5>lastE20 && lastC>lastE20) return { direction: 'LONG', ema5: lastE5, ema20: lastE20, curClose: lastC };
  if(lastE5<lastE20 && lastC<lastE20) return { direction: 'SHORT', ema5: lastE5, ema20: lastE20, curClose: lastC };
  return null;
}

// ============ 1H 看回调：EMA5拐头，即将交叉 ============
function check1hPullback(k1h, direction) {
    const {c} = k1h;
    const n = c.length;
    if(n < 20) return { ready: false, msg: "1H数据不足" };
    
    const ema5 = calcEMA(c, 5);
    const ema20 = calcEMA(c, 20);
    
    const curE5 = ema5[n-1], prevE5 = ema5[n-2];
    const curE20 = ema20[n-1], prevE20 = ema20[n-2];
    
    if (direction === 'LONG') {
        // 多头回调：EMA5在EMA20下方或附近，但斜率拐头向上
        const isTurnUp = curE5 > prevE5;
        // 两线距离极近（0.6%以内），即将金叉
        const gap = (curE20 - curE5) / curE20; 
        const isNearCross = gap > 0 && gap < 0.006;
        
        if (isTurnUp && isNearCross) {
            return { ready: true, msg: "1H EMA5拐头向上，即将金叉", target: curE20 };
        }
    } else {
        // 空头反弹：EMA5在EMA20上方或附近，但斜率拐头向下
        const isTurnDown = curE5 < prevE5;
        const gap = (curE5 - curE20) / curE20;
        const isNearCross = gap > 0 && gap < 0.006;
        
        if (isTurnDown && isNearCross) {
            return { ready: true, msg: "1H EMA5拐头向下，即将死叉", target: curE20 };
        }
    }
    return { ready: false, msg: "等待1H回调拐头" };
}

// ============ 15m 回调入场扣扳机 ============
function check15mEntry(k15m, direction) {
    const {o, c} = k15m;
    const n = c.length;
    if(n < 10) return { signal:'WAIT', reason:'15m数据不足' };
    
    const ema5 = calcEMA(c, 5);
    const curC = c[n-1], prevC = c[n-2];
    const curO = o[n-1];
    const curE5 = ema5[n-1];

    if (direction === 'LONG') {
        // 做多：15m最新一根为阳线，且收盘价高于前一根，且站上EMA5
        if (curC > curO && curC > prevC && curC > curE5) {
            return { signal: 'ENTRY', reason: '15m 收出止跌阳线，且站上EMA5' };
        }
    } else {
        // 做空：15m最新一根为阴线，且收盘价低于前一根，且跌破EMA5
        if (curC < curO && curC < prevC && curC < curE5) {
            return { signal: 'ENTRY', reason: '15m 收出滞涨阴线，且跌破EMA5' };
        }
    }
    return { signal: 'WAIT', reason: '1H已就绪，等待15m反转K线' };
}

// ============ 日线扫描主流程 ============
async function scanDaily(force=false){
  if(isScanningDaily) return;
  isScanningDaily=true;
  $('btnScan').disabled=true;
  $('btnRescan').disabled=true;
  $('progress').innerHTML='<span class="sp"></span>获取前50主流币...';
  $('scanStatus').innerText='扫描中';

  const top50 = await getTop50Coins();
  if (top50.length === 0) {
      $('progress').innerText = '获取失败，请重试';
      isScanningDaily = false;
      $('btnScan').disabled=false;
      return;
  }

  $('progress').innerHTML='<span class="sp"></span>日线定向中...';
  let done=0;
  const tasks = top50.map(inst => (async()=>{
    const res = await fetchOKX(`/api/v5/market/candles?instId=${inst}&bar=1D&limit=30`);
    done++;
    $('progress').innerText = `日线定向 ${done}/${top50.length}`;
    if(res.err || !res.data || res.data.length < 25) return null;
    
    const kd = parseK(res.data);
    const a = analyzeDaily(kd);
    if(!a) return null;
    return { base: inst.split('-')[0], instId: inst, ...a };
  }));
  
  const dailyRaw = await batchFetch(tasks, 8);
  state.dailyResults = dailyRaw.filter(Boolean);
  
  // 初始化 1H 和 15m 的状态为等待
  state.dailyResults.forEach(r => {
      state.entryMap[r.base] = { signal: 'WAIT', reason: '等待1H回调' };
  });

  state.scanDate = todayStr();
  state.scanTime = Date.now();
  localStorage.setItem('okx_daily_scan_v10', JSON.stringify({
    date: state.scanDate, time: state.scanTime, results: state.dailyResults
  }));

  await scanEntry();

  $('progress').innerText='完成';
  $('scanStatus').innerText=`已扫描 (${state.dailyResults.length}个符合日线)`;
  $('btnScan').style.display='none';
  $('btnRescan').style.display='block';
  $('btnRescan').disabled=false;
  $('btnScan').disabled=false;
  isScanningDaily=false;
}

// ============ 1H + 15m 扣扳机监控 ============
async function scanEntry(){
  if(isScanningEntry||state.dailyResults.length===0) return;
  isScanningEntry=true;
  const list=state.dailyResults;
  let done=0;
  
  const tasks = list.map(item => (async()=>{
    // 第一步：查 1H
    const res1h = await fetchOKX(`/api/v5/market/candles?instId=${item.instId}&bar=1H&limit=30`);
    done++;
    $('progress').innerText = `监控中 ${done}/${list.length}`;
    
    if(res1h.err || !res1h.data || res1h.data.length < 20) return;
    const k1h = parseK(res1h.data);
    const pullback = check1hPullback(k1h, item.direction);
    
    if (!pullback.ready) {
        state.entryMap[item.base] = { signal: 'WAIT', reason: pullback.msg };
        return;
    }
    
    // 第二步：1H 满足了，查 15m
    const res15m = await fetchOKX(`/api/v5/market/candles?instId=${item.instId}&bar=15m&limit=20`);
    if(res15m.err || !res15m.data || res15m.data.length < 10) return;
    const k15m = parseK(res15m.data);
    const entry = check15mEntry(k15m, item.direction);
    
    // 保存最终状态
    if (entry.signal === 'ENTRY') {
        state.entryMap[item.base] = { signal: 'ENTRY', reason: entry.reason };
    } else {
        state.entryMap[item.base] = { signal: 'NEAR', reason: pullback.msg + '，' + entry.reason };
    }
  }));
  
  await batchFetch(tasks, 8);
  isScanningEntry=false;
  render();
  
  let hasTrigger = false;
  let triggeredCoins = [];
  for (const base in state.entryMap) {
      if (state.entryMap[base].signal === 'ENTRY') {
          hasTrigger = true;
          triggeredCoins.push(base);
      }
  }
  if (hasTrigger) {
      playAlert(); 
      $('progress').innerHTML = `<span style="color:#3fb950;font-weight:bold;">🚨 扳机触发: ${triggeredCoins.join(', ')}</span>`;
  } else {
      $('progress').innerText = '监控完成，暂无入场';
  }
}

function render(){
  if(state.dailyResults.length===0){
    $('ranking').innerHTML='<div class="empty">今日暂无符合条件的币种（前50无明确EMA5/20日线趋势）。</div>';
    return;
  }
  let html='';
  state.dailyResults.forEach((r,idx)=>{
    const dirTxt=r.direction==='LONG'?'多':'空';
    const dirCls=r.direction==='LONG'?'L':'S';
    const entry=state.entryMap[r.base]||{signal:'WAIT',reason:'等待1H回调'};
    const eTag = {ENTRY:'<span class="tag entry">🎯 扣动扳机</span>',
                  NEAR:'<span class="tag near">⏳ 即将交叉</span>',
                  WAIT:'<span class="tag wait">⏸ 等待</span>'}[entry.signal]||'';
    const openCls = entry.signal==='ENTRY'?'open':'';
    html+=`
    <div class="rank-card">
      <div class="rank-header" onclick="toggleCard('${r.base}')">
        <div>
          <div class="rh-left">
            <span class="coin">${r.base}</span>
            <span class="dir ${dirCls}">${dirTxt}</span>
            ${eTag}
          </div>
          <div class="rh-mid">日线收盘: ${px(r.curClose)}</div>
        </div>
        <span class="arrow" id="arrow-${r.base}">▼</span>
      </div>
      <div class="rank-body ${openCls}" id="body-${r.base}">
        <div class="sec">
          <div class="sec-title">📊 日线大方向 (EMA5 vs EMA20)</div>
          <div class="sec-body">
            <div class="row"><span>趋势方向</span><b class="${dirCls}">${r.direction==='LONG'?'多头':'空头'}</b></div>
            <div class="row"><span>日线 EMA5</span><b>${px(r.ema5)}</b></div>
            <div class="row"><span>日线 EMA20</span><b>${px(r.ema20)}</b></div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">⏱️ 入场监控</div>
          <div class="sec-body">
            <div class="row"><span>当前状态</span><b>${eTag}</b></div>
            <div class="row"><span>详细说明</span><b style="text-align:right;max-width:65%">${entry.reason}</b></div>
          </div>
        </div>
      </div>
    </div>`;
  });
  $('ranking').innerHTML=html;
}

window.toggleCard=function(base){
  const body=document.getElementById('body-'+base);
  const arrow=document.getElementById('arrow-'+base);
  if(!body) return;
  if(body.classList.contains('open')){
    body.classList.remove('open'); arrow.textContent='▼';
  } else {
    body.classList.add('open'); arrow.textContent='▲';
  }
};

function restoreCache(){
  try{
    const raw=localStorage.getItem('okx_daily_scan_v10');
    if(!raw) return false;
    const cached=JSON.parse(raw);
    if(cached.date!==todayStr()) return false;
    state.dailyResults=cached.results||[];
    state.scanDate=cached.date;
    state.scanTime=cached.time;
    return state.dailyResults.length>0;
  }catch(e){return false;}
}

function startTimer(){
  if(timerOn) return;
  if(state.dailyResults.length===0){
    alert('请先扫描日线大方向。');
    return;
  }
  requestNotificationPermission();
  timerOn=true;
  $('btnTimer').innerText='🛑 停止 15m 巡航';
  $('btnTimer').classList.replace('b3','b2');
  scheduleNext();
  scanEntry();
}
function stopTimer(){
  timerOn=false;
  if(timerHandle) clearTimeout(timerHandle);
  if(countdownHandle) clearInterval(countdownHandle);
  timerHandle=null; countdownHandle=null;
  $('btnTimer').innerText='⏱️ 开启 15m 扣扳机巡航';
  $('btnTimer').classList.replace('b2','b3');
  $('countdown').innerText='--:--';
}
function scheduleNext(){
  const now=Date.now();
  const step=15*60*1000; // 15分钟周期
  const next=Math.ceil(now/step)*step+2000;
  if(timerHandle) clearTimeout(timerHandle);
  timerHandle=setTimeout(async()=>{
    await scanEntry();
    if(timerOn) scheduleNext();
  }, next-now);
  if(countdownHandle) clearInterval(countdownHandle);
  countdownHandle=setInterval(()=>{
    const left=Math.max(0,next-Date.now());
    const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
    $('countdown').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(left<=0) clearInterval(countdownHandle);
  },1000);
}

$('btnScan').onclick=()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  requestNotificationPermission();
  scanDaily();
};
$('btnRescan').onclick=()=>{
  if(!confirm('强制重扫会覆盖今日缓存，确定？')) return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  scanDaily(true);
};
$('btnTimer').onclick=()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(timerOn) stopTimer(); else startTimer();
};

(function init(){
  if(restoreCache()){
    $('scanStatus').innerText=`今日已扫描 (${state.dailyResults.length}个符合日线)`;
    $('btnScan').style.display='none';
    $('btnRescan').style.display='block';
    $('progress').innerText='读取今日缓存';
    scanEntry().then(()=>render());
  } else {
    $('scanStatus').innerText='今日未扫描';
    $('btnScan').style.display='block';
    $('btnRescan').style.display='none';
  }
})();
</script>
</body>
</html>
