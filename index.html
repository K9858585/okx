<script>
const FIXED_COINS = [
  "BTCUSDT","ETHUSDT","SOXLUSDT","SNDKUSDT","ZECUSDT","SOLUSDT","NVDAUSDT","XAUUSDT","ANTUSDT","MMTUSDT",
  "MUUSDT","XRPUSDT","SKHYNIXUSDT","SOXSUSDT","HYPEUSDT","PIEVERSEUSDT","BREVUSDT","XAGUSDT","KORUUSDT","DOGEUSDT",
  "PEPEUSDT","SPCXUSDT","NEARUSDT","PIPPINUSDT","SNXXUSDT","CLUSDT","PUMPUSDT","SKHYUSDT","MSTRUSDT","UNIUSDT",
  "QQQUSDT","LITUSDT","AKEUSDT","WLDUSDT","AMDUSDT","AAOIUSDT","ENAUSDT","FILUSDT","SUIUSDT","INTCUSDT",
  "ZHONGJIUSDT","NBISUSDT","BNBUSDT","CRCLUSDT","TRUMPUSDT","PENGUUSDT","ADAUSDT","AAVEUSDT","TQQQUSDT","LINKUSDT",
  "GOOGLUSDT","UNITREEUSDT","MRVLUSDT","BZUSDT","LTCUSDT","HUMAUSDT","INJUSDT","STRKUSDT","LITEUSDT","BCHUSDT",
  "AVAXUSDT","ASTERUSDT","TSLAUSDT","IRYSUSDT","CRWVUSDT","DRAMUSDT","TAOUSDT","ZROUSDT","ARBUSDT","SAMSUNGUSDT",
  "ZILUSDT","UPUSDT","ZHIPUUSDT","VVVUSDT","BTWUSDT","AAPLUSDT","XPLUSDT","ONDOUSDT","TRXUSDT","OKBUSDT",
  "TSMUSDT","NESUSDT","AXTIUSDT","NIGHTUSDT","SPYUSDT","UVXYUSDT","MUUUSDT","DGAIUSDT","GRAMUSDT","XLMUSDT",
  "ICPUSDT","SQQQUSDT","CXMTUSDT","BEUSDT","SOPHUSDT","PROSUSDT","EWYUSDT","USELESSUSDT","ZKPUSDT","OPUSDT"
];

const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
let audioCtx=null;
let timerOn=false;
let timerHandle=null, countdownHandle=null;
let isScanningDaily=false, isScanningEntry=false;

// ============ 全局状态 ============
const state = {
  dailyResults: [],   // 日线通过列表（含1h分析）
  entryMap: {},       // base -> 15m入场信息
  scanDate: '',
  scanTime: 0
};

// ============ 工具函数 ============
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function playAlert(){
  if(!audioCtx) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type='sine'; o.frequency.setValueAtTime(880,audioCtx.currentTime);
  g.gain.setValueAtTime(1,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);
  o.start(); o.stop(audioCtx.currentTime+0.5);
}
async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),7000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}
function parseK(d){
  const o=[],h=[],l=[],c=[],v=[];
  const closed=d.filter(x=>x[8]==='1');
  const data=[...closed].reverse();
  for(const x of data){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
    v.push(parseFloat(x[5]));
  }
  return{o,h,l,c,v};
}
function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}
// 并发限制器
async function batchFetch(tasks, concurrency=8){
  const results=new Array(tasks.length).fill(null);
  let idx=0;
  async function worker(){
    while(idx<tasks.length){
      const i=idx++;
      try{ results[i]=await tasks[i](); }catch(e){ results[i]=null; }
    }
  }
  await Promise.all(Array(Math.min(concurrency,tasks.length)).fill().map(worker));
  return results;
}

// ============ 日线分析 ============
// 返回：方向、站稳根数、影线质量、活跃度、评分
function analyzeDaily(kd){
  const {o,h,l,c}=kd;
  const n=c.length;
  if(n<25) return null;
  const ema5=calcEMA(c,5);
  const ema20=calcEMA(c,20);
  if(isNaN(ema20[n-1])||isNaN(ema5[n-1])) return null;

  const lastE5=ema5[n-1], lastE20=ema20[n-1], lastC=c[n-1];
  // 方向判断：EMA5>EMA20 且价格在两者之上→多；反之空
  let direction=null;
  if(lastE5>lastE20 && lastC>lastE5 && lastC>lastE20) direction='LONG';
  else if(lastE5<lastE20 && lastC<lastE5 && lastC<lastE20) direction='SHORT';
  if(!direction) return null;

  // 连续站稳根数
  let streak=0;
  for(let i=n-1;i>=0;i--){
    if(isNaN(ema5[i])||isNaN(ema20[i])) break;
    if(direction==='LONG' && c[i]>ema5[i] && c[i]>ema20[i]) streak++;
    else if(direction==='SHORT' && c[i]<ema5[i] && c[i]<ema20[i]) streak++;
    else break;
  }
  if(streak<3) return null;

  // 影线质量：最近N根（最多10根）平均实体占比，越大影线越短
  const cnt=Math.min(streak,10);
  const st=n-cnt;
  let sumBodyRatio=0;
  for(let i=st;i<n;i++){
    const range=h[i]-l[i];
    if(range<=0){ sumBodyRatio+=1; continue; }
    sumBodyRatio += Math.abs(c[i]-o[i])/range;
  }
  const avgBodyRatio=sumBodyRatio/cnt;

  // 活跃度：最近10日平均振幅%
  const actCnt=Math.min(n,10);
  const ast=n-actCnt;
  let sumAmp=0;
  for(let i=ast;i<n;i++) sumAmp += (h[i]-l[i])/c[i]*100;
  const avgAmp=sumAmp/actCnt;

  // 评分
  const streakScore=Math.min(streak*5,50);
  const shadowScore=avgBodyRatio*25;
  let actScore;
  if(avgAmp<=1) actScore=avgAmp*5;
  else if(avgAmp<=2) actScore=5+(avgAmp-1)*10;
  else if(avgAmp<=6) actScore=15+(avgAmp-2)/4*10;
  else if(avgAmp<=10) actScore=25-(avgAmp-6)/4*10;
  else actScore=Math.max(0,15-(avgAmp-10)*2);
  const score=Math.round(streakScore+shadowScore+actScore);

  return {
    direction, streak, avgBodyRatio, avgAmp, score,
    ema5:lastE5, ema20:lastE20, curClose:lastC
  };
}

// ============ 1h 支撑压力 ============
function findSR(k1h){
  const {h,l,c}=k1h;
  const n=h.length;
  if(n<20) return {supports:[],resistances:[]};
  const curC=c[n-1];
  const swingHighs=[], swingLows=[];
  const w=3;
  for(let i=w;i<n-w;i++){
    let isH=true,isL=true;
    for(let j=1;j<=w;j++){
      if(h[i]<=h[i-j]||h[i]<=h[i+j]) isH=false;
      if(l[i]>=l[i-j]||l[i]>=l[i+j]) isL=false;
    }
    if(isH) swingHighs.push(h[i]);
    if(isL) swingLows.push(l[i]);
  }
  // 支撑：低于当前价的摆动低点，从高到低
  const supports=swingLows.filter(x=>x<curC).sort((a,b)=>b-a).slice(0,3);
  // 压力：高于当前价的摆动高点，从低到高
  const resistances=swingHighs.filter(x=>x>curC).sort((a,b)=>a-b).slice(0,3);
  // 兜底：用最近24根的高低点
  if(supports.length===0){
    const rl=Math.min(...l.slice(-24));
    if(rl<curC) supports.push(rl);
  }
  if(resistances.length===0){
    const rh=Math.max(...h.slice(-24));
    if(rh>curC) resistances.push(rh);
  }
  return {supports,resistances,curClose:curC};
}

// ============ 15m 入场判定 ============
function checkEntry(k15m, direction, sr){
  const {c}=k15m;
  const n=c.length;
  if(n<10) return {signal:'WAIT',reason:'数据不足'};
  const ema5=calcEMA(c,5);
  const ema9=calcEMA(c,9);
  const curC=c[n-1];
  const curE5=ema5[n-1], curE9=ema9[n-1];

  // 最近3根是否刚金叉/死叉
  let crossFresh=false;
  for(let i=Math.max(1,n-3);i<n;i++){
    const prevUp=ema5[i-1]>ema9[i-1];
    const curUp=ema5[i]>ema9[i];
    if(direction==='LONG' && !prevUp && curUp){ crossFresh=true; break; }
    if(direction==='SHORT' && prevUp && !curUp){ crossFresh=true; break; }
  }

  if(direction==='LONG'){
    const nearS=sr.supports.find(s=>curC>=s*0.992 && curC<=s*1.01);
    const bull=curE5>curE9;
    const aboveE5=curC>curE5;
    if(nearS && bull && aboveE5){
      return {signal:'ENTRY',reason:`价格回踩支撑 ${px(nearS)} 附近，15m EMA5>EMA9，收盘站稳EMA5${crossFresh?'（刚金叉）':''}`,support:nearS};
    }
    if(nearS){
      return {signal:'NEAR',reason:`价格已到支撑 ${px(nearS)} 附近，等待15m EMA5/EMA9金叉并站稳`,support:nearS};
    }
    if(bull && aboveE5){
      return {signal:'TREND',reason:'15m趋势向上，但价格尚未回踩支撑，等待回调'};
    }
    return {signal:'WAIT',reason:'等待价格回踩支撑 + 15m金叉'};
  } else {
    const nearR=sr.resistances.find(r=>curC<=r*1.008 && curC>=r*0.99);
    const bear=curE5<curE9;
    const belowE5=curC<curE5;
    if(nearR && bear && belowE5){
      return {signal:'ENTRY',reason:`价格反弹至压力 ${px(nearR)} 附近，15m EMA5<EMA9，收盘跌破EMA5${crossFresh?'（刚死叉）':''}`,resistance:nearR};
    }
    if(nearR){
      return {signal:'NEAR',reason:`价格已到压力 ${px(nearR)} 附近，等待15m EMA5/EMA9死叉并跌破`,resistance:nearR};
    }
    if(bear && belowE5){
      return {signal:'TREND',reason:'15m趋势向下，但价格尚未反弹到压力，等待反弹'};
    }
    return {signal:'WAIT',reason:'等待价格反弹至压力 + 15m死叉'};
  }
}

// ============ 日线扫描主流程 ============
async function scanDaily(force=false){
  if(isScanningDaily) return;
  isScanningDaily=true;
  $('btnScan').disabled=true;
  $('btnRescan').disabled=true;
  $('progress').innerHTML='<span class="sp"></span>日线扫描中...';
  $('scanStatus').innerText='扫描中';

  // 先做日线阶段
  const targets=FIXED_COINS.map(c=>c.replace('USDT','-USDT-SWAP'));
  let done=0;
  const tasks=targets.map(inst=>(async()=>{
    const res=await fetchOKX(`/api/v5/market/candles?instId=${inst}&bar=1D&limit=60`);
    done++;
    $('progress').innerText=`日线 ${done}/${targets.length} (${Math.round(done/targets.length*100)}%)`;
    if(res.err||!res.data||res.data.length<25) return null;
    const kd=parseK(res.data);
    const a=analyzeDaily(kd);
    if(!a) return null;
    return {base:inst.split('-')[0], instId:inst, ...a};
  }));
  const dailyRaw=await batchFetch(tasks,8);
  const dailyPass=dailyRaw.filter(Boolean).sort((a,b)=>b.score-a.score);

  // 只有评分≥40的进入下一步
  const filtered=dailyPass.filter(x=>x.score>=40);
  $('progress').innerHTML=`<span class="sp"></span>1h支撑压力分析 (${filtered.length}个)...`;

  // 1h阶段（为每个通过者取1h找支撑压力）
  let done1=0;
  const tasks1=filtered.map(item=>(async()=>{
    const res=await fetchOKX(`/api/v5/market/candles?instId=${item.instId}&bar=1H&limit=100`);
    done1++;
    $('progress').innerText=`1h分析 ${done1}/${filtered.length}`;
    if(res.err||!res.data||res.data.length<20) return {...item, sr:{supports:[],resistances:[]}};
    const k1h=parseK(res.data);
    const sr=findSR(k1h);
    return {...item, sr};
  }));
  const withSR=await batchFetch(tasks1,6);

  // 保存
  state.dailyResults=withSR;
  state.scanDate=todayStr();
  state.scanTime=Date.now();
  localStorage.setItem('okx_daily_scan_v3',JSON.stringify({
    date:state.scanDate, time:state.scanTime, results:state.dailyResults
  }));

  // 立即做一次15m入场分析
  await scanEntry();

  $('progress').innerText='完成';
  $('scanStatus').innerText=`已扫描 (${state.dailyResults.length}个通过)`;
  $('btnScan').style.display='none';
  $('btnRescan').style.display='block';
  $('btnRescan').disabled=false;
  $('btnScan').disabled=false;
  isScanningDaily=false;
  render();
  if(state.dailyResults.some(r=>state.entryMap[r.base]?.signal==='ENTRY')) playAlert();
}

// ============ 15m 入场扫描 ============
async function scanEntry(){
  if(isScanningEntry||state.dailyResults.length===0) return;
  isScanningEntry=true;
  const list=state.dailyResults;
  let done=0;
  const tasks=list.map(item=>(async()=>{
    const res=await fetchOKX(`/api/v5/market/candles?instId=${item.instId}&bar=15m&limit=50`);
    done++;
    $('progress').innerText=`15m入场 ${done}/${list.length}`;
    if(res.err||!res.data||res.data.length<10) return;
    const k15=parseK(res.data);
    const entry=checkEntry(k15, item.direction, item.sr||{supports:[],resistances:[]});
    state.entryMap[item.base]=entry;
  }));
  await batchFetch(tasks,6);
  isScanningEntry=false;
  render();
}

// ============ 渲染 ============
function render(){
  if(state.dailyResults.length===0){
    $('ranking').innerHTML='<div class="empty">暂无扫描结果。</div>';
    return;
  }
  let html='';
  state.dailyResults.forEach((r,idx)=>{
    const dirTxt=r.direction==='LONG'?'多':'空';
    const dirCls=r.direction==='LONG'?'L':'S';
    const rankCls=idx===0?'top1':idx===1?'top2':idx===2?'top3':'';
    const rkCls=idx===0?'gold':idx===1?'silver':idx===2?'bronze':'';
    const entry=state.entryMap[r.base]||{signal:'WAIT',reason:'分析中...'};
    const eTag = {ENTRY:'<span class="tag entry">🎯 入场触发</span>',
                  NEAR:'<span class="tag near">⏳ 接近关键位</span>',
                  TREND:'<span class="tag trend">📈 趋势中·待回调</span>',
                  WAIT:'<span class="tag wait">⏸ 等待</span>'}[entry.signal]||'';
    const openCls = entry.signal==='ENTRY'?'open':'';
    html+=`
    <div class="rank-card ${rankCls}">
      <div class="rank-header" onclick="toggleCard('${r.base}')">
        <div>
          <div class="rh-left">
            <span class="rk ${rkCls}">#${idx+1}</span>
            <span class="coin">${r.base}</span>
            <span class="dir ${dirCls}">${dirTxt}</span>
            <span class="score-badge">${r.score}分</span>
            ${eTag}
          </div>
          <div class="rh-mid">站稳${r.streak}根 · 活跃${r.avgAmp.toFixed(2)}% · 影线质量${(r.avgBodyRatio*100).toFixed(0)}%</div>
        </div>
        <span class="arrow" id="arrow-${r.base}">▼</span>
      </div>
      <div class="rank-body ${openCls}" id="body-${r.base}">
        <div class="sec">
          <div class="sec-title">📊 日线趋势分析</div>
          <div class="sec-body">
            <div class="row"><span>方向</span><b class="${dirCls}">${r.direction==='LONG'?'多头排列（EMA5>EMA20）':'空头排列（EMA5<EMA20）'}</b></div>
            <div class="row"><span>连续站稳</span><b>${r.streak} 根日线</b></div>
            <div class="row"><span>影线质量（实体占比）</span><b>${(r.avgBodyRatio*100).toFixed(1)}%（越高影线越短）</b></div>
            <div class="row"><span>10日平均振幅</span><b>${r.avgAmp.toFixed(2)}%</b></div>
            <div class="row"><span>EMA5 / EMA20</span><b>${px(r.ema5)} / ${px(r.ema20)}</b></div>
            <div class="row"><span>最新收盘</span><b>${px(r.curClose)}</b></div>
            <div class="info-line">${buildDailyComment(r)}</div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">📈 1小时支撑压力</div>
          <div class="sec-body">
            <div class="row"><span>支撑位</span><b class="L">${r.sr.supports.length?r.sr.supports.map(px).join(' / '):'——'}</b></div>
            <div class="row"><span>压力位</span><b class="S">${r.sr.resistances.length?r.sr.resistances.map(px).join(' / '):'——'}</b></div>
            <div class="row"><span>距最近支撑</span><b>${r.sr.supports.length?((r.curClose-r.sr.supports[0])/r.curClose*100).toFixed(2)+'%':'——'}</b></div>
            <div class="row"><span>距最近压力</span><b>${r.sr.resistances.length?((r.sr.resistances[0]-r.curClose)/r.curClose*100).toFixed(2)+'%':'——'}</b></div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">⏱️ 15分钟入场信号</div>
          <div class="sec-body">
            <div class="row"><span>状态</span><b>${eTag}</b></div>
            <div class="row"><span>理由</span><b style="text-align:right;max-width:65%">${entry.reason||'——'}</b></div>
            ${buildEntryPlan(r,entry)}
          </div>
        </div>
      </div>
    </div>`;
  });
  $('ranking').innerHTML=html;
}

function buildDailyComment(r){
  let s='';
  if(r.streak>=8) s+='日线连续站稳超8根，趋势非常稳健；';
  else if(r.streak>=5) s+='日线站稳5根以上，趋势明确；';
  else s+='日线站稳根数偏少，需持续观察；';
  if(r.avgBodyRatio>=0.75) s+='影线极短，K线实体饱满，多头/空头控盘强；';
  else if(r.avgBodyRatio>=0.55) s+='影线适中，趋势尚可；';
  else s+='影线偏长，波动较大，注意假突破；';
  if(r.avgAmp>=2&&r.avgAmp<=6) s+='活跃度适中，适合短线波段。';
  else if(r.avgAmp<2) s+='波动偏低，机会较少。';
  else s+='波动偏高，注意风险。';
  return s;
}
function buildEntryPlan(r,entry){
  if(entry.signal!=='ENTRY'&&entry.signal!=='NEAR') return '';
  let plan='';
  const cur=r.curClose;
  if(r.direction==='LONG'){
    const s=entry.support||r.sr.supports[0]||cur*0.995;
    plan=`
      <div class="row"><span>入场区间</span><b class="L">${px(s*0.998)} ~ ${px(s*1.006)}</b></div>
      <div class="row"><span>止损</span><b class="Y">${px(s*0.99)}</b></div>
      <div class="row"><span>止盈</span><b class="B">${px(s*1.008)}（窄止盈+0.8%）</b></div>`;
  } else {
    const resP=entry.resistance||r.sr.resistances[0]||cur*1.005;
    plan=`
      <div class="row"><span>入场区间</span><b class="S">${px(resP*0.994)} ~ ${px(resP*1.002)}</b></div>
      <div class="row"><span>止损</span><b class="Y">${px(resP*1.01)}</b></div>
      <div class="row"><span>止盈</span><b class="B">${px(resP*0.992)}（窄止盈-0.8%）</b></div>`;
  }
  return plan;
}

window.toggleCard=function(base){
  const body=document.getElementById('body-'+base);
  const arrow=document.getElementById('arrow-'+base);
  if(!body) return;
  if(body.classList.contains('open')){
    body.classList.remove('open'); arrow.textContent='▼';
  } else {
    body.classList.add('open'); arrow.textContent='▲';
  }
};

// ============ 缓存恢复 ============
function restoreCache(){
  try{
    const raw=localStorage.getItem('okx_daily_scan_v3');
    if(!raw) return false;
    const cached=JSON.parse(raw);
    if(cached.date!==todayStr()) return false;
    state.dailyResults=cached.results||[];
    state.scanDate=cached.date;
    state.scanTime=cached.time;
    return state.dailyResults.length>0;
  }catch(e){return false;}
}

// ============ 15m 定时器 ============
function startTimer(){
  if(timerOn) return;
  if(state.dailyResults.length===0){
    alert('请先扫描日线趋势。');
    return;
  }
  timerOn=true;
  $('btnTimer').innerText='🛑 停止 15m 定时扫描';
  $('btnTimer').classList.replace('b3','b2');
  scheduleNext();
  // 立即扫一次
  scanEntry();
}
function stopTimer(){
  timerOn=false;
  if(timerHandle) clearTimeout(timerHandle);
  if(countdownHandle) clearInterval(countdownHandle);
  timerHandle=null; countdownHandle=null;
  $('btnTimer').innerText='⏱️ 开启 15m 定时入场扫描';
  $('btnTimer').classList.replace('b2','b3');
  $('countdown').innerText='--:--';
}
function scheduleNext(){
  const now=Date.now();
  const step=15*60*1000;
  const next=Math.ceil(now/step)*step+3000;
  if(timerHandle) clearTimeout(timerHandle);
  timerHandle=setTimeout(async()=>{
    await scanEntry();
    if(timerOn) scheduleNext();
  }, next-now);
  if(countdownHandle) clearInterval(countdownHandle);
  countdownHandle=setInterval(()=>{
    const left=Math.max(0,next-Date.now());
    const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
    $('countdown').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(left<=0) clearInterval(countdownHandle);
  },1000);
}

// ============ 按钮绑定 ============
$('btnScan').onclick=()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  scanDaily();
};
$('btnRescan').onclick=()=>{
  if(!confirm('强制重扫会覆盖今日缓存，确定？')) return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  scanDaily(true);
};
$('btnTimer').onclick=()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(timerOn) stopTimer(); else startTimer();
};

// ============ 初始化 ============
(function init(){
  if(restoreCache()){
    $('scanStatus').innerText=`今日已扫描 (${state.dailyResults.length}个通过)`;
    $('scanDate').innerText='';
    $('btnScan').style.display='none';
    $('btnRescan').style.display='block';
    $('progress').innerText='读取今日缓存';
    // 恢复时立即跑一次15m入场，并渲染
    scanEntry().then(()=>render());
  } else {
    $('scanStatus').innerText='今日未扫描';
    $('btnScan').style.display='block';
    $('btnRescan').style.display='none';
  }
})();
</script>
</body>
</html>
