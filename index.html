<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OKX 极值系统 V17 (港股时间结算)</title>
<style>
    :root {
        --bg-color: #0b0e14; --card-bg: #151a24; --text-main: #e2e8f0; --text-sub: #94a3b8;
        --accent-blue: #00e5ff; --accent-green: #00e676; --accent-red: #ff5252; --border-color: #2d3748;
        --accent-gold: #ffb300;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 16px; line-height: 1.5; padding-bottom: 40px;}
    
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 22px; color: var(--accent-blue); text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

    .sentiment-panel { background: linear-gradient(145deg, #2a1b1b, #1a1111); border: 1px solid #553333; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: center; }
    .sentiment-title { font-size: 14px; color: var(--accent-gold); font-weight: bold; margin-bottom: 8px; }
    .sentiment-value { font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .sentiment-desc { font-size: 12px; color: var(--text-sub); margin-top: 5px; }

    .timer-panel { background: linear-gradient(145deg, #1a202c, #11151f); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; display: none;}
    .timer-panel.active { display: block; }
    .timer-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
    .timer-row:last-child { margin-bottom: 0; }
    .timer-label { color: var(--text-sub); }
    .timer-value { color: var(--accent-gold); font-family: monospace; font-size: 16px; }

    .master-btn { display: block; width: 100%; padding: 18px; background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);}
    .master-btn.stop { background: linear-gradient(90deg, #ff5252, #d32f2f); color: #fff; box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3);}
    .master-btn:active { transform: scale(0.98); }

    .status-box { text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; font-weight: 500; background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.3); color: var(--accent-gold); }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-left: 5px; border-left: 4px solid var(--accent-blue); }
    .section-title { font-size: 15px; color: #fff; font-weight: bold; }
    .toggle-btn { background: #2d3748; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .toggle-btn:active { background: #4a5568; }
    
    .table-container { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { background: #1e2532; color: var(--text-sub); padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--border-color); }
    th:first-child { text-align: left; }
    td { padding: 12px 10px; text-align: right; border-bottom: 1px solid rgba(45, 55, 72, 0.5); }
    td:first-child { text-align: left; font-weight: bold; color: #fff; }

    .tag-long { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(0, 230, 118, 0.3); }
    .tag-short { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(255, 82, 82, 0.3); }
    
    .tag-news-bull { background: rgba(0, 230, 118, 0.1); color: var(--accent-green); padding: 2px 6px; border-radius: 4px; font-size: 11px; border: 1px solid rgba(0, 230, 118, 0.2); margin-left: 5px;}
    .tag-news-bear { background: rgba(255, 82, 82, 0.1); color: var(--accent-red); padding: 2px 6px; border-radius: 4px; font-size: 11px; border: 1px solid rgba(255, 82, 82, 0.2); margin-left: 5px;}
</style>
</head>
<body>

<div class="header">
    <h1>⚡ 极值系统 V17 (港股时间)</h1>
</div>

<div class="sentiment-panel" id="sentimentPanel">
    <div class="sentiment-title">📊 实时市场情绪 (恐慌贪婪指数)</div>
    <div class="sentiment-value" id="fgiValue">--</div>
    <div class="sentiment-desc" id="fgiDesc">正在获取数据...</div>
</div>

<button class="master-btn" id="masterBtn" onclick="toggleAuto()">启动自动巡航</button>

<div class="timer-panel" id="timerPanel">
    <div class="timer-row">
        <span class="timer-label">距离下次 1D 扫描 (凌晨0点)</span>
        <span class="timer-value" id="countdown1d">--:--:--</span>
    </div>
    <div class="timer-row">
        <span class="timer-label">距离下次 15m 扫描</span>
        <span class="timer-value" id="countdown15m">--:--</span>
    </div>
</div>

<div class="status-box" id="statusMain">等待启动...</div>

<div class="section-header">
    <div class="section-title">1D 平稳趋势监控</div>
    <button class="toggle-btn" id="toggleBtn4h" onclick="toggle4hTable()">收起</button>
</div>
<div class="table-container" id="container4h">
    <table>
        <thead><tr><th>币种</th><th>收盘价</th><th>趋势</th></tr></thead>
        <tbody id="tbody4h"><tr><td colspan="3" style="text-align:center; color:#666;">暂无数据</td></tr></tbody>
    </table>
</div>

<div class="section-header">
    <div class="section-title">15m 阴线踩底 / 阳线探顶 (前20根极值)</div>
</div>
<div class="table-container">
    <table>
        <thead><tr><th>币种</th><th>形态</th><th>情绪</th><th>关键位</th><th>收盘</th></tr></thead>
        <tbody id="tbody5m"><tr><td colspan="5" style="text-align:center; color:#666;">暂无信号</td></tr></tbody>
    </table>
</div>

<script>
const OKX_URL = "https://www.okx.com/api/v5/market/candles";
const NEWS_API = "https://cryptocurrency.cv/api";

const FIXED_COINS = [
    "ANT", "BTC", "ETH", "OKB", "SOL", "DOGE", "XRP", "BCH", "DOOD", "ZEC", "SNDK", 
    "XAU", "NVDA", "IRYS", "MMT", "PIEVERSE", "SOXL", "AKE", "PIPPIN", "SPCX", "SKHYNIX", 
    "BTW", "MU", "HUMA", "UP", "HYPE", "CL", "PEPE", "XAG", "CAP", "PROS", 
    "SENT", "YB", "AMD", "QQQ", "BREV", "RAVE", "INTC", "NESA", "SOXS", 
    "PUMP", "TRUMP", "UNITREE", "NEAR", "SNXX", "PDD", "GOOGL", "KORU", "LIT", "INI", "USELESS"
];

let isRunning = false;
let isScanning = false; 
let timer1d, timer15m, uiTimer;
let cachedCoins = []; 

let globalFearGreed = 50; 

function toggle4hTable() {
    const container = document.getElementById('container4h');
    const btn = document.getElementById('toggleBtn4h');
    if (container.style.display === 'none') {
        container.style.display = 'block';
        btn.innerText = '收起';
    } else {
        container.style.display = 'none';
        btn.innerText = '展开';
    }
}

async function fetchMarketSentiment() {
    try {
        const fgRes = await fetch(`${NEWS_API}/market/fear-greed`);
        const fgJson = await fgRes.json();
        globalFearGreed = fgJson.value || 50;
        document.getElementById('fgiValue').innerText = globalFearGreed;
        document.getElementById('fgiValue').style.color = 
            globalFearGreed > 60 ? 'var(--accent-green)' : 
            globalFearGreed < 40 ? 'var(--accent-red)' : 'var(--accent-gold)';
        document.getElementById('fgiDesc').innerText = fgJson.classification || "Neutral";
    } catch (e) {
        document.getElementById('fgiValue').innerText = "--";
        document.getElementById('fgiDesc').innerText = "数据获取失败";
    }
}

async function fetchKlinesData(coin, interval) {
    const limit = 60;
    try {
        const okxSym = `${coin}-USDT-SWAP`;
        // 【修改点】：1D 默认即为按香港时间(UTC+8) 0点结算的日线
        const okxInt = interval === "1d" ? "1D" : "15m";
        const res = await fetch(`${OKX_URL}?instId=${okxSym}&bar=${okxInt}&limit=${limit}`);
        const json = await res.json();
        if (json.code === "0" && json.data.length > 0) {
            const allData = json.data.reverse();
            const closedData = allData.filter(d => d[8] === '1');
            const currentData = allData[allData.length - 1];
            return {
                closed: closedData.map(d => ({ open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) })),
                current: { open: parseFloat(currentData[1]), high: parseFloat(currentData[2]), low: parseFloat(currentData[3]), close: parseFloat(currentData[4]) }
            };
        }
    } catch(e) {}
    return { closed: [], current: null };
}

function calcEMA(klines, period) {
    let ema = [], k = 2 / (period + 1), prevEma = klines[0].close;
    for (let i = 0; i < klines.length; i++) { prevEma = (klines[i].close - prevEma) * k + prevEma; ema.push(prevEma); }
    return ema;
}
function calcRSI(klines, period = 14) {
    if (klines.length <= period) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) { let diff = klines[i].close - klines[i-1].close; if (diff >= 0) gains += diff; else losses -= diff; }
    let avgGain = gains / period, avgLoss = losses / period;
    for (let i = period + 1; i < klines.length; i++) {
        let diff = klines[i].close - klines[i-1].close;
        avgGain = ((avgGain * (period - 1)) + (diff > 0 ? diff : 0)) / period;
        avgLoss = ((avgLoss * (period - 1)) + (diff < 0 ? -diff : 0)) / period;
    }
    return avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
}

async function scan1D() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    const tbody = document.getElementById('tbody4h');
    
    status.innerText = "⏳ 1D 整点收盘，正在寻找平稳趋势...";
    tbody.innerHTML = "";
    cachedCoins = [];

    for (let i = 0; i < FIXED_COINS.length; i++) {
        const coin = FIXED_COINS[i];
        const data = await fetchKlinesData(coin, "1d");
        if (data.closed.length < 30) continue;
        
        const k = data.closed;
        const ema5 = calcEMA(k, 5), ema20 = calcEMA(k, 20), rsi = calcRSI(k, 14);
        const lastIdx = k.length - 1;
        
        const c0 = k[lastIdx], c1 = k[lastIdx-1], c2 = k[lastIdx-2];
        const e5_0 = ema5[lastIdx], e20_0 = ema20[lastIdx];
        const e5_1 = ema5[lastIdx-1], e20_1 = ema20[lastIdx-1];
        const e5_2 = ema5[lastIdx-2], e20_2 = ema20[lastIdx-2];

        const isC0Huge = Math.abs(c0.close - c0.open) / c0.open > 0.08;
        const isC1Huge = Math.abs(c1.close - c1.open) / c1.open > 0.08;
        const isC2Huge = Math.abs(c2.close - c2.open) / c2.open > 0.08;
        const noHugeCandles = !isC0Huge && !isC1Huge && !isC2Huge;

        const longAlign = (e5_0 > e20_0) && (e5_1 > e20_1) && (e5_2 > e20_2);
        const shortAlign = (e5_0 < e20_0) && (e5_1 < e20_1) && (e5_2 < e20_2);

        const bias = Math.abs(c0.close - e20_0) / e20_0;
        const isBiasOk = bias < 0.15;

        let trend = null;
        if (noHugeCandles && isBiasOk) {
            if (longAlign && c0.close > e5_0 && rsi > 50 && rsi < 75) trend = "LONG";
            else if (shortAlign && c0.close < e5_0 && rsi < 50 && rsi > 25) trend = "SHORT";
        }

        if (trend) {
            cachedCoins.push({ coin, close: c0.close, trend });
            const tr = document.createElement('tr');
            const tag = trend === "LONG" ? `<span class="tag-long">平稳多头</span>` : `<span class="tag-short">平稳空头</span>`;
            tr.innerHTML = `<td>${coin}</td><td style="color:#aaa">${formatPrice(c0.close)}</td><td>${tag}</td>`;
            tbody.appendChild(tr);
        }
        await new Promise(r => setTimeout(r, 120)); 
    }
    
    status.innerText = `✅ 1D 平稳定势完成，锁定 ${cachedCoins.length} 个趋势币。`;
    isScanning = false;
}

async function scan15M() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    const tbody = document.getElementById('tbody5m');
    
    tbody.innerHTML = "";

    if (cachedCoins.length === 0) {
        status.innerText = "ℹ️ 15m 巡检跳过：当前没有符合条件的币种。";
        isScanning = false;
        return;
    }

    status.innerText = "⏳ 15m 整点收盘，正在寻找前20根极值突破...";
    let entryCount = 0;

    for (let i = 0; i < cachedCoins.length; i++) {
        const item = cachedCoins[i];
        const data15m = await fetchKlinesData(item.coin, "15m");
        
        if (data15m.closed.length < 21 || !data15m.current) continue;
        
        const latestClosed = data15m.closed[data15m.closed.length - 1];
        const prev20 = data15m.closed.slice(-21, -1); 
        
        const maxHigh20 = Math.max(...prev20.map(k => k.high));
        const minLow20 = Math.min(...prev20.map(k => k.low));
        
        const realTimePrice = data15m.current.close;
        
        let signalType = null;
        let keyPrice = 0;
        let sentimentTag = "";
        const tolerance = 0.0015;

        if (item.trend === "LONG" && latestClosed.close < latestClosed.open) {
            const bearishK = prev20.filter(k => k.close < k.open);
            let targetLow = minLow20; 
            if (bearishK.length > 0) targetLow = Math.min(...bearishK.map(k => k.low));

            if (latestClosed.low <= targetLow * (1 + tolerance)) {
                const bodyDrop = (latestClosed.open - latestClosed.close) / latestClosed.open;
                const lowerShadow = latestClosed.close - latestClosed.low;
                
                if (!(bodyDrop > 0.01 && lowerShadow < (latestClosed.open - latestClosed.close))) {
                    if (globalFearGreed < 25) {
                        sentimentTag = `<span class="tag-news-bear">宏观恐慌拦截</span>`;
                        signalType = null;
                    } else {
                        signalType = "LONG";
                        keyPrice = targetLow;
                        sentimentTag = `<span class="tag-news-bull">情绪允许</span>`;
                        if (realTimePrice < targetLow * 0.985) signalType = null; 
                    }
                }
            }
        }
        
        else if (item.trend === "SHORT" && latestClosed.close > latestClosed.open) {
            const bullishK = prev20.filter(k => k.close > k.open);
            let targetHigh = maxHigh20; 
            if (bullishK.length > 0) targetHigh = Math.max(...bullishK.map(k => k.high));

            if (latestClosed.high >= targetHigh * (1 - tolerance)) {
                const bodyRise = (latestClosed.close - latestClosed.open) / latestClosed.open;
                const upperShadow = latestClosed.high - latestClosed.close;
                
                if (!(bodyRise > 0.01 && upperShadow < (latestClosed.close - latestClosed.open))) {
                    if (globalFearGreed > 80) {
                        sentimentTag = `<span class="tag-news-bull">宏观贪婪拦截</span>`;
                        signalType = null;
                    } else {
                        signalType = "SHORT";
                        keyPrice = targetHigh;
                        sentimentTag = `<span class="tag-news-bear">情绪允许</span>`;
                        if (realTimePrice > targetHigh * 1.015) signalType = null;
                    }
                }
            }
        }

        if (signalType) {
            const tr = document.createElement('tr');
            const tagClass = signalType === "LONG" ? "tag-long" : "tag-short";
            const tagText = signalType === "LONG" ? "阴线踩底" : "阳线探顶";
            
            tr.innerHTML = `
                <td>${item.coin}</td>
                <td><span class="${tagClass}">${tagText}</span></td>
                <td>${sentimentTag}</td>
                <td style="color:#00e5ff">${formatPrice(keyPrice)}</td>
                <td style="color:#fff">${formatPrice(latestClosed.close)}</td>
            `;
            tbody.appendChild(tr);
            entryCount++;
        } else if (sentimentTag.includes("拦截")) {
            const tr = document.createElement('tr');
            tr.style.opacity = "0.5";
            tr.innerHTML = `
                <td>${item.coin}</td>
                <td style="color:#888">信号受限</td>
                <td>${sentimentTag}</td>
                <td style="color:#888">--</td>
                <td style="color:#888">${formatPrice(latestClosed.close)}</td>
            `;
            tbody.appendChild(tr);
        }
        await new Promise(r => setTimeout(r, 150)); 
    }
    
    status.innerText = `✅ 巡检完毕，捕获 ${entryCount} 个信号。`;
    isScanning = false;
}

// ================= 定时器对齐（北京/香港时间） =================
function startCycle1D() {
    const intervalMs = 24 * 60 * 60 * 1000;
    const now = Date.now();
    
    // 计算目标时间：UTC 16:00（即北京时间 0:00）
    const offset = 16 * 60 * 60 * 1000;
    const shiftedNow = now - offset;
    const nextShifted = Math.ceil(shiftedNow / intervalMs) * intervalMs;
    const nextTime = nextShifted + offset + 2000;
    
    timer1d = setTimeout(async () => {
        await scan1D(); 
        await scan15M(); 
        if (isRunning) startCycle1D();
    }, nextTime - now);
}

function startCycle15M() {
    const intervalMs = 15 * 60 * 1000;
    const now = Date.now();
    const nextTime = Math.ceil(now / intervalMs) * intervalMs + 2000;
    
    timer15m = setTimeout(async () => {
        fetchMarketSentiment();
        await scan15M();
        if (isRunning) startCycle15M();
    }, nextTime - now);
}

function updateCountdowns() {
    if (!isRunning) return;
    const now = Date.now();
    
    // 1D 倒计时计算
    const offset = 16 * 60 * 60 * 1000;
    const shiftedNow = now - offset;
    const nextShifted = Math.ceil(shiftedNow / 86400000) * 86400000;
    const next1d = nextShifted + offset + 2000;
    const diff1d = Math.max(0, next1d - now);
    document.getElementById('countdown1d').innerText = `${Math.floor(diff1d/3600000).toString().padStart(2,'0')}:${Math.floor((diff1d%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((diff1d%60000)/1000).toString().padStart(2,'0')}`;
    
    // 15m 倒计时计算
    const next15m = Math.ceil(now / 900000) * 900000 + 2000;
    const diff15m = Math.max(0, next15m - now);
    document.getElementById('countdown15m').innerText = `${Math.floor(diff15m/60000).toString().padStart(2,'0')}:${Math.floor((diff15m%60000)/1000).toString().padStart(2,'0')}`;
}

function toggleAuto() {
    const btn = document.getElementById('masterBtn');
    const panel = document.getElementById('timerPanel');
    const status = document.getElementById('statusMain');

    if (isRunning) {
        isRunning = false;
        clearTimeout(timer1d); clearTimeout(timer15m); clearInterval(uiTimer);
        btn.innerText = "启动自动巡航"; btn.classList.remove('stop');
        panel.classList.remove('active'); status.innerText = "自动巡航已停止。";
    } else {
        isRunning = true;
        btn.innerText = "停止自动巡航"; btn.classList.add('stop');
        panel.classList.add('active'); status.innerText = "系统已启动，正在对齐收盘时间...";
        fetchMarketSentiment(); 
        updateCountdowns(); uiTimer = setInterval(updateCountdowns, 1000);
        scan1D().then(() => scan15M());
        startCycle1D(); startCycle15M();
    }
}

function formatPrice(price) {
    if (price >= 100) return price.toFixed(2);
    if (price >= 1) return price.toFixed(4);
    if (price >= 0.01) return price.toFixed(5);
    return price.toFixed(6);
}
</script>
</body>
</html>
