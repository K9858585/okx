<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OKX 平稳趋势极值系统 V7</title>
<style>
    :root {
        --bg-color: #0b0e14; --card-bg: #151a24; --text-main: #e2e8f0; --text-sub: #94a3b8;
        --accent-blue: #00e5ff; --accent-green: #00e676; --accent-red: #ff5252; --border-color: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 16px; line-height: 1.5; padding-bottom: 40px;}
    
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 22px; color: var(--accent-blue); text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

    .timer-panel { background: linear-gradient(145deg, #1a202c, #11151f); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; display: none;}
    .timer-panel.active { display: block; }
    .timer-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
    .timer-row:last-child { margin-bottom: 0; }
    .timer-label { color: var(--text-sub); }
    .timer-value { color: #ffb300; font-family: monospace; font-size: 16px; }

    .master-btn { display: block; width: 100%; padding: 18px; background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);}
    .master-btn.stop { background: linear-gradient(90deg, #ff5252, #d32f2f); color: #fff; box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3);}
    .master-btn:active { transform: scale(0.98); }

    .status-box { text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; font-weight: 500; background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.3); color: #ffb300; }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-left: 5px; border-left: 4px solid var(--accent-blue); }
    .section-title { font-size: 15px; color: #fff; font-weight: bold; }
    .toggle-btn { background: #2d3748; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .toggle-btn:active { background: #4a5568; }
    
    .table-container { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; transition: max-height 0.3s ease; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { background: #1e2532; color: var(--text-sub); padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--border-color); }
    th:first-child { text-align: left; }
    td { padding: 12px 10px; text-align: right; border-bottom: 1px solid rgba(45, 55, 72, 0.5); }
    td:first-child { text-align: left; font-weight: bold; color: #fff; }

    .tag-long { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(0, 230, 118, 0.3); }
    .tag-short { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(255, 82, 82, 0.3); }
</style>
</head>
<body>

<div class="header">
    <h1>⚡ 平稳趋势极值系统 V7</h1>
</div>

<button class="master-btn" id="masterBtn" onclick="toggleAuto()">启动自动巡航</button>

<div class="timer-panel" id="timerPanel">
    <div class="timer-row">
        <span class="timer-label">距离下次 4H 扫描</span>
        <span class="timer-value" id="countdown4h">--:--:--</span>
    </div>
    <div class="timer-row">
        <span class="timer-label">距离下次 5m 扫描</span>
        <span class="timer-value" id="countdown5m">--:--</span>
    </div>
</div>

<div class="status-box" id="statusMain">等待启动...</div>

<!-- 4H 模块 -->
<div class="section-header">
    <div class="section-title">4H 平稳趋势监控 (严控大阴大阳)</div>
    <button class="toggle-btn" id="toggleBtn4h" onclick="toggle4hTable()">收起</button>
</div>
<div class="table-container" id="container4h">
    <table>
        <thead><tr><th>币种</th><th>收盘价</th><th>趋势</th></tr></thead>
        <tbody id="tbody4h"><tr><td colspan="3" style="text-align:center; color:#666;">暂无数据</td></tr></tbody>
    </table>
</div>

<!-- 5M 模块 -->
<div class="section-header">
    <div class="section-title">5m 进场极值突破 (仅保留当轮)</div>
</div>
<div class="table-container">
    <table>
        <thead><tr><th>币种</th><th>方向</th><th>突破前值</th><th>最新收盘</th></tr></thead>
        <tbody id="tbody5m"><tr><td colspan="4" style="text-align:center; color:#666;">暂无信号</td></tr></tbody>
    </table>
</div>

<script>
const OKX_URL = "https://www.okx.com/api/v5/market/candles";
const BINANCE_URL = "https://data-api.binance.vision/api/v3/klines";

const FIXED_COINS = [
    "ANT", "BTC", "ETH", "OKB", "SOL", "DOGE", "XRP", "BCH", "DOOD", "ZEC", "SNDK", 
    "XAU", "NVDA", "IRYS", "MMT", "PIEVERSE", "SOXL", "AKE", "PIPPIN", "SPCX", "SKHYNIX", 
    "BTW", "MU", "HUMA", "UP", "HYPE", "CL", "PEPE", "XAG", "CAP", "PROS", 
    "SENT", "YB", "AMD", "QQQ", "BREV", "RAVE", "INTC", "NESA", "SOXS", 
    "PUMP", "TRUMP", "UNITREE", "NEAR", "SNXX", "PDD", "GOOGL", "KORU", "LIT", "INI", "USELESS"
];

let isRunning = false;
let isScanning = false; 
let timer4h, timer5m, uiTimer;
let cachedCoins = []; 

function toggle4hTable() {
    const container = document.getElementById('container4h');
    const btn = document.getElementById('toggleBtn4h');
    if (container.style.display === 'none') {
        container.style.display = 'block';
        btn.innerText = '收起';
    } else {
        container.style.display = 'none';
        btn.innerText = '展开';
    }
}

// 抓取 K 线（包含 开高低收）
async function fetchClosedKlines(coin, interval) {
    const limit = 50;
    try {
        const okxSym = `${coin}-USDT-SWAP`;
        const okxInt = interval === "4h" ? "4H" : "5m";
        const res = await fetch(`${OKX_URL}?instId=${okxSym}&bar=${okxInt}&limit=${limit}`);
        const json = await res.json();
        if (json.code === "0" && json.data.length > 0) {
            const closedData = json.data.filter(d => d[8] === '1').reverse();
            return closedData.map(d => ({
                open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
            }));
        }
    } catch(e) {}

    try {
        const binSym = `${coin}USDT`;
        const res = await fetch(`${BINANCE_URL}?symbol=${binSym}&interval=${interval}&limit=${limit}`);
        const json = await res.json();
        if (Array.isArray(json) && json.length > 0) {
            return json.slice(0, -1).map(d => ({
                open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
            }));
        }
    } catch(e) {}
    return [];
}

function calcEMA(klines, period) {
    let ema = [], k = 2 / (period + 1), prevEma = klines[0].close;
    for (let i = 0; i < klines.length; i++) { prevEma = (klines[i].close - prevEma) * k + prevEma; ema.push(prevEma); }
    return ema;
}
function calcRSI(klines, period = 14) {
    if (klines.length <= period) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) { let diff = klines[i].close - klines[i-1].close; if (diff >= 0) gains += diff; else losses -= diff; }
    let avgGain = gains / period, avgLoss = losses / period;
    for (let i = period + 1; i < klines.length; i++) {
        let diff = klines[i].close - klines[i-1].close;
        avgGain = ((avgGain * (period - 1)) + (diff > 0 ? diff : 0)) / period;
        avgLoss = ((avgLoss * (period - 1)) + (diff < 0 ? -diff : 0)) / period;
    }
    return avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
}

// ================= 扫描 4H (平稳趋势核心逻辑) =================
async function scan4H() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    const tbody = document.getElementById('tbody4h');
    
    status.innerText = "⏳ 4H 整点收盘，正在寻找平稳趋势...";
    tbody.innerHTML = "";
    cachedCoins = [];

    for (let i = 0; i < FIXED_COINS.length; i++) {
        const coin = FIXED_COINS[i];
        const k4h = await fetchClosedKlines(coin, "4h");
        if (k4h.length < 30) continue;
        
        const ema5 = calcEMA(k4h, 5), ema20 = calcEMA(k4h, 20), rsi = calcRSI(k4h, 14);
        const lastIdx = k4h.length - 1;
        
        const c0 = k4h[lastIdx];     // 最新收盘K线
        const c1 = k4h[lastIdx-1];   // 前1根
        const c2 = k4h[lastIdx-2];   // 前2根
        
        const e5_0 = ema5[lastIdx], e20_0 = ema20[lastIdx];
        const e5_1 = ema5[lastIdx-1], e20_1 = ema20[lastIdx-1];
        const e5_2 = ema5[lastIdx-2], e20_2 = ema20[lastIdx-2];

        // === 严苛的条件筛选 ===
        
        // 1. 防接飞刀：最近3根K线中，不能有涨跌幅超过 4% 的大阴大阳
        const isC0Huge = Math.abs(c0.close - c0.open) / c0.open > 0.04;
        const isC1Huge = Math.abs(c1.close - c1.open) / c1.open > 0.04;
        const isC2Huge = Math.abs(c2.close - c2.open) / c2.open > 0.04;
        const noHugeCandles = !isC0Huge && !isC1Huge && !isC2Huge;

        // 2. 防刚刚拐头：EMA5 和 EMA20 的排列必须已经持续了 3 根K线
        const longAlign = (e5_0 > e20_0) && (e5_1 > e20_1) && (e5_2 > e20_2);
        const shortAlign = (e5_0 < e20_0) && (e5_1 < e20_1) && (e5_2 < e20_2);

        // 3. 防过度偏离：价格距离 EMA20 的乖离率不能超过 8%
        const bias = Math.abs(c0.close - e20_0) / e20_0;
        const isBiasOk = bias < 0.08;

        let trend = null;

        if (noHugeCandles && isBiasOk) {
            // 做多：平稳多头排列 + RSI在 50~75 (避免超买)
            if (longAlign && c0.close > e5_0 && rsi > 50 && rsi < 75) {
                trend = "LONG";
            }
            // 做空：平稳空头排列 + RSI在 25~50 (避免超卖)
            else if (shortAlign && c0.close < e5_0 && rsi < 50 && rsi > 25) {
                trend = "SHORT";
            }
        }

        if (trend) {
            cachedCoins.push({ coin, close: c0.close, trend });
            const tr = document.createElement('tr');
            const tag = trend === "LONG" ? `<span class="tag-long">平稳多头</span>` : `<span class="tag-short">平稳空头</span>`;
            tr.innerHTML = `<td>${coin}</td><td style="color:#aaa">${formatPrice(c0.close)}</td><td>${tag}</td>`;
            tbody.appendChild(tr);
        }
        await new Promise(r => setTimeout(r, 120)); 
    }
    
    status.innerText = `✅ 4H 平稳定势完成，仅 ${cachedCoins.length} 个币符合条件。`;
    isScanning = false;
}

// ================= 扫描 5M (不变) =================
async function scan5M() {
    if (isScanning) return;
    isScanning = true;
    const status = document.getElementById('statusMain');
    const tbody = document.getElementById('tbody5m');
    
    tbody.innerHTML = "";

    if (cachedCoins.length === 0) {
        status.innerText = "ℹ️ 5M 巡检跳过：当前没有符合 4H 平稳趋势的币种。";
        isScanning = false;
        return;
    }

    status.innerText = "⏳ 5M 整点收盘，正在寻找严格极值突破...";
    let entryCount = 0;

    for (let i = 0; i < cachedCoins.length; i++) {
        const item = cachedCoins[i];
        const k5m = await fetchClosedKlines(item.coin, "5m");
        
        if (k5m.length < 31) continue;
        
        const latestClosed = k5m[k5m.length - 1];
        const prev30 = k5m.slice(-31, -1); 
        
        const maxPrev30 = Math.max(...prev30.map(k => k.close));
        const minPrev30 = Math.min(...prev30.map(k => k.close));
        
        let signalType = null;
        let breakPrice = 0;

        // 做空：最新收盘价 >= 前30根最高收盘价
        if (item.trend === "SHORT" && latestClosed.close >= maxPrev30) {
            signalType = "SHORT";
            breakPrice = maxPrev30;
        }
        // 做多：最新收盘价 <= 前30根最低收盘价
        else if (item.trend === "LONG" && latestClosed.close <= minPrev30) {
            signalType = "LONG";
            breakPrice = minPrev30;
        }

        if (signalType) {
            const tr = document.createElement('tr');
            const tagClass = signalType === "LONG" ? "tag-long" : "tag-short";
            const tagText = signalType === "LONG" ? "做多" : "做空";
            
            tr.innerHTML = `
                <td>${item.coin}</td>
                <td><span class="${tagClass}">${tagText}</span></td>
                <td style="color:#888; text-decoration:line-through;">${formatPrice(breakPrice)}</td>
                <td style="color:#00e5ff; font-weight:bold;">${formatPrice(latestClosed.close)}</td>
            `;
            tbody.appendChild(tr);
            entryCount++;
        }
        await new Promise(r => setTimeout(r, 150)); 
    }
    
    status.innerText = `✅ 本轮巡检完毕，捕获 ${entryCount} 个极值突破信号。`;
    
    if (entryCount > 0) {
        let isBlink = false;
        let blinkTimer = setInterval(() => {
            document.title = isBlink ? "🚨 发现极值突破！" : "⚡ 平稳趋势巡航中";
            isBlink = !isBlink;
        }, 1000);
        setTimeout(() => { clearInterval(blinkTimer); document.title = "⚡ 平稳趋势极值系统 V7"; }, 10000); 
    }
    isScanning = false;
}

// ================= 定时器控制 =================
function scheduleNext(intervalMs, callback) {
    const now = Date.now();
    const nextTime = Math.ceil(now / intervalMs) * intervalMs + 2000;
    return setTimeout(callback, nextTime - now);
}

function startCycle4h() {
    timer4h = scheduleNext(4 * 60 * 60 * 1000, async () => {
        await scan4H();
        await scan5M(); 
        if (isRunning) startCycle4h();
    });
}

function startCycle5m() {
    timer5m = scheduleNext(5 * 60 * 1000, async () => {
        await scan5M();
        if (isRunning) startCycle5m();
    });
}

function updateCountdowns() {
    if (!isRunning) return;
    const now = Date.now();
    
    const next4h = Math.ceil(now / 14400000) * 14400000 + 2000;
    const diff4h = Math.max(0, next4h - now);
    const h4 = Math.floor(diff4h / 3600000).toString().padStart(2, '0');
    const m4 = Math.floor((diff4h % 3600000) / 60000).toString().padStart(2, '0');
    const s4 = Math.floor((diff4h % 60000) / 1000).toString().padStart(2, '0');
    document.getElementById('countdown4h').innerText = `${h4}:${m4}:${s4}`;

    const next5m = Math.ceil(now / 300000) * 300000 + 2000;
    const diff5m = Math.max(0, next5m - now);
    const m5 = Math.floor(diff5m / 60000).toString().padStart(2, '0');
    const s5 = Math.floor((diff5m % 60000) / 1000).toString().padStart(2, '0');
    document.getElementById('countdown5m').innerText = `${m5}:${s5}`;
}

function toggleAuto() {
    const btn = document.getElementById('masterBtn');
    const panel = document.getElementById('timerPanel');
    const status = document.getElementById('statusMain');

    if (isRunning) {
        isRunning = false;
        clearTimeout(timer4h);
        clearTimeout(timer5m);
        clearInterval(uiTimer);
        btn.innerText = "启动自动巡航";
        btn.classList.remove('stop');
        panel.classList.remove('active');
        status.innerText = "自动巡航已停止。";
    } else {
        isRunning = true;
        btn.innerText = "停止自动巡航";
        btn.classList.add('stop');
        panel.classList.add('active');
        status.innerText = "系统已启动，正在对齐收盘时间...";
        
        updateCountdowns();
        uiTimer = setInterval(updateCountdowns, 1000);
        
        scan4H().then(() => scan5M());
        
        startCycle4h();
        startCycle5m();
    }
}

function formatPrice(price) {
    if (price >= 100) return price.toFixed(2);
    if (price >= 1) return price.toFixed(4);
    if (price >= 0.01) return price.toFixed(5);
    return price.toFixed(6);
}
</script>

</body>
</html>
