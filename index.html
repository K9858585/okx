<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欧易 5m 联动箱体探测 (BTC大盘风控版)</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#ff9f0a;color:#000; box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.b2{background:#da3633;color:#fff}
.b3{background:#238636;color:#fff}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;text-align:center; display:flex; justify-content:space-between; align-items:center;}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;margin:8px 0; animation: pop 0.3s ease-out; position:relative;}
@keyframes pop { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.t{font-size:18px;font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#8b949e}.Y{color:#ff9f0a}.B{color:#58a6ff}
.info{font-size:14px;line-height:1.8;margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.info span{color:#8b949e;}
.info b{color:#fff;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.empty{color:#8b949e;font-size:13px;padding:20px;text-align:center;border:1px dashed #30363d;border-radius:10px}
.badge{font-size:13px; padding:3px 8px; border-radius:12px; background:#21262d; border:1px solid #30363d;}
.timer{color:#79c0ff; font-weight:bold; font-family:monospace;}
.rank-badge { position: absolute; top: -10px; right: 14px; background: #ff9f0a; color: #000; font-weight: bold; font-size: 13px; padding: 2px 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(255,159,10,0.5); }
.market-status { font-size: 14px; font-weight: bold; margin-bottom: 10px; padding: 10px; border-radius: 8px; text-align: center; }
</style>
</head>
<body>

<div class="win">
  <h2><img src="https://www.okx.com/favicon.ico" width="20" height="20"> 5m 联动箱体探测 (BTC风控)</h2>
  
  <div id="btc-status" class="market-status" style="display:none;"></div>

  <button class="btn b1" id="f1">🔍 扫描全市场真横盘</button>
  <button class="btn b3" id="f_auto">⏱️ 开启 5m 自动巡航</button>
  <div class="st">
    <span id="st1">准备就绪 (请确保网络直连)</span>
    <span id="percent" style="color:#ff9f0a; font-weight:bold;">0%</span>
  </div>
  <div class="st" style="margin-top:5px; background:transparent; border:1px solid #2d3748; justify-content:center;">
    下次扫描倒计时: <span class="timer" id="countdown">--:--</span>
  </div>
  <div id="err-msg" style="display:none; margin-top:10px;">
      <div class="btn b2" onclick="location.reload()">网络请求失败 (请检查梯子)</div>
  </div>
</div>

<div id="result-area">
  <div class="win" id="list-area" style="display:none;">
    <div style="font-size:14px; color:#8b949e; margin-bottom:10px;">💡 已接入 BTC 15m 风控。大盘不稳时，任何箱体都是纸糊的。</div>
    <div id="out-cards"></div>
  </div>
</div>

<script>
const FIXED_COINS = [
  "BTCUSDT", "ETHUSDT", "SOXLUSDT", "SNDKUSDT", "ZECUSDT", "SOLUSDT", "NVDAUSDT", "XAUUSDT", "ANTUSDT", "MMTUSDT",
  "MUUSDT", "XRPUSDT", "SKHYNIXUSDT", "SOXSUSDT", "HYPEUSDT", "PIEVERSEUSDT", "BREVUSDT", "XAGUSDT", "KORUUSDT", "DOGEUSDT",
  "PEPEUSDT", "SPCXUSDT", "NEARUSDT", "PIPPINUSDT", "SNXXUSDT", "CLUSDT", "PUMPUSDT", "SKHYUSDT", "MSTRUSDT", "UNIUSDT",
  "QQQUSDT", "LITUSDT", "AKEUSDT", "WLDUSDT", "AMDUSDT", "AAOIUSDT", "ENAUSDT", "FILUSDT", "SUIUSDT", "INTCUSDT",
  "ZHONGJIUSDT", "NBISUSDT", "BNBUSDT", "CRCLUSDT", "TRUMPUSDT", "PENGUUSDT", "ADAUSDT", "AAVEUSDT", "TQQQUSDT", "LINKUSDT",
  "GOOGLUSDT", "UNITREEUSDT", "MRVLUSDT", "BZUSDT", "LTCUSDT", "HUMAUSDT", "INJUSDT", "STRKUSDT", "LITEUSDT", "BCHUSDT",
  "AVAXUSDT", "ASTERUSDT", "TSLAUSDT", "IRYSUSDT", "CRWVUSDT", "DRAMUSDT", "TAOUSDT", "ZROUSDT", "ARBUSDT", "SAMSUNGUSDT",
  "ZILUSDT", "UPUSDT", "ZHIPUUSDT", "VVVUSDT", "BTWUSDT", "AAPLUSDT", "XPLUSDT", "ONDOUSDT", "TRXUSDT", "OKBUSDT",
  "TSMUSDT", "NESUSDT", "AXTIUSDT", "NIGHTUSDT", "SPYUSDT", "UVXYUSDT", "MUUUSDT", "DGAIUSDT", "GRAMUSDT", "XLMUSDT",
  "ICPUSDT", "SQQQUSDT", "CXMTUSDT", "BEUSDT", "SOPHUSDT", "PROSUSDT", "EWYUSDT", "USELESSUSDT", "ZKPUSDT", "OPUSDT"
];

const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
let audioCtx = null;
let autoTimer = null;
let isScanning = false;

// 全局大盘风控状态
let btcTrend = 'NEUTRAL'; // 'BULL', 'BEAR', 'NEUTRAL'

function getCache() {
    const raw = localStorage.getItem('okx_box_cache_v6');
    return raw ? JSON.parse(raw) : {};
}
function updateCache(coin) {
    const cache = getCache(); cache[coin] = Date.now();
    localStorage.setItem('okx_box_cache_v6', JSON.stringify(cache));
}
function isCooldown(coin) {
    const cache = getCache(); const lastTime = cache[coin];
    if (!lastTime) return false;
    return (Date.now() - lastTime) < 3600000; 
}

function playAlert(){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

async function fetchOKXDirect(path) {
    const url = 'https://www.okx.com' + path;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    try {
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) return { err: 'HTTP ' + res.status };
        const json = await res.json();
        if (json.code !== '0') return { err: json.msg };
        return { data: json.data };
    } catch (e) {
        clearTimeout(timer);
        return { err: '网络超时' };
    }
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1');
  const data=[...closedData].reverse();
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2])); l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

// 计算EMA
function calcEMA(arr, period) {
    let k = 2 / (period + 1);
    let ema = arr[0];
    let res = [ema];
    for (let i = 1; i < arr.length; i++) {
        ema = arr[i] * k + ema * (1 - k);
        res.push(ema);
    }
    return res;
}

// 获取并分析 BTC 趋势
async function checkBTCTrend() {
    // 拉取 BTC 15m 数据
    const kr = await fetchOKXDirect(`/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=15m&limit=40`);
    if (kr.err || !kr.data) {
        btcTrend = 'NEUTRAL';
        return;
    }
    const kp = parseK(kr.data);
    const ema20 = calcEMA(kp.c, 20);
    const curPrice = kp.c[kp.c.length - 1];
    const curEma20 = ema20[ema20.length - 1];
    
    // 判断前10根的趋势
    const prevPrice = kp.c[kp.c.length - 10];
    
    if (curPrice > curEma20 && curPrice > prevPrice * 1.002) {
        btcTrend = 'BULL';
    } else if (curPrice < curEma20 && curPrice < prevPrice * 0.998) {
        btcTrend = 'BEAR';
    } else {
        btcTrend = 'NEUTRAL';
    }
}

async function runScan() {
  if (isScanning) return;
  isScanning = true;
  
  $('st1').innerHTML = '<span class="sp"></span>分析BTC大盘趋势...';
  $('err-msg').style.display = 'none';
  $('list-area').style.display = 'none';
  
  // 1. 先看大盘
  await checkBTCTrend();
  
  const btcStatusDiv = $('btc-status');
  btcStatusDiv.style.display = 'block';
  if (btcTrend === 'BULL') {
      btcStatusDiv.innerText = '🟢 BTC 15m 向上：允许做多，禁止做空';
      btcStatusDiv.style.backgroundColor = 'rgba(0, 230, 118, 0.15)';
      btcStatusDiv.style.color = '#3fb950';
      btcStatusDiv.style.border = '1px solid #3fb950';
  } else if (btcTrend === 'BEAR') {
      btcStatusDiv.innerText = '🔴 BTC 15m 向下：允许做空，禁止做多';
      btcStatusDiv.style.backgroundColor = 'rgba(255, 82, 82, 0.15)';
      btcStatusDiv.style.color = '#f85149';
      btcStatusDiv.style.border = '1px solid #f85149';
  } else {
      btcStatusDiv.innerText = '🟡 BTC 15m 震荡：多空均可，轻仓为主';
      btcStatusDiv.style.backgroundColor = 'rgba(255, 159, 10, 0.15)';
      btcStatusDiv.style.color = '#ff9f0a';
      btcStatusDiv.style.border = '1px solid #ff9f0a';
  }
  
  $('st1').innerHTML = '<span class="sp"></span>按大盘风向扫描箱体...';
  
  const targetInstIds = FIXED_COINS.map(c => c.replace('USDT', '-USDT-SWAP')).filter(id => !id.includes('BTC'));
  
  let results = [];
  let done = 0;
  let failCount = 0;

  const promises = targetInstIds.map(async (instId) => {
    const kr = await fetchOKXDirect(`/api/v5/market/candles?instId=${instId}&bar=5m&limit=65`);
    done++;
    $('percent').innerText = `${Math.round((done/targetInstIds.length)*100)}%`;
    
    if (kr.err || !kr.data || kr.data.length < 60) {
        failCount++;
        return;
    }

    const kp = parseK(kr.data);
    const { c, h, l } = kp;
    
    const recent60H = h.slice(-60);
    const recent60L = l.slice(-60);
    const recent60C = c.slice(-60);
    const curPrice = recent60C[recent60C.length - 1];

    // === 密集区计算 ===
    let validH = [], validL = [];
    for(let i=0; i<60; i++) {
        if (recent60L[i] > curPrice * 0.975 && recent60H[i] < curPrice * 1.025) {
            validH.push(recent60H[i]); validL.push(recent60L[i]);
        }
    }
    if (validH.length < 15) return;

    let sortH = [...validH].sort((a, b) => b - a);
    let maxH = sortH.slice(0, 5).reduce((a, b) => a + b, 0) / 5; 
    let sortL = [...validL].sort((a, b) => a - b);
    let minL = sortL.slice(0, 5).reduce((a, b) => a + b, 0) / 5;
    
    const amp = (maxH - minL) / minL * 100;
    if (amp < 0.3 || amp > 3.0) return; 

    const boxPos = (curPrice - minL) / (maxH - minL); 
    if (boxPos > 0.35 && boxPos < 0.65) return; 

    let touchTop = 0, touchBottom = 0;
    for(let i=0; i<validH.length; i++) {
        if(validH[i] >= maxH * 0.998) touchTop++;
        if(validL[i] <= minL * 1.002) touchBottom++;
    }
    if(touchTop < 2 || touchBottom < 2) return;

    // === 大盘风控过滤 ===
    if (btcTrend === 'BEAR' && boxPos <= 0.35) return; // 大盘向下，禁止箱底做多
    if (btcTrend === 'BULL' && boxPos >= 0.65) return; // 大盘向上，禁止箱顶做空

    // ================= 打分体系 =================
    let score = 0;
    score += Math.min(20, (touchTop + touchBottom) * 4);
    if (amp >= 0.5 && amp <= 2.0) score += 20;
    else if (amp > 2.0 && amp <= 3.0) score += 10;

    if (boxPos <= 0.1 || boxPos >= 0.9) score += 60; 
    else if (boxPos <= 0.2 || boxPos >= 0.8) score += 50;
    else if (boxPos <= 0.35 || boxPos >= 0.65) score += 40;

    if (score < 70) return; 

    const base = instId.split('-')[0];
    if (isCooldown(base)) return; 

    let signal = '', stopLoss = 0, tp = 0;

    if (boxPos <= 0.35) {
      signal = 'LONG';
      stopLoss = minL * 0.995; 
      tp = maxH; 
    } else {
      signal = 'SHORT';
      stopLoss = maxH * 1.005; 
      tp = minL; 
    }

    const risk = Math.abs(curPrice - stopLoss);
    const reward = Math.abs(tp - curPrice);
    const rr = (reward / risk).toFixed(1);

    updateCache(base);

    results.push({
      base, curPrice, maxH, minL, amp, signal, stopLoss, tp, score, touchTop, touchBottom, rr
    });
  });

  await Promise.all(promises);
  isScanning = false;
  
  if (failCount === 100) {
      $('st1').innerText = `❌ 网络全盘失败`;
      $('err-msg').style.display = 'block';
      return;
  }

  results.sort((a, b) => b.score - a.score);

  if (results.length > 0) {
    const best = results[0]; 
    const isLong = best.signal === 'LONG';
    const color = isLong ? '#3fb950' : '#f85149';
    const dirTxt = isLong ? '箱底做多 🚀' : '箱顶做空 🌊';
    const scoreColor = best.score >= 90 ? '#3fb950' : '#ff9f0a';

    let html = `
      <div class="card">
        <div class="rank-badge">🏆 顺势最强箱体</div>
        <div class="t" style="margin-top:5px;">
          <span>${best.base} <span class="badge" style="border-color:${scoreColor}; color:${scoreColor}">${best.score}分</span></span>
          <span class="badge" style="color:${color}">${dirTxt}</span>
        </div>
        <div class="info">
          <span>现价:</span> <b>${px(best.curPrice)}</b>
          <span>预估盈亏比:</span> <b class="L">1:${best.rr}</b>
          <span>密集箱顶:</span> <b class="S">${px(best.maxH)}</b>
          <span>密集箱底:</span> <b class="L">${px(best.minL)}</b>
          <span>建议止损:</span> <b class="Y">${px(best.stopLoss)}</b>
          <span>建议止盈:</span> <b class="B">${px(best.tp)}</b>
          <span>触顶次数:</span> <b>${best.touchTop}次</b>
          <span>触底次数:</span> <b>${best.touchBottom}次</b>
        </div>
      </div>
    `;
    
    $('out-cards').innerHTML = html;
    $('st1').innerText = `✅ 锁定最强王者：${best.base}`;
    $('list-area').style.display = 'block';
    playAlert();
    
  } else {
    $('st1').innerText = `✅ 扫描完毕，无符合大盘顺势的箱体`;
    $('out-cards').innerHTML = `<div class="empty">当前无符合形态。如果是大盘单边暴跌，推不出任何做多信号是系统在保护你。</div>`;
    $('list-area').style.display = 'block';
  }
}

// 定时器
let countdownTimer = null;
function startAutoScan() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  $('f_auto').innerText = '🛑 停止自动巡航';
  $('f_auto').classList.replace('b3', 'b2');
  
  const nextScan = () => {
    const now = Date.now();
    const next5m = Math.ceil(now / 300000) * 300000 + 2000;
    if(countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        const left = Math.max(0, next5m - Date.now());
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        $('countdown').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        if (left <= 0) {
            clearInterval(countdownTimer);
            runScan();
            if(autoTimer) nextScan();
        }
    }, 1000);
    autoTimer = true;
  };
  runScan();
  nextScan();
}

$('f1').onclick = () => {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    runScan();
};
$('f_auto').onclick = () => {
  if(autoTimer) {
      autoTimer = null; clearInterval(countdownTimer);
      $('f_auto').innerText = '⏱️ 开启 5m 自动巡航';
      $('f_auto').classList.replace('b2', 'b3');
      $('countdown').innerText = '--:--';
      $('st1').innerText = '自动巡航已停止';
  } else {
      startAutoScan();
  }
};
</script>
</body>
</html>
