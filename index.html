<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OKX 1H 强趋势稳站 V33</title>
<style>
    :root {
        --bg-color: #0b0e14; --card-bg: #151a24; --text-main: #e2e8f0; --text-sub: #94a3b8;
        --accent-blue: #00e5ff; --accent-green: #00e676; --accent-red: #ff5252; --border-color: #2d3748;
        --accent-gold: #ffb300;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 16px; line-height: 1.5; padding-bottom: 40px;}
    
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 22px; color: var(--accent-blue); text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

    .timer-panel { background: linear-gradient(145deg, #1a202c, #11151f); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 15px; text-align: center; display: none;}
    .timer-panel.active { display: block; }
    .timer-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; }
    .timer-label { color: var(--text-sub); }
    .timer-value { color: var(--accent-gold); font-family: monospace; font-size: 16px; }

    .master-btn { display: block; width: 100%; padding: 16px; background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-size: 17px; font-weight: bold; border: none; border-radius: 12px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);}
    .master-btn.stop { background: linear-gradient(90deg, #ff5252, #d32f2f); color: #fff; box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3);}
    .master-btn:active { transform: scale(0.98); }

    .status-container { background: rgba(255, 179, 0, 0.05); border: 1px solid rgba(255, 179, 0, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 15px; }
    .status-box { text-align: center; font-size: 13px; font-weight: 500; color: var(--accent-gold); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .status-text { text-align: left; }
    .status-percent { font-weight: bold; color: #fff; }
    .progress-bar { width: 100%; height: 6px; background: #2d3748; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green)); transition: width 0.1s ease; }
    
    .strategy-block { border: 2px solid #2d3748; border-radius: 14px; padding: 12px; margin-bottom: 25px; background: #0d1219; }
    .block-title { font-size: 16px; font-weight: bold; color: var(--accent-blue); margin-bottom: 12px; text-align: center; border-bottom: 1px dashed #2d3748; padding-bottom: 8px;}
    
    .table-container { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { background: #1e2532; color: var(--text-sub); padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--border-color); }
    th:first-child { text-align: left; }
    td { padding: 12px 10px; text-align: right; border-bottom: 1px solid rgba(45, 55, 72, 0.5); }
    td:first-child { text-align: left; font-weight: bold; color: #fff; }

    .tag-long { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(0, 230, 118, 0.3); }
    .tag-short { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(255, 82, 82, 0.3); }
</style>
</head>
<body>

<div class="header">
    <h1>⚡ 1H 强趋势稳站 V33</h1>
</div>

<button class="master-btn" id="masterBtn" onclick="toggleAuto()">启动自动巡航</button>

<div class="timer-panel" id="timerPanel">
    <div class="timer-row"><span class="timer-label">距离下次 1H 扫描</span><span class="timer-value" id="countdown1h">--:--:--</span></div>
</div>

<div class="status-container" id="statusContainer">
    <div class="status-box">
        <span class="status-text" id="statusText">等待启动...</span>
        <span class="status-percent" id="statusPercent">0%</span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<div class="strategy-block">
    <div class="block-title">📊 1H 均线+MACD 完美稳站池</div>
    <div class="table-container">
        <table>
            <thead><tr><th>币种</th><th>方向</th><th>MACD状态</th><th>关键位(EMA20)</th><th>收盘价</th></tr></thead>
            <tbody id="tbody1h"><tr><td colspan="5" style="text-align:center; color:#666;">暂无信号，请启动巡航</td></tr></tbody>
        </table>
    </div>
</div>

<script>
const OKX_URL = "https://www.okx.com/api/v5/market/candles";

const FIXED_COINS = [
    "UP", "ZRO", "XPL", "BERA", "CRWV", "AVGO", "NIGHT", "ICP", "META", 
    "APT", "SAMSUNG", "PENGU", "JUP", "XLM", "ZHIPU", "CRV", "TSM", "MUU", 
    "TRX", "ONDO", "VVV", "AAOI", "PONS", "ASTER", "SHIB", "OP", "DOT", 
    "LITE", "NBIS", "SPY", "UVXY", "ZHONGJIU", "MRVL", "TSLA", "SKDD", 
    "AAVE", "INJ", "DRAM", "BZ", "AAPL", "SQQQ", "TAO", "STRK", "ARB", "AVAX",
    "ANT", "BTC", "ETH", "OKB", "SOL", "DOGE", "XRP", "BCH", "DOOD", "ZEC", "SNDK", 
    "XAU", "NVDA", "IRYS", "MMT", "PIEVERSE", "SOXL", "AKE", "PIPPIN", "SPCX", "SKHYNIX", 
    "BTW", "MU", "HUMA", "HYPE", "CL", "PEPE", "XAG", "CAP", "PROS", 
    "SENT", "YB", "AMD", "QQQ", "BREV", "RAVE", "INTC", "NESA", "SOXS", 
    "PUMP", "TRUMP", "UNITREE", "NEAR", "SNXX", "PDD", "GOOGL", "KORU", "LIT", "INI", "USELESS"
];

let isRunning = false;
let isScanning = false; 
let timer1h, uiTimer;

let audioCtx = null;
let ringInterval = null;

function playLongAlert() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (ringInterval) clearInterval(ringInterval);
    
    let count = 0;
    const ring = () => {
        if (count >= 5) { clearInterval(ringInterval); return; }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        count++;
    };
    ring();
    ringInterval = setInterval(ring, 400);
}

function updateProgress(current, total, text) {
    const percent = Math.round((current / total) * 100);
    document.getElementById('statusText').innerText = text;
    document.getElementById('statusPercent').innerText = `${percent}%`;
    document.getElementById('progressFill').style.width = `${percent}%`;
}

function resetProgress(text) {
    document.getElementById('statusText').innerText = text;
    document.getElementById('statusPercent').innerText = `0%`;
    document.getElementById('progressFill').style.width = `0%`;
}

async function fetchKlinesData(coin) {
    const limit = 100; // 1H 周期需要更多数据计算 MACD
    try {
        const okxSym = `${coin}-USDT-SWAP`;
        const res = await fetch(`${OKX_URL}?instId=${okxSym}&bar=1H&limit=${limit}`);
        const json = await res.json();
        if (json.code === "0" && json.data.length > 0) {
            const allData = json.data.reverse();
            const closedData = allData.filter(d => d[8] === '1');
            const currentData = allData[allData.length - 1];
            return {
                closed: closedData.map(d => ({ open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) })),
                current: { close: parseFloat(currentData[4]) }
            };
        }
    } catch(e) {}
    return { closed: [], current: null };
}

// 计算 EMA 数组
function calcEMAArr(arr, period) {
    let ema = [], k = 2 / (period + 1), prevEma = arr[0];
    for (let i = 0; i < arr.length; i++) { prevEma = (arr[i] - prevEma) * k + prevEma; ema.push(prevEma); }
    return ema;
}

// 计算 MACD
function calcMACD(closes) {
    const ema12 = calcEMAArr(closes, 12);
    const ema26 = calcEMAArr(closes, 26);
    const dif = ema12.map((v, i) => v - ema26[i]);
    const dea = calcEMAArr(dif, 9);
    return { dif, dea };
}

async function asyncPool(poolLimit, array, iteratorFn) {
    const ret = [];
    const executing = new Set();
    for (const item of array) {
        const p = Promise.resolve().then(() => iteratorFn(item));
        ret.push(p);
        executing.add(p);
        const clean = () => executing.delete(p);
        p.then(clean).catch(clean);
        if (executing.size >= poolLimit) {
            await Promise.race(executing);
        }
    }
    return Promise.all(ret);
}

async function run1hScan() {
    const tbody = document.getElementById('tbody1h');
    tbody.innerHTML = "";
    let count = 0;
    let completed = 0;

    await asyncPool(8, FIXED_COINS, async (coin) => {
        const data = await fetchKlinesData(coin);
        
        completed++;
        updateProgress(completed, FIXED_COINS.length, `[1H极速扫描] 已完成: ${completed} / ${FIXED_COINS.length}`);

        // 至少需要 35 根 K 线来计算稳定的 MACD
        if (data.closed.length >= 35 && data.current) {
            const k = data.closed;
            const closes = k.map(x => x.close);
            
            const ema20 = calcEMAArr(closes, 20);
            const macd = calcMACD(closes);
            
            const lastIdx = k.length - 1;
            const realTimePrice = data.current.close;

            // 1. MACD 零轴判定
            const curDIF = macd.dif[lastIdx];
            const curDEA = macd.dea[lastIdx];
            const macdUp = curDIF > 0 && curDEA > 0;
            const macdDown = curDIF < 0 && curDEA < 0;

            // 2. 过去 5 根 K 线站上/站下 EMA20
            let past5Above = true;
            let past5Below = true;
            for (let i = 1; i <= 5; i++) {
                if (k[lastIdx - 5 + i].close <= ema20[lastIdx - 5 + i]) past5Above = false;
                if (k[lastIdx - 5 + i].close >= ema20[lastIdx - 5 + i]) past5Below = false;
            }

            // 3. 当前 K 线影线不碰均线
            const curK = k[lastIdx];
            const curE20 = ema20[lastIdx];
            // 做多：下影线完全在 EMA20 上方
            const shadowAbove = curK.low > curE20; 
            // 做空：上影线完全在 EMA20 下方
            const shadowBelow = curK.high < curE20; 

            let signalType = null;

            // 做多综合判定
            if (macdUp && past5Above && shadowAbove && curK.close > curE20) {
                // 防追高
                if (realTimePrice <= curK.close * 1.01) {
                    signalType = "LONG";
                }
            }
            // 做空综合判定
            else if (macdDown && past5Below && shadowBelow && curK.close < curE20) {
                // 防追空
                if (realTimePrice >= curK.close * 0.99) {
                    signalType = "SHORT";
                }
            }

            if (signalType) {
                const tagClass = signalType === "LONG" ? "tag-long" : "tag-short";
                const tagText = signalType === "LONG" ? "完美多头" : "完美空头";
                const macdText = signalType === "LONG" ? "零轴上" : "零轴下";
                
                tbody.innerHTML += `<tr><td>${coin}</td><td><span class="${tagClass}">${tagText}</span></td><td style="color:#aaa">${macdText}</td><td style="color:#00e5ff">${formatPrice(curE20)}</td><td style="color:#fff">${formatPrice(curK.close)}</td></tr>`;
                count++;
            }
        }
    });

    return count;
}

async function scan1H() {
    if (isScanning) return;
    isScanning = true;
    resetProgress("准备启动并发引擎...");
    
    const count = await run1hScan();
    
    if (count > 0) {
        playLongAlert();
        resetProgress(`🚨 极速扫描完成：发现 ${count} 个 1H 强趋势信号！`);
    } else {
        resetProgress(`✅ 1H 扫描完成，本轮无完美信号。`);
    }
    
    isScanning = false;
}

function startCycle1H() {
    const intervalMs = 60 * 60 * 1000;
    const now = Date.now();
    // 卡在整点后的第 2 秒触发
    const nextTime = Math.ceil(now / intervalMs) * intervalMs + 2000;
    
    timer1h = setTimeout(async () => { 
        await scan1H(); 
        if (isRunning) startCycle1H(); 
    }, nextTime - now);
}

function updateCountdowns() {
    if (!isRunning) return;
    const now = Date.now();
    const next1h = Math.ceil(now / 3600000) * 3600000 + 2000;
    const diff1h = Math.max(0, next1h - now);
    document.getElementById('countdown1h').innerText = `${Math.floor(diff1h/3600000).toString().padStart(2,'0')}:${Math.floor((diff1h%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((diff1h%60000)/1000).toString().padStart(2,'0')}`;
}

function toggleAuto() {
    const btn = document.getElementById('masterBtn');
    const panel = document.getElementById('timerPanel');

    if (isRunning) {
        isRunning = false;
        clearTimeout(timer1h); clearInterval(uiTimer);
        if (ringInterval) clearInterval(ringInterval);
        btn.innerText = "启动自动巡航"; btn.classList.remove('stop');
        panel.classList.remove('active'); resetProgress("自动巡航已停止。");
    } else {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        isRunning = true;
        btn.innerText = "停止自动巡航"; btn.classList.add('stop');
        panel.classList.add('active'); resetProgress("系统已启动，正在对齐整点...");
        
        updateCountdowns(); 
        uiTimer = setInterval(updateCountdowns, 1000);
        
        scan1H();
        startCycle1H();
    }
}

function formatPrice(price) {
    if (price >= 100) return price.toFixed(2);
    if (price >= 1) return price.toFixed(4);
    if (price >= 0.01) return price.toFixed(5);
    return price.toFixed(6);
}
</script>
</body>
</html>
