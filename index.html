<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OKX 前50成交额+30专属 深度AI优选</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:600px;margin:0 auto}
h2{font-size:18px;margin:0 0 15px;color:#ff9f0a;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:20px;margin-bottom:14px;text-align:center}
.btn{display:block;width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:opacity 0.2s;background:#ff9f0a;color:#000;box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.btn:active{opacity:0.7}
.btn:disabled{background:#30363d;color:#8b949e;box-shadow:none;cursor:not-allowed}
.sp{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}

/* 推荐结果卡片 */
.result-card{display:none;background:#161b22;border:2px solid #ff9f0a;border-radius:14px;padding:20px;position:relative;box-shadow:0 0 25px rgba(255,159,10,0.15);animation:pop 0.4s ease-out}
@keyframes pop { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg, #ff9f0a, #ffb347);color:#000;font-weight:800;font-size:13px;padding:4px 16px;border-radius:12px;box-shadow:0 4px 10px rgba(255,159,10,0.4);white-space:nowrap;}

.coin-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:15px;margin-top:10px;border-bottom:1px dashed #30363d;padding-bottom:12px;}
.coin-name{font-size:26px;font-weight:800;color:#fff;}
.coin-dir{font-size:15px;font-weight:700;padding:4px 12px;border-radius:8px;}
.coin-dir.L{color:#3fb950;background:rgba(63,185,80,.15);border:1px solid #3fb950;}
.coin-dir.S{color:#f85149;background:rgba(248,81,73,.15);border:1px solid #f85149;}
.score-box{font-size:24px;font-weight:800;color:#ff9f0a;text-align:right;line-height:1.2;}
.score-box span{font-size:12px;color:#8b949e;font-weight:400;}

/* 交易计划 */
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px;}
.plan-item{background:#0d1117;padding:12px;border-radius:10px;border:1px solid #30363d;text-align:left;}
.plan-item .lbl{font-size:12px;color:#8b949e;margin-bottom:4px;}
.plan-item .val{font-size:18px;font-weight:700;font-family:monospace;}
.val.entry{color:#58a6ff}.val.sl{color:#f85149}.val.tp{color:#3fb950}.val.rr{color:#fff}

/* 分析报告 */
.analysis{background:#0d1117;padding:15px;border-radius:10px;border:1px solid #30363d;text-align:left;}
.analysis h4{font-size:13px;color:#ff9f0a;margin:0 0 10px 0;display:flex;align-items:center;gap:6px;}
.reason-list{font-size:13px;line-height:1.7;color:#c9d1d9;margin:0;padding-left:18px;}
.reason-list li{margin-bottom:6px;}
.reason-list li::marker{color:#3fb950;}

/* 备选列表 */
.others{display:none;margin-top:15px;text-align:left;}
.others h4{font-size:14px;color:#8b949e;margin-bottom:10px;}
.other-item{display:flex;justify-content:space-between;font-size:13px;padding:8px 10px;background:#161b22;border-radius:8px;margin-bottom:6px;border:1px solid #30363d;}
</style>
</head>
<body>

<h2>🤖 前50成交额+30专属 深度优选</h2>

<button class="btn" id="btnRun" onclick="startScan()">🔍 一键扫描：推荐当前最佳入场</button>

<!-- 推荐结果 -->
<div class="result-card" id="resultCard">
  <div class="crown">👑 当前最佳入场推荐</div>
  <div class="coin-head">
    <div>
      <div class="coin-name" id="resCoin">ETH</div>
      <div style="font-size:12px;color:#8b949e;margin-top:4px;">欧易永续 · 深度分析池</div>
    </div>
    <div style="text-align:right;">
      <div class="coin-dir" id="resDir">做多</div>
    </div>
  </div>

  <div class="score-box" style="margin-bottom:15px;">
    <div id="resScore">95</div>
    <span>综合技术评分</span>
  </div>

  <div class="plan-grid">
    <div class="plan-item">
      <div class="lbl">建议入场价</div>
      <div class="val entry" id="resEntry">---</div>
    </div>
    <div class="plan-item">
      <div class="lbl">预估盈亏比</div>
      <div class="val rr" id="resRR">1 : 2.0</div>
    </div>
    <div class="plan-item">
      <div class="lbl">防守止损点位</div>
      <div class="val sl" id="resSL">---</div>
    </div>
    <div class="plan-item">
      <div class="lbl">目标止盈点位</div>
      <div class="val tp" id="resTP">---</div>
    </div>
  </div>

  <div class="analysis">
    <h4>🔬 严密分析报告</h4>
    <ul class="reason-list" id="resReasons">
      <!-- 动态生成 -->
    </ul>
  </div>
</div>

<!-- 备选列表 -->
<div class="others" id="othersBox">
  <h4>⚖️ 其他符合入场条件的备选币种</h4>
  <div id="othersList"></div>
</div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(5);

// 你之前给的 30 个专属保底币种（这里挑选了之前你指定的部分重点）
const CUSTOM_COINS = [
  "BTC", "ETH", "SOL", "DOGE", "XRP", "PEPE", "BCH", "LTC", "TRX", "ADA", 
  "AVAX", "LINK", "DOT", "SUI", "APT", "NEAR", "FIL", "OP", "ARB", "UNI",
  "INJ", "AAVE", "CRV", "WLD", "ONDO", "JUP", "SHIB", "ZRO", "TAO", "BNB"
];

// ============ 核心数据获取 ============
async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),6000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closed=d.filter(x=>x[8]==='1').reverse();
  for(const x of closed){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

async function batchFetch(tasks, concurrency=8){
  const results=new Array(tasks.length).fill(null);
  let idx=0;
  async function worker(){
    while(idx<tasks.length){
      const i=idx++;
      try{ results[i]=await tasks[i](); }catch(e){ results[i]=null; }
    }
  }
  await Promise.all(Array(Math.min(concurrency,tasks.length)).fill().map(worker));
  return results;
}

// ============ 技术指标 ============
function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}

function calcRSI(closes, period=14){
  if(closes.length <= period) return [];
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  const rsi = [];
  rsi[period] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    let gain = diff >= 0 ? diff : 0;
    let loss = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
    rsi[i] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  }
  return new Array(period).fill(NaN).concat(rsi.slice(period));
}

// ============ 深度分析引擎 ============
function analyzeCoin(k1h, k15m, base) {
    const n1 = k1h.c.length;
    const n15 = k15m.c.length;
    if (n1 < 50 || n15 < 30) return null;

    const ema20_1h = calcEMA(k1h.c, 20)[n1-1];
    const ema50_1h = calcEMA(k1h.c, 50)[n1-1];
    const curC = k15m.c[n15-1];
    const curO = k15m.o[n15-1];
    const curL = k15m.l[n15-1];
    const curH = k15m.h[n15-1];
    
    const ema20_15 = calcEMA(k15m.c, 20)[n15-1];
    const ema50_15 = calcEMA(k15m.c, 50)[n15-1];
    const rsi15 = calcRSI(k15m.c, 14)[n15-1];

    let direction = '';
    let reasons = [];
    let score = 0;
    let sl = 0, tp = 0;

    const isBull1h = ema20_1h > ema50_1h;
    const isBear1h = ema20_1h < ema50_1h;

    // ---------- 做多逻辑 ----------
    if (isBull1h && curC > ema20_1h) {
        score += 40;
        reasons.push(`1H级别 EMA20(${px(ema20_1h)}) > EMA50(${px(ema50_1h)})，大方向明确处于多头趋势。`);

        const distToEma20 = Math.abs(curC - ema20_15) / curC;
        
        if (distToEma20 < 0.005 && curC > curO) {
            direction = 'LONG';
            score += 30;
            reasons.push(`15m级别价格成功回踩 EMA20(${px(ema20_15)}) 支撑，且最新K线收出阳线，表明回调结束。`);
            
            if (rsi15 < 45) {
                score += 15;
                reasons.push(`15m RSI 报 ${rsi15.toFixed(1)}，脱离超买区，有向上修复空间。`);
            }

            sl = Math.min(...k15m.l.slice(-5)) * 0.998;
            if (sl >= curC) sl = curC * 0.99;
            const risk = curC - sl;
            tp = curC + risk * 2;

            if (risk / curC < 0.008) {
                score += 15;
                reasons.push(`止损空间控制在 ${(risk/curC*100).toFixed(2)}% 以内，具有极高的盈亏比结构。`);
            }
        } else if (curC <= ema20_15 && rsi15 < 35 && curC > curO) {
            direction = 'LONG';
            score += 20;
            reasons.push(`15m级别出现超跌，RSI跌至 ${rsi15.toFixed(1)}，且K线收阳，存在均值回归做多机会。`);
            sl = Math.min(...k15m.l.slice(-5)) * 0.995;
            const risk = curC - sl;
            tp = curC + risk * 2;
        }
    }
    // ---------- 做空逻辑 ----------
    else if (isBear1h && curC < ema20_1h) {
        score += 40;
        reasons.push(`1H级别 EMA20(${px(ema20_1h)}) < EMA50(${px(ema50_1h)})，大方向明确处于空头趋势。`);

        const distToEma20 = Math.abs(curC - ema20_15) / curC;
        
        if (distToEma20 < 0.005 && curC < curO) {
            direction = 'SHORT';
            score += 30;
            reasons.push(`15m级别价格反抽 EMA20(${px(ema20_15)}) 受阻，且最新K线收出阴线，表明反弹结束。`);
            
            if (rsi15 > 55) {
                score += 15;
                reasons.push(`15m RSI 报 ${rsi15.toFixed(1)}，脱离超卖区，有向下回落空间。`);
            }

            sl = Math.max(...k15m.h.slice(-5)) * 1.002;
            if (sl <= curC) sl = curC * 1.01;
            const risk = sl - curC;
            tp = curC - risk * 2;

            if (risk / curC < 0.008) {
                score += 15;
                reasons.push(`止损空间控制在 ${(risk/curC*100).toFixed(2)}% 以内，具有极高的盈亏比结构。`);
            }
        } else if (curC >= ema20_15 && rsi15 > 65 && curC < curO) {
            direction = 'SHORT';
            score += 20;
            reasons.push(`15m级别出现超买，RSI高达 ${rsi15.toFixed(1)}，且K线收阴，存在均值回归做空机会。`);
            sl = Math.max(...k15m.h.slice(-5)) * 1.005;
            const risk = sl - curC;
            tp = curC - risk * 2;
        }
    }

    if (direction && score >= 50) {
        return { base, direction, entry: curC, sl, tp, score, reasons };
    }
    return null;
}

// ============ 运行扫描 ============
async function startScan() {
    const btn = $('btnRun');
    btn.disabled = true;
    btn.innerHTML = '<span class="sp"></span>获取成交额前50名...';
    $('resultCard').style.display = 'none';
    $('othersBox').style.display = 'none';

    try {
        // 1. 获取行情，并按真实 USDT 成交额排序，取前 50
        const tickerRes = await fetchOKX('/api/v5/market/tickers?instType=SWAP');
        if (tickerRes.err) throw new Error("获取行情失败");

        const usdtList = tickerRes.data.filter(t => t.instId.endsWith('USDT-SWAP'));
        usdtList.sort((a,b) => {
            const volA = parseFloat(a.volCcy24h || 0) * parseFloat(a.last || 0);
            const volB = parseFloat(b.volCcy24h || 0) * parseFloat(b.last || 0);
            return volB - volA;
        });
        
        // 取前 50 名
        const top50 = usdtList.slice(0, 50).map(t => t.instId.split('-')[0]);

        // 2. 将前 50 名与你的专属 30 币种合并去重
        const scanSet = new Set([...top50, ...CUSTOM_COINS]);
        const scanList = Array.from(scanSet);

        btn.innerHTML = `<span class="sp"></span>深度分析 ${scanList.length} 个币种...`;

        // 3. 并发拉取 K 线数据
        let done = 0;
        const tasks = scanList.map(base => (async()=>{
            const instId = `${base}-USDT-SWAP`;
            const [res1h, res15m] = await Promise.all([
                fetchOKX(`/api/v5/market/candles?instId=${instId}&bar=1H&limit=60`),
                fetchOKX(`/api/v5/market/candles?instId=${instId}&bar=15m&limit=40`)
            ]);
            done++;
            btn.innerHTML = `<span class="sp"></span>深度分析中 ${done}/${scanList.length}...`;
            
            if (res1h.err || res15m.err || !res1h.data || !res15m.data) return null;
            
            const k1h = parseK(res1h.data);
            const k15m = parseK(res15m.data);
            return analyzeCoin(k1h, k15m, base);
        }));

        const rawResults = await batchFetch(tasks, 8); // 并发限制 8 防限流
        const validResults = rawResults.filter(r => r !== null);

        // 4. 排序取最优
        validResults.sort((a,b) => b.score - a.score);
        renderResult(validResults);

    } catch (e) {
        alert("网络错误或代理拦截，请刷新重试。");
    } finally {
        btn.disabled = false;
        btn.innerHTML = '🔍 重新扫描：推荐当前最佳入场';
    }
}

// ============ 渲染结果 ============
function renderResult(results) {
    if (results.length === 0) {
        alert('当前池中未出现符合“严密盈亏比结构”的绝佳点位，建议空仓观望。');
        return;
    }

    const best = results[0];
    const isLong = best.direction === 'LONG';

    // 主推荐卡片
    $('resCoin').innerText = best.base;
    const dirEl = $('resDir');
    dirEl.innerText = isLong ? '做多 (Long)' : '做空 (Short)';
    dirEl.className = 'coin-dir ' + (isLong ? 'L' : 'S');
    
    $('resScore').innerText = best.score;
    $('resEntry').innerText = px(best.entry);
    $('resSL').innerText = px(best.sl);
    $('resTP').innerText = px(best.tp);
    
    const risk = Math.abs(best.entry - best.sl);
    const reward = Math.abs(best.tp - best.entry);
    $('resRR').innerText = `1 : ${(reward/risk).toFixed(2)}`;

    let html = '';
    best.reasons.forEach(r => {
        html += `<li>${r}</li>`;
    });
    $('resReasons').innerHTML = html;

    $('resultCard').style.display = 'block';

    // 备选列表
    if (results.length > 1) {
        let otherHtml = '';
        for (let i = 1; i < results.length; i++) {
            const r = results[i];
            const dirText = r.direction === 'LONG' ? '多' : '空';
            const color = r.direction === 'LONG' ? '#3fb950' : '#f85149';
            otherHtml += `
            <div class="other-item">
                <span style="font-weight:700;color:#fff;">${r.base} <span style="color:${color};font-size:12px;">[${dirText}]</span></span>
                <span style="color:#8b949e;">评分: ${r.score} | 入场: ${px(r.entry)}</span>
            </div>`;
        }
        $('othersList').innerHTML = otherHtml;
        $('othersBox').style.display = 'block';
    }
}
</script>
</body>
</html>
