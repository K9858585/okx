<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZEC 实时全周期作战终端</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:600px;margin:0 auto}
h2{font-size:18px;margin:0 0 15px;color:#ff9f0a;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.btn{display:block;width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:opacity 0.2s;background:#ff9f0a;color:#000;box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.btn:active{opacity:0.7}
.btn:disabled{background:#30363d;color:#8b949e;box-shadow:none;cursor:not-allowed}
.sp{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}

/* 价格面板 */
.price-panel{text-align:center;margin-bottom:15px;padding-bottom:15px;border-bottom:1px dashed #30363d;}
.price-big{font-size:36px;font-weight:900;color:#fff;font-family:monospace; text-shadow: 0 0 10px rgba(255,255,255,0.2);}
.price-chg{font-size:14px;font-weight:bold;margin-top:4px;}

/* 周期卡片 */
.tf-card { background: #11161d; border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 12px; position: relative; overflow: hidden; }
.tf-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.tf-card.L::before { background: #3fb950; }
.tf-card.S::before { background: #f85149; }
.tf-card.N::before { background: #ff9f0a; }

.tf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.tf-title { font-size: 16px; font-weight: bold; color: #fff; }
.tf-status { font-size: 14px; font-weight: bold; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); }
.tf-status.L { color: #3fb950; }
.tf-status.S { color: #f85149; }
.tf-status.N { color: #ff9f0a; }

.plan-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.plan-item { background: #0d1117; padding: 8px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
.plan-item .lbl { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
.plan-item .val { font-size: 14px; font-weight: bold; font-family: monospace; }

.analysis-text { font-size: 13px; color: #8b949e; line-height: 1.5; margin-top: 10px; border-top: 1px dashed #30363d; padding-top: 8px; }
</style>
</head>
<body>

<h2>⚡ ZEC 全周期实战分析</h2>

<button class="btn" id="btnRun" onclick="startScan()">🔍 刷新并跟随盘面</button>

<div id="priceArea" style="display:none;">
  <div class="price-panel">
    <div class="price-big" id="zecPrice">--</div>
    <div class="price-chg" id="zecChg">--</div>
  </div>
</div>

<div id="cardsArea"></div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(5);
const baseCoin = 'ZEC-USDT-SWAP';

async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),6000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closed=d.filter(x=>x[8]==='1').reverse();
  for(const x of closed){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}

// 核心判定逻辑
function analyzeTF(kData, tfName) {
    const { c, o, h, l } = kData;
    const n = c.length;
    if (n < 30) return null;

    const curC = c[n-1];
    const curO = o[n-1];
    const ema5 = calcEMA(c, 5)[n-1];
    const ema10 = calcEMA(c, 10)[n-1];
    const ema20 = calcEMA(c, 20)[n-1];

    // 判断多空
    let isBull = ema5 > ema20 && curC > ema20;
    let isBear = ema5 < ema20 && curC < ema20;
    
    // 极端单边判定
    let statusClass = 'N';
    let statusText = '震荡';
    let dir = '';

    if (isBull) {
        statusClass = 'L';
        statusText = '多头趋势';
        dir = '做多 (LONG)';
    } else if (isBear) {
        statusClass = 'S';
        statusText = '空头趋势';
        dir = '做空 (SHORT)';
    } else {
        // 均线缠绕，看短期动能
        if (curC > ema20) {
            statusClass = 'L'; statusText = '偏多震荡'; dir = '做多 (LONG)';
        } else {
            statusClass = 'S'; statusText = '偏空震荡'; dir = '做空 (SHORT)';
        }
    }

    // 动态计算止盈止损 (利用该周期前几根K线的极值)
    let sl = 0, tp = 0, rr = 0;
    const recent5L = Math.min(...l.slice(-5));
    const recent5H = Math.max(...h.slice(-5));

    if (statusClass === 'L') {
        sl = recent5L * 0.998; // 放在近期低点下方
        const risk = curC - sl;
        tp = curC + risk * 2; // 盈亏比 1:2
    } else {
        sl = recent5H * 1.002; // 放在近期高点上方
        const risk = sl - curC;
        tp = curC - risk * 2;
    }
    
    const riskVal = Math.abs(curC - sl);
    const rewardVal = Math.abs(tp - curC);
    rr = (rewardVal / riskVal).toFixed(1);

    // 形态解释
    let reason = '';
    if (statusClass === 'L') {
        reason = `价格(${px(curC)}) 站上 EMA20(${px(ema20)})，且 EMA5 > EMA20。短线动能向上，回踩不破可进多。`;
    } else {
        reason = `价格(${px(curC)}) 被压制在 EMA20(${px(ema20)}) 之下，且 EMA5 < EMA20。反弹触及均线即可尝试进空。`;
    }

    return { tfName, statusClass, statusText, dir, curC, sl, tp, rr, reason };
}

async function startScan() {
  const btn = $('btnRun');
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>拉取并计算中...';

  try {
    const tickRes = await fetchOKX(`/api/v5/market/ticker?instId=${baseCoin}`);
    if(tickRes.err) throw new Error("价格获取失败");
    const tick = tickRes.data[0];
    const last = parseFloat(tick.last);
    const open24 = parseFloat(tick.open24h);
    const chg = ((last - open24) / open24) * 100;
    
    $('zecPrice').innerText = `$${px(last)}`;
    $('zecChg').innerHTML = `24h 涨跌: <span class="${chg>=0?'L':'S'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span>`;
    $('priceArea').style.display = 'block';

    // 并发请求 4 个周期
    const [r15m, r1h, r4h, r1d] = await Promise.all([
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=15m&limit=50`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1H&limit=50`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=4H&limit=50`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1D&limit=50`)
    ]);

    const tfs = [
      { name: '15分钟 (超短线)', data: parseK(r15m.data) },
      { name: '1小时 (日内短线)', data: parseK(r1h.data) },
      { name: '4小时 (波段趋势)', data: parseK(r4h.data) },
      { name: '日线 (宏观大方向)', data: parseK(r1d.data) }
    ];

    let html = '';
    tfs.forEach(tf => {
        const res = analyzeTF(tf.data, tf.name);
        if (!res) return;

        let cColor = res.statusClass === 'L' ? '#3fb950' : res.statusClass === 'S' ? '#f85149' : '#ff9f0a';
        
        html += `
        <div class="tf-card ${res.statusClass}">
            <div class="tf-header">
                <span class="tf-title">${res.tfName}</span>
                <span class="tf-status ${res.statusClass}">${res.statusText}</span>
            </div>
            
            <div style="font-size:16px; font-weight:bold; color:${cColor}; margin-bottom:10px;">
                建议操作：${res.dir}
            </div>

            <div class="plan-grid">
                <div class="plan-item">
                    <div class="lbl">现价进场</div>
                    <div class="val" style="color:#58a6ff;">${px(res.curC)}</div>
                </div>
                <div class="plan-item">
                    <div class="lbl">防守止损</div>
                    <div class="val S">${px(res.sl)}</div>
                </div>
                <div class="plan-item">
                    <div class="lbl">目标止盈</div>
                    <div class="val L">${px(res.tp)}</div>
                </div>
            </div>
            
            <div class="analysis-text">
                <b>形态解析：</b> ${res.reason} <br>
                <b>盈亏比：</b> 1:${res.rr} (若盈亏比大于1.5可执行)
            </div>
        </div>
        `;
    });

    $('cardsArea').innerHTML = html;

  } catch(e) {
    alert("网络错误，请刷新重试。");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔍 刷新并跟随盘面';
  }
}
</script>
</body>
</html>
