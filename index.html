<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZEC 强制亮剑终端 (无观望版)</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:600px;margin:0 auto}
h2{font-size:18px;margin:0 0 15px;color:#ff9f0a;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:opacity 0.2s;background:#ff9f0a;color:#000;box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.btn:active{opacity:0.7}
.btn:disabled{background:#30363d;color:#8b949e;box-shadow:none;cursor:not-allowed}
.sp{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}

/* 核心面板 */
.price-panel{text-align:center;margin-bottom:15px;padding-bottom:15px;border-bottom:1px dashed #30363d;}
.price-big{font-size:36px;font-weight:900;color:#fff;font-family:monospace; text-shadow: 0 0 10px rgba(255,255,255,0.2);}
.price-chg{font-size:14px;font-weight:bold;margin-top:4px;}

/* 状态框 */
.status-box { border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 18px; border: 1px solid; }
.box-long { background: rgba(63,185,80,.1); border-color: #3fb950; color: #3fb950; box-shadow: 0 0 15px rgba(63,185,80,0.2); }
.box-short { background: rgba(248,81,73,.1); border-color: #f85149; color: #f85149; box-shadow: 0 0 15px rgba(248,81,73,0.2); }

/* 指标 */
.ind-row{display:flex;justify-content:space-between;font-size:14px;margin:8px 0;padding-bottom:6px;border-bottom:1px dashed rgba(48,54,61,0.5);}
.ind-row:last-child{border-bottom:none;}
.ind-label{color:#8b949e;}
.ind-val{font-weight:bold;color:#fff; font-family: monospace;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#ff9f0a}

/* 计划网格 */
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;}
.plan-item{background:#0d1117;padding:12px;border-radius:10px;border:1px solid #30363d;text-align:left;}
.plan-item .lbl{font-size:12px;color:#8b949e;margin-bottom:4px;}
.plan-item .val{font-size:18px;font-weight:700;font-family:monospace;}
.val.entry{color:#58a6ff}.val.sl{color:#f85149}.val.tp{color:#3fb950}
</style>
</head>
<body>

<h2>⚡ ZEC 强制亮剑终端</h2>

<button class="btn" id="btnRun" onclick="startScan()">🔍 刷新数据并生成指令</button>

<div id="resultArea" style="display:none;">
  
  <div class="win price-panel">
    <div class="price-big" id="zecPrice">--</div>
    <div class="price-chg" id="zecChg">--</div>
  </div>

  <div id="statusBox" class="status-box box-long">
    正在计算强制指令...
  </div>

  <div class="win">
    <div style="font-size:14px;font-weight:bold;color:#58a6ff;margin-bottom:10px;">📊 核心技术指标</div>
    <div class="ind-row"><span class="ind-label">日线趋势 (EMA20)</span><span class="ind-val" id="ind-ema">--</span></div>
    <div class="ind-row"><span class="ind-label">日线 RSI (超买超卖)</span><span class="ind-val" id="ind-rsi">--</span></div>
    <div class="ind-row"><span class="ind-label">1小时 MACD 动能</span><span class="ind-val" id="ind-macd">--</span></div>
  </div>

  <div class="win" id="planArea">
    <div style="font-size:14px;font-weight:bold;color:#58a6ff;margin-bottom:5px;">🎯 绝对执行计划</div>
    <div class="plan-grid">
      <div class="plan-item">
        <div class="lbl">建议进场 (现价)</div>
        <div class="val entry" id="valEntry">---</div>
      </div>
      <div class="plan-item">
        <div class="lbl">预估盈亏比</div>
        <div class="val" style="color:#fff;" id="valRR">1:2</div>
      </div>
      <div class="plan-item">
        <div class="lbl">严格止损线</div>
        <div class="val sl" id="valSL">---</div>
      </div>
      <div class="plan-item">
        <div class="lbl">目标止盈线</div>
        <div class="val tp" id="valTP">---</div>
      </div>
    </div>
    <div id="planNote" style="font-size:12px; color:#8b949e; margin-top:10px; line-height:1.5;"></div>
  </div>

</div>

<script>
const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(5);
const baseCoin = 'ZEC-USDT-SWAP';

async function fetchOKX(path){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),6000);
  try{
    const res=await fetch('https://www.okx.com'+path,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return {err:'HTTP '+res.status};
    const j=await res.json();
    if(j.code!=='0') return {err:j.msg};
    return {data:j.data};
  }catch(e){clearTimeout(t);return {err:'网络超时'};}
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closed=d.filter(x=>x[8]==='1').reverse();
  for(const x of closed){
    o.push(parseFloat(x[1]));h.push(parseFloat(x[2]));
    l.push(parseFloat(x[3]));c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

function calcEMA(closes,period){
  if(closes.length<period) return [];
  const k=2/(period+1);
  const ema=[];
  let s=0;
  for(let i=0;i<period;i++) s+=closes[i];
  ema.push(s/period);
  for(let i=period;i<closes.length;i++) ema.push(closes[i]*k+ema[ema.length-1]*(1-k));
  return new Array(period-1).fill(NaN).concat(ema);
}

function calcRSI(closes, period=14){
  if(closes.length <= period) return [];
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  const rsi = [];
  rsi[period] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    let gain = diff >= 0 ? diff : 0;
    let loss = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
    rsi[i] = 100 - (100 / (1 + avgGain / (avgLoss || 1)));
  }
  return new Array(period).fill(NaN).concat(rsi.slice(period));
}

function calcMACD(closes){
  const ema12 = calcEMA(closes, 12);
  const ema26 = calcEMA(closes, 26);
  const diff = ema12.map((v,i)=> v - ema26[i]);
  const dea = calcEMA(diff, 9);
  return { hist: (diff[diff.length-1] - dea[dea.length-1])*2 };
}

async function startScan() {
  const btn = $('btnRun');
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>计算强制指令中...';

  try {
    const tickRes = await fetchOKX(`/api/v5/market/ticker?instId=${baseCoin}`);
    if(tickRes.err) throw new Error("价格获取失败");
    const tick = tickRes.data[0];
    const last = parseFloat(tick.last);
    const open24 = parseFloat(tick.open24h);
    const chg = ((last - open24) / open24) * 100;
    
    $('zecPrice').innerText = `$${px(last)}`;
    $('zecChg').innerHTML = `24h 涨跌: <span class="${chg>=0?'L':'S'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span>`;

    const [res1h, res1d] = await Promise.all([
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1H&limit=100`),
      fetchOKX(`/api/v5/market/candles?instId=${baseCoin}&bar=1D&limit=100`)
    ]);

    const k1h = parseK(res1h.data);
    const k1d = parseK(res1d.data);

    const ema20_1d = calcEMA(k1d.c, 20)[k1d.c.length-1];
    const rsi_1d = calcRSI(k1d.c, 14)[k1d.c.length-1];
    const macd_1h = calcMACD(k1h.c);

    $('ind-ema').innerText = `$${px(ema20_1d)} (价在${last > ema20_1d ? '上' : '下'})`;
    $('ind-ema').className = 'ind-val ' + (last > ema20_1d ? 'L' : 'S');

    $('ind-rsi').innerText = `${rsi_1d.toFixed(1)} (${rsi_1d > 70 ? '超买' : rsi_1d < 30 ? '超卖' : '中性'})`;
    $('ind-rsi').className = 'ind-val ' + (rsi_1d > 70 ? 'S' : rsi_1d < 30 ? 'L' : '');

    $('ind-macd').innerText = `${macd_1h.hist > 0 ? '金叉多头' : '死叉空头'} (${macd_1h.hist.toFixed(2)})`;
    $('ind-macd').className = 'ind-val ' + (macd_1h.hist > 0 ? 'L' : 'S');

    // === 核心逻辑：强制亮剑 ===
    const statusBox = $('statusBox');
    
    // 因为 ZEC 日线大趋势是空头，所以只要价格 <= 690，我们就做超跌反弹多；只要 >= 690，我们就顺势反弹空。
    const threshold = 690; 

    if (last <= threshold) {
        statusBox.className = 'status-box box-long';
        statusBox.innerHTML = `🟢 强制执行：做多 (LONG)`;
        
        // 动态止损止盈：止损放在现价下方 2.5%，止盈放在上方 5%
        const sl = last * 0.975;
        const tp = last * 1.05;
        
        $('valEntry').innerText = px(last);
        $('valSL').innerText = px(sl);
        $('valTP').innerText = px(tp);
        $('valRR').innerText = `1:2.0`;
        $('planNote').innerHTML = `<span style="color:#f85149">⚠️ 逆势博反弹单：</span> 当前价格处于低位区，进场做多，必须严守止损。`;
    } else {
        statusBox.className = 'status-box box-short';
        statusBox.innerHTML = `🔴 强制执行：做空 (SHORT)`;
        
        // 动态止损止盈：止损放在现价上方 2.5%，止盈放在下方 5%
        const sl = last * 1.025;
        const tp = last * 0.95;
        
        $('valEntry').innerText = px(last);
        $('valSL').innerText = px(sl);
        $('valTP').innerText = px(tp);
        $('valRR').innerText = `1:2.0`;
        $('planNote').innerHTML = `<span style="color:#3fb950">✅ 顺势做空单：</span> 顺应日线空头大趋势，反弹遇阻，直接进场做空。`;
    }

    $('resultArea').style.display = 'block';

  } catch(e) {
    alert("网络错误，请刷新重试。");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔍 刷新数据并生成指令';
  }
}
</script>
</body>
</html>
