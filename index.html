<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欧易 5m 箱体震荡探测 (1小时冷却版)</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#ff9f0a;color:#000; box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.b2{background:#da3633;color:#fff}
.b3{background:#238636;color:#fff}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;text-align:center; display:flex; justify-content:space-between; align-items:center;}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin:8px 0; animation: pop 0.3s ease-out; position:relative;}
@keyframes pop { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.t{font-size:17px;font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#8b949e}.Y{color:#ff9f0a}.B{color:#58a6ff}
.info{font-size:13px;line-height:1.75;margin-top:6px; display:grid; grid-template-columns:1fr 1fr; gap:4px;}
.info span{color:#8b949e;}
.info b{color:#fff;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.empty{color:#8b949e;font-size:13px;padding:20px;text-align:center;border:1px dashed #30363d;border-radius:10px}
.badge{font-size:12px; padding:2px 8px; border-radius:12px; background:#21262d; border:1px solid #30363d;}
.timer{color:#79c0ff; font-weight:bold; font-family:monospace;}
.rank-badge { position: absolute; top: -8px; right: 12px; background: #ff9f0a; color: #000; font-weight: bold; font-size: 12px; padding: 2px 8px; border-radius: 10px; box-shadow: 0 2px 5px rgba(255,159,10,0.5); }
</style>
</head>
<body>

<div class="win">
  <h2><img src="https://www.okx.com/favicon.ico" width="20" height="20"> 5m 箱体震荡探测 (防重复)</h2>
  <button class="btn b1" id="f1">🔍 扫描最佳盈亏比箱体</button>
  <button class="btn b3" id="f_auto">⏱️ 开启 5m 自动巡航</button>
  <div class="st">
    <span id="st1">准备就绪 (请确保网络直连)</span>
    <span id="percent" style="color:#ff9f0a; font-weight:bold;">0%</span>
  </div>
  <div class="st" style="margin-top:5px; background:transparent; border:1px solid #2d3748; justify-content:center;">
    下次扫描倒计时: <span class="timer" id="countdown">--:--</span>
  </div>
  <div id="err-msg" style="display:none; margin-top:10px;">
      <div class="btn b2" onclick="location.reload()">网络请求失败 (请检查梯子)</div>
  </div>
</div>

<div id="result-area">
  <div class="win" id="list-area" style="display:none;">
    <div style="font-size:14px; color:#8b949e; margin-bottom:10px;">💡 同一币种 1 小时内仅推荐 1 次。排第一的为最佳盈亏比入场点。</div>
    <div id="out-cards"></div>
  </div>
</div>

<script>
const FIXED_COINS = [
  "BTCUSDT", "ETHUSDT", "SOXLUSDT", "SNDKUSDT", "ZECUSDT", "SOLUSDT", "NVDAUSDT", "XAUUSDT", "ANTUSDT", "MMTUSDT",
  "MUUSDT", "XRPUSDT", "SKHYNIXUSDT", "SOXSUSDT", "HYPEUSDT", "PIEVERSEUSDT", "BREVUSDT", "XAGUSDT", "KORUUSDT", "DOGEUSDT",
  "PEPEUSDT", "SPCXUSDT", "NEARUSDT", "PIPPINUSDT", "SNXXUSDT", "CLUSDT", "PUMPUSDT", "SKHYUSDT", "MSTRUSDT", "UNIUSDT",
  "QQQUSDT", "LITUSDT", "AKEUSDT", "WLDUSDT", "AMDUSDT", "AAOIUSDT", "ENAUSDT", "FILUSDT", "SUIUSDT", "INTCUSDT",
  "ZHONGJIUSDT", "NBISUSDT", "BNBUSDT", "CRCLUSDT", "TRUMPUSDT", "PENGUUSDT", "ADAUSDT", "AAVEUSDT", "TQQQUSDT", "LINKUSDT",
  "GOOGLUSDT", "UNITREEUSDT", "MRVLUSDT", "BZUSDT", "LTCUSDT", "HUMAUSDT", "INJUSDT", "STRKUSDT", "LITEUSDT", "BCHUSDT",
  "AVAXUSDT", "ASTERUSDT", "TSLAUSDT", "IRYSUSDT", "CRWVUSDT", "DRAMUSDT", "TAOUSDT", "ZROUSDT", "ARBUSDT", "SAMSUNGUSDT",
  "ZILUSDT", "UPUSDT", "ZHIPUUSDT", "VVVUSDT", "BTWUSDT", "AAPLUSDT", "XPLUSDT", "ONDOUSDT", "TRXUSDT", "OKBUSDT",
  "TSMUSDT", "NESUSDT", "AXTIUSDT", "NIGHTUSDT", "SPYUSDT", "UVXYUSDT", "MUUUSDT", "DGAIUSDT", "GRAMUSDT", "XLMUSDT",
  "ICPUSDT", "SQQQUSDT", "CXMTUSDT", "BEUSDT", "SOPHUSDT", "PROSUSDT", "EWYUSDT", "USELESSUSDT", "ZKPUSDT", "OPUSDT"
];

const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
let audioCtx = null;
let autoTimer = null;
let isScanning = false;

// 获取本地缓存的推荐历史
function getCache() {
    const raw = localStorage.getItem('okx_box_recommend_cache');
    return raw ? JSON.parse(raw) : {};
}
// 更新缓存
function updateCache(coinName) {
    const cache = getCache();
    cache[coinName] = Date.now();
    localStorage.setItem('okx_box_recommend_cache', JSON.stringify(cache));
}
// 检查是否在 1 小时内（3600000 毫秒）
function isCooldown(coinName) {
    const cache = getCache();
    const lastTime = cache[coinName];
    if (!lastTime) return false;
    return (Date.now() - lastTime) < 3600000; // 1 小时
}

function playAlert(){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

async function fetchOKXDirect(path) {
    const url = 'https://www.okx.com' + path;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    try {
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) return { err: 'HTTP ' + res.status };
        const json = await res.json();
        if (json.code !== '0') return { err: json.msg };
        return { data: json.data };
    } catch (e) {
        clearTimeout(timer);
        return { err: '网络超时' };
    }
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1');
  const data=[...closedData].reverse();
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2])); l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

async function runScan() {
  if (isScanning) return;
  isScanning = true;
  
  $('st1').innerHTML = '<span class="sp"></span>并发拉取 60 根 5m 数据中...';
  $('err-msg').style.display = 'none';
  $('list-area').style.display = 'none';
  
  const targetInstIds = FIXED_COINS.map(c => c.replace('USDT', '-USDT-SWAP'));
  
  let results = [];
  let done = 0;
  let failCount = 0;

  const promises = targetInstIds.map(async (instId) => {
    const kr = await fetchOKXDirect(`/api/v5/market/candles?instId=${instId}&bar=5m&limit=65`);
    done++;
    $('percent').innerText = `${Math.round((done/100)*100)}%`;
    
    if (kr.err || !kr.data || kr.data.length < 60) {
        failCount++;
        return;
    }

    const kp = parseK(kr.data);
    const { c, h, l } = kp;
    
    const recent60 = { c: c.slice(-60), h: h.slice(-60), l: l.slice(-60) };
    const curPrice = recent60.c[recent60.c.length - 1];
    
    const maxH = Math.max(...recent60.h);
    const minL = Math.min(...recent60.l);
    
    const amp = (maxH - minL) / minL * 100;
    if (amp < 0.3 || amp > 5.0) return; 

    const boxPos = (curPrice - minL) / (maxH - minL); 
    if (boxPos > 0.35 && boxPos < 0.65) return; 

    let touchTop = 0, touchBottom = 0;
    for(let i=0; i<60; i++) {
        if(recent60.h[i] >= maxH * 0.998) touchTop++;
        if(recent60.l[i] <= minL * 1.002) touchBottom++;
    }
    if(touchTop < 1 || touchBottom < 1) return;

    // ================= 核心打分体系 =================
    let scoreHardness = 0;
    scoreHardness += Math.min(20, (touchTop + touchBottom) * 4);
    if (amp >= 0.5 && amp <= 2.0) scoreHardness += 20;
    else if (amp > 2.0 && amp <= 3.5) scoreHardness += 10;

    let scoreRR = 0; 
    if (boxPos <= 0.1) scoreRR = 60; 
    else if (boxPos <= 0.2) scoreRR = 50;
    else if (boxPos <= 0.35) scoreRR = 40;
    else if (boxPos >= 0.9) scoreRR = 60; 
    else if (boxPos >= 0.8) scoreRR = 50;
    else if (boxPos >= 0.65) scoreRR = 40;

    const totalScore = scoreHardness + scoreRR;
    if (totalScore < 70) return; 

    const base = instId.split('-')[0];

    // === 【核心新增】：检查冷却时间 ===
    if (isCooldown(base)) {
        return; // 1小时内推荐过，直接抛弃
    }

    let signal = '';
    let stopLoss = 0;
    let tp = 0;

    if (boxPos <= 0.35) {
      signal = 'LONG';
      stopLoss = minL * 0.995; 
      tp = maxH; 
    } else {
      signal = 'SHORT';
      stopLoss = maxH * 1.005; 
      tp = minL; 
    }

    const risk = Math.abs(curPrice - stopLoss);
    const reward = Math.abs(tp - curPrice);
    const rr = (reward / risk).toFixed(1);

    // 记录到缓存中
    updateCache(base);

    results.push({
      base, curPrice, maxH, minL, amp, signal, stopLoss, tp, totalScore, touchTop, touchBottom, rr
    });
  });

  await Promise.all(promises);
  isScanning = false;
  
  if (failCount === 100) {
      $('st1').innerText = `❌ 网络全盘失败`;
      $('err-msg').style.display = 'block';
      return;
  }

  results.sort((a, b) => b.totalScore - a.totalScore);

  if (results.length > 0) {
    let html = '';
    results.forEach((x, index) => {
      const isLong = x.signal === 'LONG';
      const color = isLong ? '#3fb950' : '#f85149';
      const dirTxt = isLong ? '箱底做多 🚀' : '箱顶做空 🌊';
      const scoreColor = x.totalScore >= 90 ? '#3fb950' : '#ff9f0a';
      
      let rankHtml = '';
      if(index === 0) rankHtml = `<div class="rank-badge">🏆 最佳盈亏比</div>`;
      else if(index === 1) rankHtml = `<div class="rank-badge" style="background:#c0c0c0;">🥈 亚军</div>`;
      else if(index === 2) rankHtml = `<div class="rank-badge" style="background:#cd7f32;">🥉 季军</div>`;

      html += `
        <div class="card">
          ${rankHtml}
          <div class="t" style="margin-top:5px;">
            <span>${x.base} <span class="badge" style="border-color:${scoreColor}; color:${scoreColor}">${x.totalScore}分</span></span>
            <span class="badge" style="color:${color}">${dirTxt}</span>
          </div>
          <div class="info">
            <span>现价:</span> <b>${px(x.curPrice)}</b>
            <span>预估盈亏比:</span> <b class="L">1:${x.rr}</b>
            <span>箱顶(压):</span> <b class="S">${px(x.maxH)}</b>
            <span>箱底(撑):</span> <b class="L">${px(x.minL)}</b>
            <span>建议止损:</span> <b class="Y">${px(x.stopLoss)}</b>
            <span>建议止盈:</span> <b class="B">${px(x.tp)}</b>
            <span>触顶次数:</span> <b>${x.touchTop}次</b>
            <span>触底次数:</span> <b>${x.touchBottom}次</b>
          </div>
        </div>
      `;
    });
    $('out-cards').innerHTML = html;
    $('st1').innerText = `✅ 发现 ${results.length} 个高分新箱体`;
    $('list-area').style.display = 'block';
    
    if(results[0].totalScore >= 90) playAlert();
    
  } else {
    $('st1').innerText = `✅ 扫描完毕，暂无新箱体`;
    $('out-cards').innerHTML = `<div class="empty">符合标准的高分箱体已在1小时内推荐过，或当前全市场无完美横盘。</div>`;
    $('list-area').style.display = 'block';
  }
}

// 定时器
let countdownTimer = null;
function startAutoScan() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  
  $('f_auto').innerText = '🛑 停止自动巡航';
  $('f_auto').classList.replace('b3', 'b2');
  
  const nextScan = () => {
    const now = Date.now();
    const next5m = Math.ceil(now / 300000) * 300000 + 2000;
    
    if(countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        const left = Math.max(0, next5m - Date.now());
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        $('countdown').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        
        if (left <= 0) {
            clearInterval(countdownTimer);
            runScan();
            if(autoTimer) nextScan();
        }
    }, 1000);
    autoTimer = true;
  };
  
  runScan();
  nextScan();
}

$('f1').onclick = () => {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    runScan();
};

$('f_auto').onclick = () => {
  if(autoTimer) {
      autoTimer = null;
      clearInterval(countdownTimer);
      $('f_auto').innerText = '⏱️ 开启 5m 自动巡航';
      $('f_auto').classList.replace('b2', 'b3');
      $('countdown').innerText = '--:--';
      $('st1').innerText = '自动巡航已停止';
  } else {
      startAutoScan();
  }
};
</script>
</body>
</html>
