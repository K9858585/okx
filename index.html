<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欧易 15m EMA5-9缠绕箱体 · BTC定向 · 窄止盈</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#ff9f0a;color:#000; box-shadow:0 4px 15px rgba(255,159,10,0.3)}
.b2{background:#da3633;color:#fff}
.b3{background:#238636;color:#fff}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;text-align:center; display:flex; justify-content:space-between; align-items:center;}
.card{background:#161b22;border:2px solid #ff9f0a;border-radius:14px;padding:16px;margin:15px 0; animation: pop 0.3s ease-out; position:relative; box-shadow: 0 0 20px rgba(255,159,10,0.15)}
@keyframes pop { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.t{font-size:20px;font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#8b949e}.Y{color:#ff9f0a}.B{color:#58a6ff}
.info{font-size:14px;line-height:1.8;margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#0d1117; padding:12px; border-radius:8px;}
.info span{color:#8b949e;}
.info b{color:#fff;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.empty{color:#8b949e;font-size:13px;padding:20px;text-align:center;border:1px dashed #30363d;border-radius:10px}
.badge{font-size:14px; padding:4px 10px; border-radius:12px; background:#21262d; border:1px solid #30363d;}
.timer{color:#79c0ff; font-weight:bold; font-family:monospace;}
.crown-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, #ff9f0a, #ffb347); color: #000; font-weight: bold; font-size: 14px; padding: 4px 16px; border-radius: 12px; box-shadow: 0 4px 10px rgba(255,159,10,0.4); white-space: nowrap;}
.ema-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; margin-left:6px; }
.ema-fast { background:#1f3a2b; color:#3fb950; border:1px solid #3fb950; }
.ema-slow { background:#3a1f1f; color:#f85149; border:1px solid #f85149; }
.btc-banner{display:flex;justify-content:center;gap:14px;font-size:13px;margin-top:8px;padding:8px;background:#161b22;border-radius:8px;border:1px solid #30363d}
.btc-banner .up{color:#3fb950;font-weight:700}
.btc-banner .down{color:#f85149;font-weight:700}
.btc-banner .flat{color:#8b949e;font-weight:700}
</style>
</head>
<body>

<div class="win">
  <h2><img src="https://www.okx.com/favicon.ico" width="20" height="20"> 15m EMA5-9缠绕 + BTC定向 + 窄止盈</h2>
  <button class="btn b1" id="f1">🔍 寻找EMA5-9缠绕箱体</button>
  <button class="btn b3" id="f_auto">⏱️ 开启 5m 自动巡航</button>
  <div class="st">
    <span id="st1">准备就绪</span>
    <span id="percent" style="color:#ff9f0a; font-weight:bold;">0%</span>
  </div>
  <div class="st" style="margin-top:5px; background:transparent; border:1px solid #2d3748; justify-content:center;">
    下次扫描倒计时: <span class="timer" id="countdown">--:--</span>
  </div>
  <div class="btc-banner" id="btcBanner">
    <span>BTC 30m 定向:</span>
    <span id="btcDir" class="flat">等待扫描...</span>
  </div>
</div>

<div id="result-area">
  <div class="win" id="list-area" style="display:none; background: transparent; border: none; padding: 0;">
    <div id="out-cards"></div>
  </div>
</div>

<script>
const FIXED_COINS = [
  "BTCUSDT", "ETHUSDT", "SOXLUSDT", "SNDKUSDT", "ZECUSDT", "SOLUSDT", "NVDAUSDT", "XAUUSDT", "ANTUSDT", "MMTUSDT",
  "MUUSDT", "XRPUSDT", "SKHYNIXUSDT", "SOXSUSDT", "HYPEUSDT", "PIEVERSEUSDT", "BREVUSDT", "XAGUSDT", "KORUUSDT", "DOGEUSDT",
  "PEPEUSDT", "SPCXUSDT", "NEARUSDT", "PIPPINUSDT", "SNXXUSDT", "CLUSDT", "PUMPUSDT", "SKHYUSDT", "MSTRUSDT", "UNIUSDT",
  "QQQUSDT", "LITUSDT", "AKEUSDT", "WLDUSDT", "AMDUSDT", "AAOIUSDT", "ENAUSDT", "FILUSDT", "SUIUSDT", "INTCUSDT",
  "ZHONGJIUSDT", "NBISUSDT", "BNBUSDT", "CRCLUSDT", "TRUMPUSDT", "PENGUUSDT", "ADAUSDT", "AAVEUSDT", "TQQQUSDT", "LINKUSDT",
  "GOOGLUSDT", "UNITREEUSDT", "MRVLUSDT", "BZUSDT", "LTCUSDT", "HUMAUSDT", "INJUSDT", "STRKUSDT", "LITEUSDT", "BCHUSDT",
  "AVAXUSDT", "ASTERUSDT", "TSLAUSDT", "IRYSUSDT", "CRWVUSDT", "DRAMUSDT", "TAOUSDT", "ZROUSDT", "ARBUSDT", "SAMSUNGUSDT",
  "ZILUSDT", "UPUSDT", "ZHIPUUSDT", "VVVUSDT", "BTWUSDT", "AAPLUSDT", "XPLUSDT", "ONDOUSDT", "TRXUSDT", "OKBUSDT",
  "TSMUSDT", "NESUSDT", "AXTIUSDT", "NIGHTUSDT", "SPYUSDT", "UVXYUSDT", "MUUUSDT", "DGAIUSDT", "GRAMUSDT", "XLMUSDT",
  "ICPUSDT", "SQQQUSDT", "CXMTUSDT", "BEUSDT", "SOPHUSDT", "PROSUSDT", "EWYUSDT", "USELESSUSDT", "ZKPUSDT", "OPUSDT"
];

const $=i=>document.getElementById(i);
const px=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
let audioCtx = null;
let autoTimer = null;
let isScanning = false;

function getCache() {
    const raw = localStorage.getItem('okx_ema_box_cache');
    return raw ? JSON.parse(raw) : {};
}
function updateCache(coinName) {
    const cache = getCache();
    cache[coinName] = Date.now();
    localStorage.setItem('okx_ema_box_cache', JSON.stringify(cache));
}
function isCooldown(coinName) {
    const cache = getCache();
    const lastTime = cache[coinName];
    if (!lastTime) return false;
    return (Date.now() - lastTime) < 3600000;
}

function playAlert(){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

async function fetchOKXDirect(path) {
    const url = 'https://www.okx.com' + path;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    try {
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) return { err: 'HTTP ' + res.status };
        const json = await res.json();
        if (json.code !== '0') return { err: json.msg };
        return { data: json.data };
    } catch (e) {
        clearTimeout(timer);
        return { err: '网络超时' };
    }
}

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1');
  const data=[...closedData].reverse();
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2])); l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

// ===== EMA 计算 =====
function calcEMA(closes, period) {
    if (closes.length < period) return [];
    const k = 2 / (period + 1);
    const ema = [];
    let sum = 0;
    for (let i = 0; i < period; i++) sum += closes[i];
    ema.push(sum / period);
    for (let i = period; i < closes.length; i++) {
        ema.push(closes[i] * k + ema[ema.length - 1] * (1 - k));
    }
    return new Array(period - 1).fill(NaN).concat(ema);
}

// ===== 核心：EMA5-9 缠绕判定 + 箱体检测 =====
// 缠绕定义：在窗口内EMA5与EMA9相互穿越 >=3次，且两线距离（归一化）始终较小，
// 同时K线高低点齐平构成箱体。
function detectEmaTangleBox(k15m) {
    const closes = k15m.c;
    const highs = k15m.h;
    const lows = k15m.l;
    const n = closes.length;
    if (n < 30) return null;

    const ema5 = calcEMA(closes, 5);
    const ema9 = calcEMA(closes, 9);

    const maxLen = Math.min(25, n - 9);
    let bestBox = null;

    for (let len = 10; len <= maxLen; len++) {
        const startIdx = n - len;
        const winHighs = highs.slice(startIdx);
        const winLows = lows.slice(startIdx);
        const winCloses = closes.slice(startIdx);
        const winEma5 = ema5.slice(startIdx);
        const winEma9 = ema9.slice(startIdx);

        if (winEma5.some(v => isNaN(v)) || winEma9.some(v => isNaN(v))) continue;

        // ---- 1. 缠绕判定 ----
        // 交叉次数
        let crossCount = 0;
        let prevRel = null;
        // 两线距离最大值（相对于箱体高度，稍后算）
        let maxEmaGap = 0;
        for (let i = 0; i < len; i++) {
            const rel = winEma5[i] > winEma9[i] ? 1 : -1;
            if (prevRel !== null && rel !== prevRel) crossCount++;
            prevRel = rel;
            const gap = Math.abs(winEma5[i] - winEma9[i]);
            if (gap > maxEmaGap) maxEmaGap = gap;
        }
        // 缠绕要求：交叉至少3次（也就是来回缠绕 >= 2个完整周期）
        if (crossCount < 3) continue;

        // ---- 2. 箱体高低点齐平 ----
        const maxH = Math.max(...winHighs);
        const minL = Math.min(...winLows);
        const range = maxH - minL;
        if (range <= 0) continue;
        const amp = range / minL * 100;
        // 振幅范围：0.8% ~ 3.2%（窄一点更适合窄止盈）
        if (amp < 0.8 || amp > 3.2) continue;

        // 高点齐平
        const sortedH = [...winHighs].sort((a,b)=>b-a);
        const diffH = sortedH[0] - sortedH[2];
        if (diffH / range > 0.25) continue;

        // 低点齐平
        const sortedL = [...winLows].sort((a,b)=>a-b);
        const diffL = sortedL[2] - sortedL[0];
        if (diffL / range > 0.25) continue;

        // ---- 3. EMA缠绕的紧密度 ----
        // 两线最大距离不应超过箱体高度的35%，否则不算缠绕
        if (maxEmaGap / range > 0.35) continue;

        // ---- 4. 位置（入场点判断，方向稍后由BTC决定） ----
        const curPrice = winCloses[winCloses.length - 1];
        // 允许贴近箱底的“做多候选”或贴近箱顶的“做空候选”
        let near = null;
        if (curPrice <= minL * 1.006 && curPrice >= minL * 0.994) near = 'BOTTOM';
        else if (curPrice >= maxH * 0.994 && curPrice <= maxH * 1.006) near = 'TOP';
        if (!near) continue;

        // 打分：交叉多、振幅小、EMA更贴近
        let score = 0;
        score += Math.min(crossCount * 8, 40);
        score += Math.max(0, 100 - amp * 28);
        const gapRatio = maxEmaGap / range;
        score += Math.max(0, (1 - gapRatio) * 30);
        score = Math.round(Math.min(score, 100));

        if (!bestBox || score > bestBox.score) {
            bestBox = {
                len, startIdx, maxH, minL, amp, crossCount, near, score,
                curPrice, maxEmaGap
            };
        }
    }

    return bestBox;
}

// ===== 获取 BTC 前30分钟方向（用15m K线：最近2根已收盘K线） =====
async function getBtcDirection() {
    const res = await fetchOKXDirect(`/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=15m&limit=5`);
    if (res.err || !res.data || res.data.length < 3) return { dir: 'FLAT', detail: '数据不足' };

    const k = parseK(res.data);
    if (k.c.length < 3) return { dir: 'FLAT', detail: '数据不足' };

    // 最后两根已收盘K线代表前30分钟
    const last = k.c.length - 1;
    const open30 = k.o[last - 1];      // 前第2根开盘
    const closeNow = k.c[last];        // 最近一根收盘
    const change = (closeNow - open30) / open30 * 100;

    let dir = 'FLAT';
    if (change > 0.15) dir = 'UP';
    else if (change < -0.15) dir = 'DOWN';

    return { dir, change, detail: `前30分钟涨跌 ${change.toFixed(2)}%` };
}

async function runScan() {
  if (isScanning) return;
  isScanning = true;
  
  $('st1').innerHTML = '<span class="sp"></span>获取BTC方向 + 扫描EMA5-9缠绕箱体...';
  $('list-area').style.display = 'none';

  // ---- 先取 BTC 方向 ----
  const btc = await getBtcDirection();
  const btcDirEl = $('btcDir');
  if (btc.dir === 'UP') {
      btcDirEl.className = 'up';
      btcDirEl.innerText = `📈 上涨 ${btc.change.toFixed(2)}% → 只做多`;
  } else if (btc.dir === 'DOWN') {
      btcDirEl.className = 'down';
      btcDirEl.innerText = `📉 下跌 ${btc.change.toFixed(2)}% → 只做空`;
  } else {
      btcDirEl.className = 'flat';
      btcDirEl.innerText = `➖ 横盘 ${btc.change.toFixed(2)}% → 双向谨慎`;
  }

  if (btc.dir === 'FLAT') {
      // 横盘不操作，直接结束
      $('st1').innerText = 'BTC横盘，方向不明，暂停扫描';
      $('out-cards').innerHTML = `<div class="empty" style="margin-top:15px;">BTC前30分钟涨跌不足0.15%，方向不明，按策略不交易。等待BTC选择方向。</div>`;
      $('list-area').style.display = 'block';
      $('percent').innerText = '100%';
      isScanning = false;
      return;
  }

  // 根据BTC方向决定允许的信号
  const allowSignal = btc.dir === 'UP' ? 'LONG' : 'SHORT';
  const targetInstIds = FIXED_COINS.map(c => c.replace('USDT', '-USDT-SWAP'));
  let allValidSignals = [];
  let done = 0;

  const promises = targetInstIds.map(async (instId) => {
    const [res15m, res5m] = await Promise.all([
        fetchOKXDirect(`/api/v5/market/candles?instId=${instId}&bar=15m&limit=50`),
        fetchOKXDirect(`/api/v5/market/candles?instId=${instId}&bar=5m&limit=15`) 
    ]);
    
    done++;
    $('percent').innerText = `${Math.round((done/FIXED_COINS.length)*100)}%`;
    
    if (res15m.err || !res15m.data || res15m.data.length < 30) return;
    if (res5m.err || !res5m.data || res5m.data.length < 10) return;

    const k15m = parseK(res15m.data);
    const k5m = parseK(res5m.data);

    const box = detectEmaTangleBox(k15m);
    if (!box) return;

    const { near, maxH, minL, amp, crossCount, score, curPrice, len } = box;

    // ---- 方向匹配：BTC上涨只做“贴近箱底”的多；BTC下跌只做“贴近箱顶”的空 ----
    let signal = null;
    if (btc.dir === 'UP' && near === 'BOTTOM') signal = 'LONG';
    else if (btc.dir === 'DOWN' && near === 'TOP') signal = 'SHORT';
    if (!signal) return;

    // 5m价格确认
    const last5mClose = k5m.c[k5m.c.length - 1];
    if (signal === 'LONG' && last5mClose < minL * 0.99) return;
    if (signal === 'SHORT' && last5mClose > maxH * 1.01) return;

    const base = instId.split('-')[0];
    if (isCooldown(base)) return; 

    // === 窄止盈：箱体高度的 45%，止损 0.35% ===
    let stopLoss = 0, tp = 0;
    const boxHeight = maxH - minL;
    
    if (signal === 'LONG') {
        stopLoss = minL * 0.9965;                 // 箱底外约0.35%
        tp = minL + boxHeight * 0.45;             // 只吃箱体的45%
    } else {
        stopLoss = maxH * 1.0035;                 // 箱顶外约0.35%
        tp = maxH - boxHeight * 0.45;
    }

    const risk = Math.abs(curPrice - stopLoss);
    const reward = Math.abs(tp - curPrice);
    let rr = 0;
    if (risk > 0) rr = (reward / risk).toFixed(1);

    updateCache(base);

    allValidSignals.push({
      base, curPrice, maxH, minL, amp, signal, stopLoss, tp, rr, finalScore: score, len, crossCount
    });
  });

  await Promise.all(promises);
  isScanning = false;
  
  allValidSignals.sort((a, b) => b.finalScore - a.finalScore);

  if (allValidSignals.length > 0) {
    const best = allValidSignals[0]; 
    const isLong = best.signal === 'LONG';
    const color = isLong ? '#3fb950' : '#f85149';
    const dirTxt = isLong ? '箱底做多 🚀 (顺BTC)' : '箱顶做空 🌊 (顺BTC)';

    let html = `
      <div class="card">
        <div class="crown-badge">👑 EMA5-9缠绕 + BTC定向</div>
        <div class="t" style="margin-top:10px;">
          <span>${best.base} 
            <span class="badge" style="color:${color}; border-color:${color}; font-weight:bold;">${dirTxt}</span>
          </span>
          <span class="badge" style="color:#ff9f0a; border-color:#ff9f0a;">${best.finalScore}分</span>
        </div>
        <div class="info">
          <span>现价:</span> <b>${px(best.curPrice)}</b>
          <span>预估盈亏比:</span> <b class="L">1:${best.rr}</b>
          <span>箱顶:</span> <b class="S">${px(best.maxH)}</b>
          <span>箱底:</span> <b class="L">${px(best.minL)}</b>
          <span>震荡振幅:</span> <b class="N">${best.amp.toFixed(2)}%</b>
          <span>箱体根数:</span> <b class="N">${best.len} 根</b>
          <span>EMA5-9交叉:</span> <b class="Y">${best.crossCount} 次</b>
          <span>BTC方向:</span> <b class="${btc.dir==='UP'?'L':'S'}">${btc.dir==='UP'?'上涨':'下跌'}</b>
          <span>建议止损:</span> <b class="Y">${px(best.stopLoss)}</b>
          <span>建议止盈:</span> <b class="B">${px(best.tp)} (吃45%)</b>
        </div>
      </div>
    `;
    
    $('out-cards').innerHTML = html;
    $('st1').innerText = `✅ 已锁定：${best.base}`;
    $('list-area').style.display = 'block';
    
    playAlert();
    
  } else {
    $('st1').innerText = `✅ 扫描完毕，暂无符合BTC方向的EMA缠绕箱体`;
    $('out-cards').innerHTML = `<div class="empty" style="margin-top:15px;">当前BTC方向为${btc.dir==='UP'?'上涨':'下跌'}，但没有找到对应的EMA5-9缠绕箱体。耐心等待！</div>`;
    $('list-area').style.display = 'block';
  }
}

let countdownTimer = null;
function startAutoScan() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  
  $('f_auto').innerText = '🛑 停止自动巡航';
  $('f_auto').classList.replace('b3', 'b2');
  
  const nextScan = () => {
    const now = Date.now();
    const next5m = Math.ceil(now / 300000) * 300000 + 2000;
    
    if(countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        const left = Math.max(0, next5m - Date.now());
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        $('countdown').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        
        if (left <= 0) {
            clearInterval(countdownTimer);
            runScan();
            if(autoTimer) nextScan();
        }
    }, 1000);
    autoTimer = true;
  };
  
  runScan();
  nextScan();
}

$('f1').onclick = () => {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    runScan();
};

$('f_auto').onclick = () => {
  if(autoTimer) {
      autoTimer = null;
      clearInterval(countdownTimer);
      $('f_auto').innerText = '⏱️ 开启 5m 自动巡航';
      $('f_auto').classList.replace('b2', 'b3');
      $('countdown').innerText = '--:--';
      $('st1').innerText = '自动巡航已停止';
  } else {
      startAutoScan();
  }
};
</script>
</body>
